azon S3 バケットに継続して保存する", "CloudTrail のイベント履歴の保存期間を無期限に延ばす設定を行う", "Amazon CloudWatch のアラームを作成する", "AWS Artifact から過去の操作記録をダウンロードする"], "a": [0], "e": "<b>正解：証跡を作って S3 に保存<\/b>。イベント履歴は、リージョンごとに<b>過去90日<\/b>の管理イベントを見るためのもの。それより長く残すには、<b>証跡（トレイル）<\/b>で S3 バケットへ届ける（CloudWatch Logs へも送れる）。<br>×イベント履歴を無期限に：イベント履歴は過去90日の記録。延ばす設定ではなく、証跡を使う。<br>×CloudWatch のアラーム：しきい値を超えたら通知するもの。記録を残す仕組みではない。<br>×Artifact：AWS のコンプライアンスレポートと契約。お客様の操作記録はない。<div class=\"mem\">90日を過ぎたら消える「履歴」、残したいなら「証跡」を S3 へ。<\/div>", "trap": "TRAP 09", "src": "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html"}, {"s": 2, "q": "AWS CloudTrail について、正しいものを", "o": ["イベント履歴では、リージョンごとに過去90日の管理イベントを検索・表示できる", "証跡を作成すると、既定では管理イベントが記録され、データイベントは記録されない", "データイベントは量が少ないため、すべてのアカウントで常に自動で記録される", "CloudTrail は EC2 インスタンスの CPU 使用率やメモリ使用率を記録するサービスである", "コンソールで作成した証跡は、作成したリージョンの操作しか記録できない"], "a": [0, 1], "e": "<b>正解：イベント履歴は過去90日の管理イベント、証跡の既定は管理イベントのみ<\/b>。<br>×データイベントは常に自動：逆。データイベントは量が多く、既定では記録されない（言い切りにも注意）。<br>×CPU 使用率：性能の数値は Amazon CloudWatch。<br>×作成リージョンだけ：コンソールで作る証跡はマルチリージョンの証跡で、有効なすべてのリージョンの操作を1つの S3 バケットに集められる。<div class=\"mem\">CloudTrail＝足跡。どのくらい（性能）は CloudWatch。<\/div>", "trap": "TRAP 06", "src": "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html"}, {"s": 2, "q": "ある会社は、AWS Organizations の全アカウントに、複数の AWS Config ルールと、違反時の修復アクションを1つのまとまりとして一度に展開したい。最も適切なものはどれか。", "o": ["AWS Config のコンフォーマンスパック", "AWS Artifact のレポート", "AWS CloudTrail の組織の証跡", "AWS Trusted Advisor のセキュリティチェック"], "a": [0], "e": "<b>正解：AWS Config のコンフォーマンスパック（適合パック）<\/b>。合図は「Config ルールと修復アクションをまとめて」「組織全体に」。コンフォーマンスパックは、Config ルールと修復アクションの集まりを1つの単位として、1つのアカウントとリージョン、または組織全体に展開できる。テンプレート（YAML）で書き、サンプルも用意されている。<br>×Artifact のレポート：AWS 自身の監査の資料。お客様の設定は評価しない。<br>×組織の証跡：全アカウントの API 操作を記録する。ルールの評価や修復はしない。<br>×Trusted Advisor：AWS が用意した点検項目。自分のルールのまとまりを展開するものではない。<div class=\"mem\">コンフォーマンス（conformance）＝適合。ルールの「詰め合わせパック」。<\/div>", "trap": "", "src": "https://docs.aws.amazon.com/config/latest/developerguide/conformance-packs.html"}, {"s": 2, "q": "運用チームは、本番の EC2 インスタンスの CPU 使用率が80%を超えた状態が続いたら、すぐに通知を受け取りたい。最も適切なものはどれか。", "o": ["Amazon CloudWatch のアラームを作成し、しきい値を超えたら Amazon SNS で通知する", "AWS CloudTrail の証跡を作成して、API の呼び出しを記録する", "AWS Config ルールで、インスタンスタイプが許可されたものかを評価する", "AWS Trusted Advisor の推奨事項を毎週確認する"], "a": [0], "e": "<b>正解：CloudWatch のアラーム（＋SNS で通知）<\/b>。合図は「CPU 使用率」「しきい値」「通知」。CloudWatch のアラームはメトリクスを決めたしきい値と比べて見張り、超えたら通知したり、自動のアクションを起こしたりできる。<br>×CloudTrail：誰が何の API を呼んだかの記録。性能の数値は見ない。<br>×Config ルール：設定がルールに合っているか。使用率は見ない。<br>×Trusted Advisor：ベストプラクティスの点検。リアルタイムの監視と通知の仕組みではない。", "trap": "TRAP 06", "src": "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html"}, {"s": 2, "q": "セキュリティに関係するログの集め方・置き場所として、正しいものを", "o": ["CloudTrail の証跡で、API の操作の記録を Amazon S3 バケットに届ける", "アプリケーションやサービスのログを Amazon CloudWatch Logs のロググループに集めて検索する", "お客様のアカウントの操作ログは、AWS Artifact に自動で保存される", "AWS Trusted Advisor が、すべての API の呼び出しを無期限に保存する", "Amazon Macie が、EC2 インスタンスの OS のログを集めて保存する"], "a": [0, 1], "e": "<b>正解：CloudTrail の証跡 → S3、アプリのログ → CloudWatch Logs<\/b>。証跡は CloudWatch Logs にも送れる。CloudWatch Logs では Logs Insights で検索・分析できる。<br>×Artifact：AWS のコンプライアンスレポートと契約の置き場。お客様のログはない。<br>×Trusted Advisor：点検のサービス。ログの保存先ではない。<br>×Macie：S3 の機密データの発見。OS のログは集めない。<div class=\"mem\">「操作の記録」は CloudTrail、「アプリの出力・数値」は CloudWatch。どちらも保存先は S3 か CloudWatch Logs。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-concepts.html"}, {"s": 2, "q": "ある会社は、保存データを暗号化する鍵について、鍵のポリシー（誰が使えるか）を自分たちで決め、ローテーションの有無や削除のタイミングも自分たちで管理したい。専用のハードウェアは求められていない。最も適切なものはどれか。", "o": ["AWS KMS のカスタマーマネージドキー", "AWS KMS の AWS マネージドキー", "AWS 所有キー（AWS owned key）", "AWS Certificate Manager の証明書"], "a": [0], "e": "<b>正解：カスタマーマネージドキー<\/b>。合図は「ポリシーを自分で」「ローテーションや削除も自分で」。お客様が作成・所有・管理する鍵で、キーポリシー、有効化・無効化、ローテーション、削除のスケジュールまで管理できる（鍵ごとの月額料金と使用料がかかる）。<br>×AWS マネージドキー：AWS のサービスがお客様のアカウントに作る鍵。見ることはできるが、ポリシーの変更や削除はできず、ローテーションは毎年自動。<br>×AWS 所有キー：AWS のサービスが自分のアカウントで持つ鍵。お客様は見ることも管理することもできない（料金はかからない）。<br>×Certificate Manager：通信の暗号化（TLS）の証明書。<div class=\"mem\">管理の自由度：カスタマーマネージド（全部自分）＞ AWS マネージド（見るだけ）＞ AWS 所有（見えない）。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html"}, {"s": 2, "q": "AWS KMS の AWS マネージドキー（エイリアスが aws/ で始まる鍵。例：aws/ebs）について、正しいものを", "o": ["毎年（約365日ごと）自動でローテーションされ、その間隔は変更できない", "鍵が存在することに対する月額料金はかからない", "お客様がキーポリシーを自由に書き換えられる", "お客様が削除をスケジュールできる", "この鍵で暗号化したリソースを、別の AWS アカウントと自由に共有できる"], "a": [0, 1], "e": "<b>正解：毎年自動ローテーション、月額料金なし<\/b>（使用料はかかる場合がある。サービスが負担する場合もある）。<br>×キーポリシーを書き換え：見ることはできるが変更できない。<br>×削除のスケジュール：できない。<br>×別アカウントと共有：AWS マネージドキーで暗号化したリソースは、他のアカウントと共有できない。共有したいならカスタマーマネージドキー。<div class=\"mem\">AWS マネージドキー＝「AWS におまかせ、自分は見るだけ」。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html"}, {"s": 2, "q": "規制により、暗号鍵を自社だけが使える HSM（ハードウェアセキュリティモジュール）で管理するため、AWS CloudHSM を採用した。CloudHSM について正しいものを", "o": ["お客様は、クラスター内の各 HSM にシングルテナント（自社専用）でアクセスできる", "HSM が故障したりネットワークから外れたりすると、AWS が自動で置き換える", "HSM の認証情報を紛失しても、AWS に依頼すれば鍵を取り出してもらえる", "鍵の作成や管理の作業はすべて AWS が行うため、お客様は何もしなくてよい", "CloudHSM は、他のお客様と同じ HSM を共有して料金を下げる仕組みである"], "a": [0, 1], "e": "<b>正解：シングルテナント、故障した HSM は AWS が自動で置き換え<\/b>。AWS はハードウェアとファームウェアを管理するが、<b>HSM の中の鍵やデータにはアクセスできない<\/b>。<br>×AWS に鍵を取り出してもらう：AWS は鍵にも認証情報にもアクセスできないので、紛失すると復旧できない。<br>×すべて AWS：鍵と HSM のユーザーの管理はお客様。<br>×共有：HSM はお客様ごとに専用。<div class=\"mem\">CloudHSM＝自分専用の金庫。金庫の修理は AWS、鍵を持つのは自分だけ（なくしたら開かない）。<\/div>", "trap": "TRAP 05", "src": "https://aws.amazon.com/cloudhsm/faqs/"}, {"s": 2, "q": "ある会社は、外部の認証局から購入した SSL/TLS 証明書を AWS Certificate Manager（ACM）にインポートし、Application Load Balancer で使っている。この証明書の更新について正しいものはどれか。", "o": ["インポートした証明書は ACM が自動で更新しないため、有効期限を自分で管理して差し替える", "ACM にインポートした証明書は、すべて ACM が自動で更新する", "AWS KMS に証明書を移すと、自動で更新されるようになる", "AWS Shield Advanced を有効にすると、証明書が自動で更新される"], "a": [0], "e": "<b>正解：インポートした証明書は自分で管理<\/b>。ACM が自動で更新するのは、<b>ACM で発行し、ACM と統合されたサービス（ELB、CloudFront、API Gateway など）で使う証明書<\/b>。外部から持ち込んだ証明書は更新できないので、期限を追って差し替える。<br>×すべて自動：言い切り。インポートした証明書は対象外。<br>×KMS に移す：KMS は暗号鍵の管理。証明書の更新はしない。<br>×Shield Advanced：DDoS 対策。証明書とは関係ない。<div class=\"mem\">ACM で「作った」証明書は自動更新、「持ち込んだ」証明書は自分で更新。<\/div>", "trap": "TRAP 07", "src": "https://aws.amazon.com/certificate-manager/faqs/"}, {"s": 2, "q": "EC サイトのログイン画面に、同じ IP アドレスから短い時間に大量のリクエストが送られてくる。一定の速さを超えたリクエストだけを自動で制限したい。最も適切なものはどれか。", "o": ["AWS WAF の Web ACL に、レートベースのルールを追加する", "AWS Shield Standard を申し込む", "Amazon Inspector でインスタンスをスキャンする", "AWS KMS で通信を暗号化する"], "a": [0], "e": "<b>正解：AWS WAF のレートベースのルール<\/b>。合図は「同じ IP から」「速さを超えたものだけ制限」。レートベースのルールは、届いたリクエストを数え、速すぎるものを制限する。ルールは Web ACL（ウェブアクセスコントロールリスト。新しいコンソールでは保護パック）に入れ、CloudFront や ALB などに関連付ける。<br>×Shield Standard：申し込みは不要で、全員に自動で適用される。主にネットワーク層と転送層（第3・4層）の DDoS が対象で、IP ごとの細かい速度制限の設定はしない。<br>×Inspector：脆弱性のスキャン。<br>×KMS：保存時の暗号化の鍵。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html"}, {"s": 2, "q": "AWS WAF の Web ACL を直接関連付けて保護できるリソースはどれか。", "o": ["Amazon CloudFront のディストリビューション", "Application Load Balancer", "Network Load Balancer", "Amazon EBS ボリューム", "Amazon S3 Glacier のアーカイブ"], "a": [0, 1], "e": "<b>正解：CloudFront と Application Load Balancer<\/b>。ほかに Amazon API Gateway の REST API、AWS AppSync、Amazon Cognito のユーザープール、AWS App Runner、AWS Amplify なども対象。WAF は HTTP(S) のリクエスト（第7層）を検査する。<br>×Network Load Balancer：第4層のロードバランサーで、WAF の対象一覧にない。<br>×EBS ボリューム・S3 Glacier：Web のリクエストを受けるリソースではない。<div class=\"mem\">WAF は「Web の入口」に付ける。CloudFront、ALB、API Gateway が代表。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html"}, {"s": 2, "q": "小さな開発チームが、Web アプリを一般的な攻撃（SQL インジェクションなど）から守りたい。ただし、検査ルールを一から作る知識と時間がない。最も手間の少ない方法はどれか。", "o": ["AWS WAF の Web ACL に、AWS Managed Rules などのマネージドルールグループを追加する", "セキュリティグループで、SQL インジェクションを含む通信を拒否するルールを作る", "AWS Shield Standard を有効にする設定を探して有効化する", "Amazon Macie で Web アプリへのリクエストを分析する"], "a": [0], "e": "<b>正解：マネージドルールグループ<\/b>。合図は「一から作れない」「手間を少なく」。WAF では、AWS（AWS Managed Rules）や AWS Marketplace の販売者が用意したルールグループをそのまま Web ACL に入れられる。<br>×セキュリティグループ：IP アドレス・ポート・プロトコルで許可するだけ。リクエストの中身（SQL インジェクション）は見ない。<br>×Shield Standard：最初から全員に自動で適用。有効化の作業はない。SQL インジェクションの対策でもない。<br>×Macie：S3 に保存されたデータの中から機密データを見つける。Web アプリに届くリクエストは見ないし、攻撃を止める機能もない。「分析」という言葉につられない。<div class=\"warn\">「手間が少ない」で Shield Standard を選ばない。手間は確かにゼロ（自動・無料）だが、守る相手が DDoS で、SQL インジェクションは守らない。先に「何の攻撃か」で候補を絞り、そのあとで「手間」を比べる。<\/div>覚え方：Web アプリへの攻撃（SQL インジェクション・クロスサイトスクリプティング）を<b>止める</b>＝ WAF。DDoS＝ Shield。S3 のデータ＝ Macie。", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works.html"}, {"s": 2, "q": "ある企業は AWS Organizations で多数のアカウントを管理している。今後新しく作るアカウントやリソースにも、会社で決めた AWS WAF のルールとセキュリティグループの方針を自動で適用し続けたい。最も適切なサービスはどれか。", "o": ["AWS Firewall Manager", "AWS Shield Advanced", "AWS IAM Identity Center", "Amazon Inspector"], "a": [0], "e": "<b>正解：AWS Firewall Manager<\/b>。合図は「組織の多数のアカウント」「新しいアカウントやリソースにも自動で」。Firewall Manager は新しいリソースやアカウントを見張って、方針（ポリシー）に合わせる。対象は WAF、Shield Advanced、VPC のセキュリティグループ、AWS Network Firewall、Route 53 Resolver の DNS Firewall。前提として Organizations（すべての機能）と、各アカウントでの AWS Config の有効化が必要。<br>×Shield Advanced：DDoS の保護そのもの。複数アカウントへの一括の方針適用は Firewall Manager の役目。<br>×IAM Identity Center：社員のシングルサインオン。<br>×Inspector：脆弱性のスキャン。", "trap": "", "src": "https://aws.amazon.com/firewall-manager/faqs/"}, {"s": 2, "q": "Amazon GuardDuty について、正しいものはどれか。", "o": ["脅威を検出して結果を報告する。自動で対処したい場合は、Amazon EventBridge と AWS Lambda などを組み合わせる", "使い始めるには、すべての EC2 インスタンスにエージェントを必ずインストールする必要がある", "VPC フローログや DNS ログを、お客様が先に自分で有効にしておかないと分析できない", "脅威を見つけると、常に自動で該当のインスタンスを停止する"], "a": [0], "e": "<b>正解：検出と報告。自動対処は EventBridge＋Lambda などで組む<\/b>。GuardDuty は CloudTrail の管理イベント、VPC フローログ、DNS のクエリログを、お客様が有効にしなくても独自に取り込んで分析する。基本の機能はエージェント不要で、ワークロードの性能にも影響しない（ランタイムモニタリングだけは軽いエージェントを使う）。<br>×必ずエージェント：言い切り。基本の脅威検出はエージェント不要。<br>×先に自分でログを有効に：不要。GuardDuty が直接取り込む。<br>×常に自動で停止：言い切り。GuardDuty 自体は止めない。", "trap": "TRAP 07", "src": "https://aws.amazon.com/guardduty/faqs/"}, {"s": 2, "q": "開発チームは、AWS Lambda 関数が使っているライブラリの既知の脆弱性（CVE）と、EC2 インスタンスがネットワークから意図せず到達できる状態になっていないかを、変更のたびに自動で評価したい。最も適切なサービスはどれか。", "o": ["Amazon Inspector", "Amazon GuardDuty", "Amazon Macie", "AWS Shield"], "a": [0], "e": "<b>正解：Amazon Inspector<\/b>。合図は「既知の脆弱性（CVE）」「ネットワークの到達性」「自動で評価」。Inspector は EC2、Amazon ECR のコンテナイメージ、Lambda 関数を対象に、新しいワークロードや変更、新しい CVE の公開をきっかけに自動でスキャンする。CVE とネットワーク到達性を組み合わせてリスクの点数も出す。<br>×GuardDuty：今起きている怪しい動き（脅威）の検出。<br>×Macie：S3 の機密データ。<br>×Shield：DDoS 対策。", "trap": "TRAP 11", "src": "https://aws.amazon.com/inspector/faqs/"}, {"s": 2, "q": "数百の S3 バケットを持つ会社が、どのバケットに個人情報などの機密データが多く含まれ、さらにそのバケットが公開されていたり暗号化されていなかったりしないかを把握し、優先度をつけて対応したい。最も適切なサービスはどれか。", "o": ["Amazon Macie", "Amazon Inspector", "Amazon Detective", "AWS Certificate Manager"], "a": [0], "e": "<b>正解：Amazon Macie<\/b>。合図は「S3」「機密データ」「バケットの公開・暗号化」。Macie は機械学習とパターンマッチングで機密データを見つけ、バケットの公開状況や暗号化の種類も記録して、バケットごとの機密度の点数をつける。<br>×Inspector：ソフトウェアの脆弱性。データの中身は見ない。<br>×Detective：セキュリティの問題の調査（根本原因）。<br>×Certificate Manager：SSL/TLS 証明書。", "trap": "TRAP 11", "src": "https://aws.amazon.com/macie/faq/"}, {"s": 2, "q": "GuardDuty が「ある IAM ロールの不審な API 呼び出し」を検出した。担当者は、そのロールや関係する IP アドレスが過去にどう動いていたかを図で追い、問題の根本原因を調べたい。最も適切なサービスはどれか。", "o": ["Amazon Detective", "AWS Security Hub", "Amazon Inspector", "Amazon CloudWatch"], "a": [0], "e": "<b>正解：Amazon Detective<\/b>。合図は「検出の後」「過去の動きを追う」「根本原因」。Detective は CloudTrail のログ、VPC フローログ、GuardDuty の検出結果などから、リソースのつながりと時間の流れを表す行動グラフを作り、調査を助ける（最大1年分の集約データ）。<br>×Security Hub：結果を集めて優先度をつける。深い調査は Detective。<br>×Inspector：脆弱性のスキャン。<br>×CloudWatch：性能の監視とログ。<div class=\"mem\">GuardDuty が「見つける」→ Security Hub が「まとめる」→ Detective が「調べる（探偵）」。<\/div>", "trap": "TRAP 11", "src": "https://aws.amazon.com/detective/faqs/"}, {"s": 2, "q": "セキュリティサービスと、その主な役割の組み合わせとして、正しいものを", "o": ["Amazon Macie：S3 に保存された機密データの発見", "Amazon Detective：セキュリティの検出結果の調査と根本原因の特定", "AWS Security Hub：DDoS 攻撃のトラフィックを吸収して防ぐ", "Amazon Inspector：S3 バケットの中の個人情報の発見", "Amazon GuardDuty：SSL/TLS 証明書の発行と自動更新"], "a": [0, 1], "e": "<b>正解：Macie＝S3 の機密データ、Detective＝調査と根本原因<\/b>。<br>×Security Hub：GuardDuty、Inspector、Macie などの結果を集約し、ベストプラクティスの自動チェック（AWS Foundational Security Best Practices など）で優先度をつける。DDoS は AWS Shield。<br>×Inspector：脆弱性のスキャン。S3 の個人情報は Macie。<br>×GuardDuty：脅威の検出。証明書は AWS Certificate Manager。", "trap": "TRAP 11", "src": "https://aws.amazon.com/security-hub/faqs/"}, {"s": 2, "q": "米国の医療関連の会社が、HIPAA（医療情報に関する米国の法律）の対象となる保護対象医療情報（PHI）を AWS で扱う予定である。正しいものを", "o": ["AWS Artifact の「契約」で、事業提携契約（BAA）を確認・受諾する", "PHI は、HIPAA の対象となる（HIPAA Eligible）サービスだけで扱う", "AWS は HIPAA の正式な認証を受けており、その認証書を使えば自社の準拠も証明される", "AWS のすべてのサービスで、設定なしで PHI を扱える", "AWS を使えば、HIPAA への準拠の責任はすべて AWS に移る"], "a": [0, 1], "e": "<b>正解：Artifact で BAA を受諾、PHI は HIPAA 対象サービスだけで<\/b>。BAA を受諾したアカウントは「HIPAA アカウント」となり、PHI は HIPAA 対象サービスでのみ扱える。<br>×HIPAA の正式な認証：HIPAA は「法律・規制」で、クラウド事業者が受けられる正式な認証はない（ISO や SOC のような認証とは違う）。<br>×すべてのサービスで：対象サービスは限られる。<br>×責任がすべて AWS に：お客様も、適用される法律・規制に準拠する責任を負う（責任共有モデル）。<div class=\"mem\">認証（ISO、SOC、PCI DSS）は Artifact の「レポート」、HIPAA の BAA は Artifact の「契約」。<\/div>", "trap": "TRAP 05", "src": "https://aws.amazon.com/compliance/programs/"}, {"s": 2, "q": "ある会社は、国内の法令により、顧客の個人データを日本国内に保存しなければならない。AWS で満たすための考え方として、最も適切なものはどれか。", "o": ["日本のリージョン（東京・大阪）を選んでデータを保存する。AWS はお客様の同意なしに、選ばれたリージョンの外へデータを移動・複製しない", "どのリージョンを選んでも、AWS が自動で日本国内に保存してくれる", "データはエッジロケーションにだけ保存すれば、国内保存の要件を満たせる", "AWS は料金を下げるため、自動で最も安いリージョンへデータを移す"], "a": [0], "e": "<b>正解：リージョンを選ぶ。AWS は同意なしにリージョン外へ移さない<\/b>。データをどのリージョンに置くかはお客様が決める（データ主権・データの所在地）。ただし、使いたいサービスがそのリージョンにあるかは確認が必要。<br>×どこでも日本に：リージョンを選ぶのはお客様。<br>×エッジロケーション：キャッシュ配信などの拠点で、データの保存場所として選ぶものではない。<br>×自動で安いリージョンへ：AWS は勝手に移さない。<div class=\"mem\">データの「住所」はリージョンで決まる。決めるのはお客様。<\/div>", "trap": "TRAP 04", "src": "https://aws.amazon.com/compliance/data-privacy-faq/"}, {"s": 2, "q": "セキュリティ担当者が、AWS の新しいセキュリティ機能の解説や、セキュリティのベストプラクティスの実践例の記事を継続して読みたい。最も適切な情報源はどれか。", "o": ["AWS セキュリティブログ（AWS Security Blog）", "AWS Artifact", "AWS Health Dashboard", "AWS Cost Explorer"], "a": [0], "e": "<b>正解：AWS セキュリティブログ<\/b>。合図は「解説」「実践例の記事」。試験ガイドでは、セキュリティの情報源として AWS ナレッジセンター（Knowledge Center）、AWS セキュリティセンター、AWS セキュリティブログが挙がっている。ナレッジセンターは、お客様から多い質問への AWS 公式の回答記事（今は AWS re:Post 上にある）。<br>×Artifact：コンプライアンスレポートと契約。<br>×Health Dashboard：自分に影響する AWS の障害・メンテナンス。<br>×Cost Explorer：コストの分析。", "trap": "", "src": "https://aws.amazon.com/blogs/security/"}, {"s": 2, "q": "ある会社は、ルートユーザーの MFA が無効になっていないか、公開されている EBS スナップショットがないか、セキュリティグループで特定のポートが誰にでも開いていないかを、AWS が用意した点検項目でまとめて確認したい。最も適切なサービスはどれか。", "o": ["AWS Trusted Advisor", "Amazon Inspector", "AWS Shield", "AWS Artifact"], "a": [0], "e": "<b>正解：AWS Trusted Advisor<\/b>。合図は「AWS が用意した点検項目」「MFA」「公開スナップショット」「開いたポート」。セキュリティのチェックには、ルートアカウントの MFA、EBS や RDS の公開スナップショット、セキュリティグループの無制限のポート、S3 バケットの権限、漏れたアクセスキーなどがある（利用できるチェックの数はサポートプランで違う）。<br>×Inspector：ソフトウェアの脆弱性とネットワーク到達性のスキャン。アカウントの設定の点検ではない。<br>×Shield：DDoS 対策。<br>×Artifact：AWS のレポート。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/awssupport/latest/user/security-checks.html"}, {"s": 2, "q": "外部の監査人から、AWS アカウントのすべての IAM ユーザーについて、パスワード・アクセスキー・MFA デバイスの状態（最後に使った日やローテーションの日など）の一覧を求められた。最も適切なものはどれか。", "o": ["IAM の認証情報レポート（credential report）を生成してダウンロードする", "AWS Artifact から SOC 2 レポートをダウンロードする", "Amazon CloudWatch のダッシュボードを共有する", "Amazon Macie で S3 バケットをスキャンする"], "a": [0], "e": "<b>正解：IAM の認証情報レポート<\/b>。合図は「すべての IAM ユーザー」「パスワード・アクセスキー・MFA の状態」。アカウントの全ユーザーと認証情報の状態を CSV で出せ、監査とコンプライアンスに使える（4時間に1回まで生成）。試験ガイドの「アクセスレポートによる報告」にあたる。<br>×Artifact の SOC 2：AWS 自身の統制の報告書。お客様の IAM ユーザーの状態は載っていない。<br>×CloudWatch のダッシュボード：性能の数値やログの可視化。<br>×Macie：S3 の機密データ。", "trap": "TRAP 06", "src": "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_getting-report.html"}, {"s": 3, "q": "ある EC サイトは、1つのドメインで、URL のパスが /images ならば画像用のサーバー群へ、/api ならば API 用のサーバー群へ、HTTP のリクエストを振り分けたい。最も適切なロードバランサーはどれか。", "o": ["Application Load Balancer", "Network Load Balancer", "Gateway Load Balancer", "Amazon Route 53 の加重ルーティング"], "a": [0], "e": "<b>正解：Application Load Balancer（ALB）<\/b>。 er", "AWS Transit Gateway", "Amazon Route 53"], "a": [0], "e": "<b>正解：Amazon API Gateway<\/b>。REST、HTTP、WebSocket の API を作って公開し、アクセスの管理、認可、監視などを行う、バックエンド（Lambda や EC2）の「玄関」。<br>×Gateway Load Balancer：仮想アプライアンス向け。名前の「Gateway」に注意。<br>×Transit Gateway：VPC とオンプレミスをつなぐハブ。<br>×Route 53：DNS。API の認証やスロットリングはしない。<div class=\"mem\">名前に Gateway がつくもの：API の玄関＝API Gateway、ネットワークのハブ＝Transit Gateway、アプライアンス＝Gateway Load Balancer。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html"}, {"s": 3, "q": "セキュリティ担当者は、セキュリティグループやネットワーク ACL の設定の誤りで、EC2 インスタンスのポートがインターネットから到達できる状態になっていないかを、自動で定期的に調べたい。最も適切なサービスはどれか。", "o": ["Amazon Inspector", "AWS CloudTrail", "Amazon Route 53", "AWS Global Accelerator"], "a": [0], "e": "<b>正解：Amazon Inspector<\/b>。ソフトウェアの脆弱性に加え、ネットワーク到達性（EC2 へのポートがインターネットゲートウェイなどから到達できるか）の検出結果を出す。試験ガイドも VPC のセキュリティの例に Inspector を挙げている。<br>×CloudTrail：API の呼び出しの記録。誰が設定を変えたかは分かるが、到達できるかは調べない。<br>×Route 53：DNS。<br>×Global Accelerator：通信の高速化。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/inspector/latest/user/findings-types.html"}, {"s": 3, "q": "ネットワーク ACL の説明として、正しいものを", "o": ["サブネット単位で働き、許可のルールと拒否のルールの両方を書ける", "ルールは番号の小さい順に評価され、最初に一致したルールが使われる", "ステートフルなので、戻りの通信は自動で許可される", "インスタンス単位で働き、許可のルールだけを書ける", "デフォルトのネットワーク ACL は、すべての通信を拒否する"], "a": [0, 1], "e": "<b>正解：サブネット単位で許可と拒否、番号の小さい順に評価<\/b>。<br>×ステートフル：ネットワーク ACL はステートレス。戻りの通信も明示的に許可する。ステートフルなのはセキュリティグループ。<br>×インスタンス単位・許可のみ：セキュリティグループの説明。<br>×デフォルトはすべて拒否：デフォルトのネットワーク ACL はすべての受信・送信を許可する。<div class=\"mem\">ACL＝階の警備員。リストを上から順に見て、行きも帰りも確認する。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html"}, {"s": 3, "q": "医療機関は、診療の画像を長期間保管する。アクセスは四半期に1回程度だが、必要になったときはミリ秒で表示できなければならない。最もコスト効率の高い S3 のストレージクラスはどれか。", "o": ["S3 Glacier Instant Retrieval", "S3 Glacier Flexible Retrieval", "S3 Standard", "S3 Glacier Deep Archive"], "a": [0], "e": "<b>正解：S3 Glacier Instant Retrieval<\/b>。合図は「四半期に1回」「ミリ秒」。アーカイブ向けの安さで、取り出しはミリ秒。最小保存期間は90日。<br>×Glacier Flexible Retrieval：先に復元が必要で、数分〜数時間かかる。<br>×S3 Standard：ミリ秒だが、めったに使わないデータには割高。<br>×Glacier Deep Archive：最も安いが、取り出しに数時間かかる。<div class=\"mem\">Glacier の中でミリ秒は Instant だけ。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"}, {"s": 3, "q": "会社は、年に1回程度しか使わないバックアップのアーカイブを S3 に保存する。復元は数分〜数時間かかってもよく、大量に取り出すときは無料の一括（Bulk）取り出しを使いたい。最も適切なストレージクラスはどれか。", "o": ["S3 Glacier Flexible Retrieval", "S3 Glacier Instant Retrieval", "S3 Standard-IA", "S3 One Zone-IA"], "a": [0], "e": "<b>正解：S3 Glacier Flexible Retrieval<\/b>。合図は「年1回程度」「数分〜数時間」「一括取り出しが無料」。迅速は1〜5分、標準は3〜5時間、一括は5〜12時間。<br>×Glacier Instant Retrieval：ミリ秒で取り出せる分、年1回のデータには割高になりやすい。<br>×Standard-IA・One Zone-IA：月1回程度のアクセス向け。<div class=\"mem\">Flexible＝取り出しの速さを選べる（迅速・標準・一括）。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html"}, {"s": 3, "q": "機械学習の学習ジョブが、同じ AZ にあるコンピューティングから、同じデータに何度も読み込みを行う。一貫した1桁ミリ秒の応答が必要で、データは別の場所にも元がある。最も適切な S3 のストレージクラスはどれか。", "o": ["S3 Express One Zone", "S3 One Zone-IA", "S3 Glacier Instant Retrieval", "S3 Intelligent-Tiering"], "a": [0], "e": "<b>正解：S3 Express One Zone<\/b>。合図は「同じ AZ のコンピューティング」「一貫した1桁ミリ秒」「頻繁なアクセス」。最も低レイテンシのクラスで、自分で選んだ1つの AZ のディレクトリバケットに保存する。<br>×S3 One Zone-IA：名前は似ているが、たまにしか使わないデータを安く保存するクラス。取り出し料金がかかる。<br>×Glacier Instant Retrieval：アーカイブ向け。<br>×Intelligent-Tiering：パターンが分からないときにコストを最適化するクラス。<div class=\"mem\">Express＝特急（速い）、IA＝たまに（安い）。どちらも One Zone。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"}, {"s": 3, "q": "Amazon S3 のストレージクラスについて、正しいものを", "o": ["S3 Standard-IA の最小保存期間は30日である", "S3 Glacier Deep Archive の最小保存期間は180日である", "S3 Standard にも30日の最小保存期間がある", "S3 Glacier Flexible Retrieval のオブジェクトは、復元しなくてもすぐに読み込める", "S3 One Zone-IA のデータは、AZ が丸ごと失われても残る"], "a": [0, 1], "e": "<b>正解：Standard-IA は30日、Deep Archive は180日<\/b>。期間より前に消すと、残りの日数分も請求される。<br>×Standard に最小保存期間：ない。<br>×Flexible Retrieval はすぐ読める：先に復元が必要（Deep Archive も同じ）。<br>×One Zone-IA は AZ が失われても残る：1つの AZ だけなので、AZ の喪失には耐えられない。<div class=\"mem\">IA は30、Glacier（Instant・Flexible）は90、Deep は180。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html"}, {"s": 3, "q": "社員が S3 のファイルを誤って削除したり、古い内容で上書きしたりすることがある。そのような場合でも、前の状態に戻せるようにしたい。最も適切なものはどれか。", "o": ["バケットで S3 バージョニングを有効にする", "S3 ライフサイクルポリシーを設定する", "S3 Transfer Acceleration を有効にする", "静的ウェブサイトホスティングを有効にする"], "a": [0], "e": "<b>正解：S3 バージョニング<\/b>。合図は「誤って削除・上書き」「前の状態に戻す」。削除しても削除マーカーが付くだけで、前のバージョンから戻せる。<br>×ライフサイクル：日数で安いクラスへ移す・削除する機能。<br>×Transfer Acceleration：遠くからのアップロードを速くする。<br>×静的ウェブサイトホスティング：Web サイトの公開。<div class=\"warn\">引っかけ注意：一度有効にしたバージョニングは「なし」に戻せない（停止はできる）。古いバージョンにも保存料金がかかる。<\/div>", "trap": "", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html"}, {"s": 3, "q": "東京リージョンの S3 バケットに書き込まれる新しいオブジェクトを、災害対策のため大阪リージョンのバケットへ自動でコピーしたい。必要なものを", "o": ["クロスリージョンレプリケーション（CRR）を設定する", "送信元と送信先の両方のバケットでバージョニングを有効にする", "同一リージョンレプリケーション（SRR）を設定する", "送信元のバケットだけでバージョニングを有効にする", "S3 Transfer Acceleration を有効にする"], "a": [0, 1], "e": "<b>正解：CRR を設定し、両方のバケットでバージョニングを有効にする<\/b>。合図は「別のリージョンへ自動でコピー」。<br>×SRR：同じリージョンの中のコピー（ログの集約など）。<br>×送信元だけ：送信先にもバージョニングが必要。<br>×Transfer Acceleration：アップロードを速くする機能で、コピーはしない。<div class=\"warn\">引っかけ注意：レプリケーションを設定する前からあるオブジェクトは、自動ではコピーされない（S3 Batch Replication を使う）。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-requirements.html"}, {"s": 3, "q": "セキュリティ担当者は、AWS アカウントのすべての S3 バケットについて、誰かがバケットポリシーや ACL で誤って公開してしまうことを防ぎたい。今後作るバケットにも効かせたい。最も適切なものはどれか。", "o": ["アカウントのレベルで S3 ブロックパブリックアクセスを有効にする", "Amazon Macie を有効にする", "オブジェクトごとに ACL を設定し直す", "すべてのバケットの前に Amazon CloudFront を置く"], "a": [0], "e": "<b>正解：アカウントのレベルの S3 ブロックパブリックアクセス<\/b>。合図は「すべてのバケット」「誤って公開を防ぐ」「今後のバケットにも」。バケットポリシーや ACL の公開設定より優先される。組織、アカウント、バケット、アクセスポイントの単位で設定できる。<br>×Macie：S3 の機密データを見つけるサービスで、公開を止めるものではない。<br>×オブジェクトごとの ACL：手間がかかり、漏れが出る。ブロックパブリックアクセスはオブジェクト単位では設定できない。<br>×CloudFront：配信の仕組みで、公開設定を禁止するものではない。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"}, {"s": 3, "q": "会社は、静的な Web サイト（HTML、画像）を S3 で公開する。独自ドメインで、HTTPS で配信したい。最も適切な構成はどれか。", "o": ["S3 バケットをオリジンにした Amazon CloudFront のディストリビューションを使う", "S3 のウェブサイトエンドポイントで HTTPS を有効にする", "EC2 インスタンスに Web サーバーを入れ、S3 からファイルをコピーする", "AWS Global Accelerator を S3 のウェブサイトエンドポイントの前に置く"], "a": [0], "e": "<b>正解：S3 をオリジンにした CloudFront<\/b>。合図は「静的」「HTTPS」。S3 のウェブサイトエンドポイントは HTTPS に対応していない。公式には CloudFront か AWS Amplify Hosting を使う方法が案内されている。<br>×ウェブサイトエンドポイントで HTTPS：できない。<br>×EC2 に Web サーバー：動くが、運用の手間が増える。<br>×Global Accelerator：通信を速くするもので、HTTPS の配信やキャッシュの仕組みではない。", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteEndpoints.html"}, {"s": 3, "q": "Amazon EBS について、正しいものを", "o": ["EBS スナップショットは増分で保存され、データは S3 に保存される", "EBS スナップショットから、同じリージョンの別の AZ にボリュームを作れる", "スループット最適化 HDD（st1）は、EC2 の起動ボリュームに使える", "AWS が EBS ボリュームを自動で毎日バックアップする", "EBS ボリュームは、どの AZ の EC2 インスタンスにもそのままアタッチできる"], "a": [0, 1], "e": "<b>正解：スナップショットは増分で S3 に保存、別の AZ にも復元できる<\/b>。スナップショットはリージョンの全 AZ に複製される（S3 のコンソールからは見えない）。<br>なぜ S3 に置くのか：EBS ボリュームは1つの AZ の中にしかない「EC2 につないだディスク」。その AZ が壊れると、ボリュームごと使えなくなる。だから控え（スナップショット）は、複数の AZ にまたがって保存される S3 に置く。パソコンの中のディスクと、別の場所に取ったバックアップの関係と同じ。<br>×st1 を起動ボリューム：HDD（st1・sc1）は起動ボリュームにできない。<br>×AWS が自動でバックアップ：しない。スナップショットはお客様の責任（Data Lifecycle Manager や AWS Backup で自動化できる）。<br>×どの AZ にもアタッチ：ボリュームは同じ AZ のインスタンスにアタッチする。別の AZ ではスナップショットから作り直す。<div class=\"mem\">EBS は AZ の中、スナップショットはリージョン全体。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/ebs/latest/userguide/ebs-snapshots.html"}, {"s": 3, "q": "EC2 インスタンス上の処理で、一時的なキャッシュと作業用のデータを置く場所が必要である。最も高速で追加料金がかからないことを重視し、インスタンスを停止したらデータが消えてもよい。最も適切なものはどれか。", "o": ["インスタンスストア", "Amazon EBS の汎用 SSD（gp3）", "Amazon EFS", "S3 Standard"], "a": [0], "e": "<b>正解：インスタンスストア<\/b>。合図は「一時的」「停止したら消えてよい」「追加料金なし」。ホストに直付けのディスクで、料金はインスタンスに含まれる。再起動ではデータが残るが、停止・休止・終了で消える。<br>×EBS：止めてもデータが残るが、別に料金がかかる。<br>×EFS：共有ファイル。一時的な作業領域には大げさ。<br>×S3：オブジェクトストレージ。ディスクとしては使わない。<div class=\"warn\">引っかけ注意：「再起動」では消えない。「停止」で消える。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-store-lifetime.html"}, {"s": 3, "q": "開発チームは、テスト環境の複数の Linux の EC2 インスタンスから、同じファイルを共有したい。AZ の障害に耐える必要はなく、コストをできるだけ抑えたい。最も適切なものはどれか。", "o": ["Amazon EFS の One Zone ファイルシステム", "Amazon EFS のリージョンファイルシステム", "S3 Express One Zone", "Amazon FSx for Windows File Server"], "a": [0], "e": "<b>正解：EFS One Zone<\/b>。合図は「Linux の共有ファイル」「AZ の障害に耐えなくてよい」「コストを抑える」。1つの AZ に保存するので安い。<br>×EFS のリージョン：複数 AZ に保存。本番向けで、より高い。<br>×S3 Express One Zone：名前は似ているが、オブジェクトストレージ。ファイル共有ではない。<br>×FSx for Windows File Server：Windows（SMB）向け。<div class=\"mem\">EFS も S3 も「One Zone」は安いが AZ 障害に弱い。<\/div>", "trap": "TRAP 01", "src": "https://aws.amazon.com/efs/storage-classes/"}, {"s": 3, "q": "研究所は、ハイパフォーマンスコンピューティング（HPC）のシミュレーションを AWS で行う。S3 にある大量のデータを、Linux のインスタンスから高速なファイルシステムとして読み書きしたい。最も適切なサービスはどれか。", "o": ["Amazon FSx for Lustre", "Amazon FSx for Windows File Server", "AWS Storage Gateway", "Amazon S3 Glacier Deep Archive"], "a": [0], "e": "<b>正解：Amazon FSx for Lustre<\/b>。合図は「HPC」「高速」「S3 のデータをファイルとして」。S3 のバケットとつなぐと、S3 のオブジェクトをファイルとして見せ、結果を S3 に書き戻せる。機械学習、動画処理にも使う。<br>×FSx for Windows File Server：Windows の共有フォルダ（SMB）。<br>×Storage Gateway：オンプレミスと AWS をつなぐ。<br>×Deep Archive：長期保管で、取り出しに時間がかかる。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/fsx/latest/LustreGuide/what-is.html"}, {"s": 3, "q": "会社は、オンプレミスで NetApp ONTAP のストレージを使っている。Linux と Windows のサーバーから NFS・SMB・iSCSI で使っており、アプリや運用の方法を変えずに AWS に移したい。最も適切なサービスはどれか。", "o": ["Amazon FSx for NetApp ONTAP", "Amazon FSx for OpenZFS", "Amazon EFS", "Amazon FSx for Lustre"], "a": [0], "e": "<b>正解：Amazon FSx for NetApp ONTAP<\/b>。合図は「NetApp ONTAP」「NFS・SMB・iSCSI の複数プロトコル」「変えずに移す」。NetApp の機能（スナップショット、SnapMirror など）をマネージドで使える。<br>×FSx for OpenZFS：OpenZFS ベース。NetApp の移行の合図ではない。<br>×EFS：Linux（NFS）向けで、SMB・iSCSI は使えない。<br>×FSx for Lustre：HPC 向けの高速ファイルシステム。<div class=\"mem\">FSx は「元の製品の名前」がそのまま合図：Windows、Lustre、NetApp ONTAP、OpenZFS。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html"}, {"s": 3, "q": "会社は、オンプレミスのバックアップソフトで物理テープに保存している。テープの管理をやめたいが、バックアップソフトと運用の手順はできるだけ変えたくない。最も適切なものはどれか。", "o": ["AWS Storage Gateway の Tape Gateway", "AWS Storage Gateway の S3 File Gateway", "AWS Storage Gateway の Volume Gateway", "AWS Elastic Disaster Recovery"], "a": [0], "e": "<b>正解：Tape Gateway<\/b>。合図は「テープ」「今のバックアップソフトのまま」。仮想テープライブラリ（VTL）として見え、データは S3 に保存される。取り出したテープは S3 Glacier や Glacier Deep Archive に保管される。<br>×S3 File Gateway：NFS・SMB のファイル共有として S3 を使う。<br>×Volume Gateway：iSCSI のブロックストレージ。<br>×Elastic Disaster Recovery：サーバーの災害対策。<div class=\"mem\">ファイル＝S3 File、ディスク＝Volume、テープ＝Tape。<\/div>", "trap": "", "src": "https://aws.amazon.com/storagegateway/faqs/"}, {"s": 3, "q": "会社は、複数の AWS アカウントで EC2、EBS、RDS、DynamoDB、EFS を使っている。バックアップのスケジュールと保持期間をポリシーで一元的に決め、別のリージョンにもコピーを残したい。運用の手間を最小にしたい。最も適切なサービスはどれか。", "o": ["AWS Backup", "AWS Elastic Disaster Recovery", "S3 クロスリージョンレプリケーション", "各サービスで手動のスナップショットを取るスクリプト"], "a": [0], "e": "<b>正解：AWS Backup<\/b>。合図は「複数のサービス」「ポリシーで一元的に」「別リージョンにコピー」。バックアッププランで決め、AWS Organizations を使えば複数アカウントにも適用できる。Backup Vault Lock でバックアップを消せないようにもできる（WORM）。<br>×Elastic Disaster Recovery：サーバーを継続的に複製して素早く復旧する災害対策。<br>×S3 CRR：S3 のオブジェクトだけ。<br>×手動のスクリプト：運用の手間が大きい。", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html"}, {"s": 3, "q": "会社は、オンプレミスの重要なサーバーが災害で止まったとき、AWS 上ですぐに復旧したい。データの損失は秒単位、復旧は分単位を目指し、平常時のコストは低く抑えたい。最も適切なサービスはどれか。", "o": ["AWS Elastic Disaster Recovery", "AWS Backup", "AWS Application Migration Service", "AWS Storage Gateway の Volume Gateway"], "a": [0], "e": "<b>正解：AWS Elastic Disaster Recovery<\/b>。合図は「災害時にすぐ復旧」「秒単位の損失（RPO）・分単位の復旧（RTO）」「平常時は低コスト」。サーバーを AWS の低コストのステージング領域へ継続的に複製し、必要なときに数分で復旧用のインスタンスを起動する。元の場所へのフェイルバックもできる。<br>×AWS Backup：定期的なバックアップの一元管理。復旧までの時間は長くなりやすい。<br>×Application Migration Service：移行（引っ越し）のためのサービス。<br>×Volume Gateway：オンプレミスにブロックストレージを見せる。", "trap": "TRAP 04", "src": "https://aws.amazon.com/disaster-recovery/"}, {"s": 3, "q": "Amazon RDS for MySQL の DB で、レポート用の重いクエリが本番の性能を下げている。また、AZ の障害時には自動で切り替わるようにしたい。行うべきことを", "o": ["リードレプリカを作り、レポートのクエリをそちらへ送る", "マルチ AZ 配置を有効にする", "マルチ AZ のスタンバイにレポートのクエリを送る", "DB をインスタンスストアのある EC2 インスタンスに移す", "DynamoDB のグローバルテーブルを有効にする"], "a": [0, 1], "e": "<b>正解：リードレプリカ（読み込みの負荷分散）と、マルチ AZ（自動フェイルオーバー）<\/b>。目的が2つあるので、それぞれに合う機能を選ぶ。<br>×スタンバイにクエリ：スタンバイが1つのマルチ AZ では、スタンバイは待機だけで読み込みを受けない。<br>×インスタンスストアの EC2：停止でデータが消え、運用の手間も増える。<br>×DynamoDB のグローバルテーブル：DynamoDB の機能で、RDS には使えない。<div class=\"mem\">マルチ AZ＝保険、リードレプリカ＝読み込み係。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html"}, {"s": 3, "q": "Amazon RDS のマルチ AZ 配置（スタンバイが1つ）の説明として、最も適切なものはどれか。", "o": ["別の AZ のスタンバイに同期でデータを複製し、障害時は自動でフェイルオーバーする", "スタンバイは読み込み専用の DB として常に使え、読み込みの性能が上がる", "スタンバイは自動で別のリージョンに作られ、リージョン全体の障害に備える", "非同期で複製するので、障害時に必ずデータが失われる"], "a": [0], "e": "<b>正解：別の AZ への同期の複製と自動フェイルオーバー<\/b>。目的は高可用性。<br>×スタンバイで読み込みの性能が上がる：スタンバイは読めない。読み込みを増やすならリードレプリカ。<br>×別のリージョンに自動：スタンバイは同じリージョンの別の AZ。別のリージョンならクロスリージョンのリードレプリカなど。<br>×非同期で必ず失われる：同期の複製。「必ず」の言い切りも誤り。", "trap": "TRAP 07", "src": "https://aws.amazon.com/rds/features/multi-az/"}, {"s": 3, "q": "スタートアップは、MySQL 互換の DB を使う新しいアプリを公開する。アクセスがいつ、どのくらい増えるか予測できず、DB の容量の計画や変更に手間をかけたくない。使っていない間の料金も抑えたい。最も適切なものはどれか。", "o": ["Amazon Aurora Serverless", "Amazon RDS for MySQL を3年のリザーブドインスタンスで買う", "Amazon Redshift", "Amazon DynamoDB のプロビジョンドモード"], "a": [0], "e": "<b>正解：Amazon Aurora Serverless<\/b>。合図は「予測できない」「容量の計画をしたくない」「MySQL 互換」。負荷に合わせて容量（ACU）を自動で増減し、使った分だけ払う。<br>×3年の RI：負荷が読めないのに長く約束するのは合わない。容量の変更も手動。<br>×Redshift：分析用のデータウェアハウス。<br>×DynamoDB のプロビジョンド：MySQL 互換ではない。プロビジョンドは予測できる負荷向け。", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html"}, {"s": 3, "q": "会社は、Amazon DynamoDB のテーブルを使う。1日を通してアクセス量がほぼ一定で、増え方も予測できる。毎月のコストを予測しやすくしたい。最も適切な容量モードはどれか。", "o": ["プロビジョンドモード（必要に応じて Auto Scaling を使う）", "オンデマンドモード", "グローバルテーブル", "Amazon RDS のリードレプリカ"], "a": [0], "e": "<b>正解：プロビジョンドモード<\/b>。合図は「ほぼ一定」「予測できる」「コストを予測しやすく」。1秒あたりの読み書きの量を指定し、その量に応じて払う。<br>×オンデマンド：容量の計画が不要で、DynamoDB の既定かつ多くの場合に推奨。ただし「一定で予測できる負荷のコスト予測」ではプロビジョンドが合う。<br>×グローバルテーブル：複数リージョンへの複製の機能で、容量モードではない。<br>×RDS のリードレプリカ：RDS の機能で、DynamoDB の容量モードではない。<div class=\"mem\">読めない負荷＝オンデマンド、読める負荷＝プロビジョンド。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/capacity-mode.html"}, {"s": 3, "q": "ゲーム会社は、北米・欧州・アジアの利用者に、低い遅延でデータを読み書きさせたい。どのリージョンでも書き込みができ、1つのリージョンが止まっても続けたい。DB は Amazon DynamoDB を使う。最も適切な機能はどれか。", "o": ["DynamoDB のグローバルテーブル", "Amazon RDS のクロスリージョンリードレプリカ", "DynamoDB のテーブルを1つのリージョンでマルチ AZ にする", "Amazon ElastiCache"], "a": [0], "e": "<b>正解：DynamoDB のグローバルテーブル<\/b>。合図は「複数リージョン」「どのリージョンでも書き込み」「リージョンが止まっても」。複数のリージョンに自動で複製し、どのレプリカでも読み書きできる（マルチアクティブ）。<br>×RDS のクロスリージョンリードレプリカ：読み込み専用で、DynamoDB の機能でもない。<br>×1つのリージョン：リージョンの障害には耐えられない。<br>×ElastiCache：キャッシュで、複数リージョンの書き込みの仕組みではない。", "trap": "TRAP 04", "src": "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html"}, {"s": 3, "q": "会社は、MongoDB を使うアプリを AWS に移す。アプリのコードや使っているドライバをなるべく変えずに、DB の運用をマネージドにしたい。最も適切なサービスはどれか。", "o": ["Amazon DocumentDB", "Amazon DynamoDB", "Amazon Neptune", "Amazon Aurora PostgreSQL 互換"], "a": [0], "e": "<b>正解：Amazon DocumentDB<\/b>。合図は「MongoDB」「ドライバを変えずに」。MongoDB の API とドライバに互換性があるドキュメント DB。<br>×DynamoDB：NoSQL だが MongoDB 互換ではない。アプリの書き換えが必要。<br>×Neptune：グラフ DB（つながりの分析、不正検出）。<br>×Aurora PostgreSQL 互換：リレーショナル DB。", "trap": "TRAP 11", "src": "https://aws.amazon.com/documentdb/"}, {"s": 3, "q": "開発チームは、IDE の中でコードの補完や生成をしてもらい、書いたコードのセキュリティの脆弱性もスキャンしたい。AWS のリソースについての質問にも答えてほしい。最も適切なサービスはどれか。", "o": ["Amazon Q Developer", "Amazon Lex", "Amazon SageMaker AI", "Amazon Comprehend"], "a": [0], "e": "<b>正解：Amazon Q Developer<\/b>。合図は「IDE」「コードの補完・生成」「脆弱性のスキャン」「AWS について質問」。<br>×Lex：音声・テキストのチャットボットを作るサービス。<br>×SageMaker AI：機械学習モデルを作る・学習・デプロイするサービス。<br>×Comprehend：文章の分析。<div class=\"warn\">2026年の注意：Amazon Q Business は新規のお客様が使えなくなり、似た機能は Amazon Quick が案内されている。Amazon Q Developer の IDE プラグインは 2027-04-30 にサポート終了予定。試験では「開発者＝Q Developer、社員の業務＝Q Business（今は Amazon Quick）」の区別で考える。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/what-is.html"}, {"s": 3, "q": "SNS のアプリに、利用者が毎日大量の画像を投稿する。暴力的・不適切な画像を、機械学習の専門知識なしで自動で見つけたい。最も適切なサービスはどれか。", "o": ["Amazon Rekognition", "Amazon Comprehend", "Amazon Textract", "Amazon Macie"], "a": [0], "e": "<b>正解：Amazon Rekognition<\/b>。合図は「画像」「不適切なコンテンツ」。不適切なコンテンツの検出（コンテンツモデレーション）、顔の比較、物体の検出、画像の中の文字の検出などができる。<br>×Comprehend：文章（テキスト）の分析。<br>×Textract：書類から文字・表・フォームを取り出す。<br>×Macie：S3 の中の機密データ（個人情報など）を見つけるセキュリティのサービス。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html"}, {"s": 3, "q": "会社は、多くの言語で書かれたお客様のレビューを集めている。すべてを英語にそろえ、そのうえで文章の中の電話番号や住所などの個人情報（PII）を見つけたい。使うサービスを", "o": ["Amazon Translate", "Amazon Comprehend", "Amazon Polly", "Amazon Transcribe", "Amazon Lex"], "a": [0, 1], "e": "<b>正解：Translate（翻訳）と Comprehend（PII の検出）<\/b>。Comprehend は感情やキーフレーズだけでなく、個人情報（PII）も見つけられる。<br>×Polly：テキストを音声にする。<br>×Transcribe：音声を文字にする。レビューはもともと文章。<br>×Lex：チャットボット。<div class=\"warn\">引っかけ注意：S3 のバケットの中の個人情報を探すなら Macie。文章の中身を分析して PII を見つけるなら Comprehend。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html"}, {"s": 3, "q": "Web サーバーのログを、処理用のアプリを書かずに、ほぼリアルタイムで Amazon S3 と Amazon OpenSearch Service に届けたい。途中で形式を変換できるとよい。最も適切なサービスはどれか。", "o": ["Amazon Data Firehose", "Amazon Kinesis Data Streams", "AWS Glue", "Amazon SQS"], "a": [0], "e": "<b>正解：Amazon Data Firehose<\/b>（旧 Kinesis Data Firehose）。合図は「アプリを書かずに」「S3・OpenSearch に届ける」「変換」。ストリーミングデータを、決めた宛先（S3、Redshift、OpenSearch Service、Splunk など）へ自動で配信する。<br>×Kinesis Data Streams：リアルタイムで集めるが、読み出して処理するアプリは自分で作る。<br>×Glue：ETL とデータカタログ。<br>×SQS：アプリの間のメッセージのキュー。<div class=\"mem\">Streams＝自分で汲む川、Firehose＝決めた先へ自動で放水するホース。<\/div>", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html"}, {"s": 3, "q": "データ分析チームは、S3 のデータレイクに形式がばらばらのファイルを大量に置いている。スキーマを自動で見つけて表として登録し、Amazon Athena から SQL で検索できるようにしたい。サーバーの管理はしたくない。最も適切なサービスはどれか。", "o": ["AWS Glue（クローラーと Data Catalog）", "Amazon Quick", "Amazon EMR", "Amazon Neptune"], "a": [0], "e": "<b>正解：AWS Glue<\/b>。合図は「スキーマを自動で見つけて登録」「Athena から検索」「サーバーレス」。クローラーがスキーマを推測し、Data Catalog に登録する。Athena、EMR、Redshift Spectrum から使える。<br>×Quick：BI・ダッシュボード（見せる側）。<br>×EMR：Hadoop・Spark のクラスターを使う大規模処理。カタログ作りの合図ではない。<br>×Neptune：グラフ DB。", "trap": "", "src": "https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html"}, {"s": 3, "q": "会社は、オンプレミスの Apache Hadoop と Apache Spark のクラスターで大量のデータを処理している。今のフレームワークを使い続けながら、クラスターの構築と管理の手間を減らしたい。最も適切なサービスはどれか。", "o": ["Amazon EMR", "Amazon Redshift", "Amazon Athena", "Amazon OpenSearch Service"], "a": [0], "e": "<b>正解：Amazon EMR<\/b>（旧名 Amazon Elastic MapReduce）。合図は「Hadoop」「Spark」「クラスター」。Hadoop や Spark などのビッグデータのフレームワークを動かすマネージドのクラスター基盤。<br>×Redshift：データウェアハウス（SQL での分析）。<br>×Athena：S3 にサーバーレスで SQL。Hadoop のクラスターを移す合図ではない。<br>×OpenSearch Service：検索とログの分析。", "trap": "", "src": "https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-what-is-emr.html"}, {"s": 3, "q": "運用チームは、多数のアプリのログを集め、キーワードで全文検索したり、ダッシュボードでリアルタイムにアプリの状態を監視したりしたい。マネージドのサービスを使いたい。最も適切なサービスはどれか。", "o": ["Amazon OpenSearch Service", "Amazon Redshift", "AWS CloudTrail", "Amazon Neptune"], "a": [0], "e": "<b>正解：Amazon OpenSearch Service<\/b>。合図は「全文検索」「ログ分析」「リアルタイムの監視」「ダッシュボード」。OpenSearch Dashboards で可視化できる。<br>×Redshift：大規模な分析用のデータウェアハウス。全文検索の合図ではない。<br>×CloudTrail：AWS の API の呼び出しの記録。アプリのログ検索ではない。<br>×Neptune：グラフ DB。", "trap": "", "src": "https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html"}, {"s": 3, "q": "経営企画部は、売上データからインタラクティブなダッシュボードを作り、社内で共有したい。AI のアシスタントに自然な言葉で質問もしたい。サーバーの管理はしたくない。2026年の試験ガイドの名前で、最も適切なサービスはどれか。", "o": ["Amazon Quick", "Amazon Athena", "AWS Glue", "Amazon Kinesis"], "a": [0], "e": "<b>正解：Amazon Quick<\/b>。合図は「ダッシュボード」「共有」「自然な言葉で質問」。Amazon QuickSight から発展したサービスで、BI の機能は Amazon Quick Sight として Quick の中にある。<br>×Athena：S3 に SQL で問い合わせる（ダッシュボードを作るものではない）。<br>×Glue：ETL とデータカタログ。<br>×Kinesis：ストリーミングデータ。<div class=\"mem\">集める（Kinesis）→ 整える（Glue）→ 問い合わせる（Athena）→ 見せる（Quick）。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/quick/latest/userguide/what-is.html"}, {"s": 3, "q": "EC サイトで、商品の価格の変更を送った順番どおりに処理しないと、値下げの後に古い値上げが反映されるなど、誤った価格が表示されてしまう。メッセージの順序を守り、同じメッセージを重複して処理しないようにしたい。最も適切なものはどれか。", "o": ["Amazon SQS の FIFO キュー", "Amazon SQS の標準キュー", "Amazon SNS の標準トピック", "Amazon SES"], "a": [0], "e": "<b>正解：Amazon SQS の FIFO キュー<\/b>。合図は「順番どおり」「重複して処理しない」。FIFO（First-In-First-Out、先入れ先出し）キューは、メッセージグループの中で送った順に受け取れ、重複排除の仕組みで1回だけの処理にできる。<br>×SQS の標準キュー：スループットはほぼ無制限だが、順序はベストエフォート（守るよう努めるが保証しない）で、同じメッセージが2回以上届くことがある（少なくとも1回の配信）。<br>×SNS の標準トピック：通知を多数の宛先に配る仕組み。順序を守って溜めておく用途ではない。<br>×Amazon SES：メールの送受信。<div class=\"mem\">順番が大事 → FIFO。量が大事 → 標準。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-queue-types.html"}, {"s": 3, "q": "Amazon SQS のキューからメッセージを受け取った処理用のサーバーが、処理の途中で止まってしまった。そのメッセージはまだ削除されていない。しばらくすると、別のサーバーが同じメッセージを受け取り、処理をやり直した。この動きを実現している SQS の仕組みはどれか。", "o": ["可視性タイムアウト（受け取ったメッセージを一定時間ほかから見えなくし、削除されなければ再び見えるようにする）", "デッドレターキュー（何度も処理に失敗したメッセージを別のキューに移す）", "ファンアウト（1つのメッセージを複製して複数の宛先に配る）", "受け取った時点で SQS がメッセージを必ず自動で削除する仕組み"], "a": [0], "e": "<b>正解：可視性タイムアウト<\/b>。受け取ったメッセージはキューに残ったまま、一定時間だけほかの受信者から見えなくなる。その間に処理して削除しなければ、時間切れで再び見えるようになり、同じ受信者か別の受信者がもう一度処理できる。だから途中で失敗してもメッセージは失われない。既定は30秒で、処理にかかる時間に合わせて変えられる。<br>×デッドレターキュー：何度も失敗するメッセージを隔離する仕組み。再び見えるようになる動きそのものではない。<br>×ファンアウト：SNS で複数の宛先に配ること。<br>×「受け取った時点で必ず削除」：誤り。削除は処理した側が行う（一部の SDK は処理の成功後に自動で削除）。受け取っただけでは消えない。<div class=\"mem\">受け取る → 見えなくなる → 消さなければ戻ってくる。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"}, {"s": 3, "q": "注文が入るたびに、在庫の処理、発送の処理、分析用の保存という3つのシステムに、同じ注文の情報を同時に届けたい。各システムは自分のペースで処理できるよう、それぞれ注文を溜めておきたい。最も適切な構成はどれか。", "o": ["Amazon SNS のトピックに発行し、3つの Amazon SQS キューをサブスクライブさせる", "1つの Amazon SQS キューに入れ、3つのシステムが同じキューから受け取る", "Amazon SES で3つのシステムにメールを送る", "AWS Step Functions で3つのシステムを1つずつ順番に呼び出す"], "a": [0], "e": "<b>正解：SNS のトピック ＋ 3つの SQS キュー（ファンアウト）<\/b>。合図は「同じ情報を同時に複数へ」「それぞれ溜めておく」。SNS はトピックに発行されたメッセージを複製し、購読しているすべての宛先に届ける。宛先を SQS キューにすると、各システムが自分のペースで処理できる。<br>×1つの SQS キューを共有：1つのメッセージは、受け取った1つの受信者が処理して削除する。3つのシステム全部には届かない。<br>×SES：メールの送受信のサービス。システム間の連携には使わない。<br>×Step Functions で順番に：処理の流れは組めるが、「同時に配って各自が溜める」という要件には SNS と SQS の組み合わせが素直。<div class=\"mem\">SNS で配って、SQS で溜める。<\/div>", "trap": "", "src": "https://docs.aws.amazon.com/sns/latest/dg/welcome.html"}, {"s": 3, "q": "AWS のサービスで起きた出来事（例：EC2 インスタンスの状態が変わった）、自社のアプリ、サードパーティのソフトウェアからのイベントを受け取り、ルールで条件に合うものだけを選んで、AWS Lambda などの宛先に届けたい。サーバーは管理したくない。最も適切なサービスはどれか。", "o": ["Amazon EventBridge", "Amazon SQS", "AWS CloudTrail", "Amazon CloudWatch のダッシュボード"], "a": [0], "e": "<b>正解：Amazon EventBridge<\/b>。合図は「イベント」「ルールで選んで宛先に届ける」「サーバーレス」。EventBridge はイベントで部品をつなぐサーバーレスのサービス。イベントバスがイベントを受け取り、ルールに合うものを0個以上の宛先に届ける。<br>×SQS：メッセージを溜めるキュー。イベントの中身でルールを決めて振り分ける仕組みではない。<br>×CloudTrail：API の呼び出しの記録（誰が何をしたか）。その記録をきっかけに処理を起動したいなら、振り分ける役は EventBridge。<br>×CloudWatch のダッシュボード：数値をグラフで見る画面。<div class=\"mem\">イベントで「つなぐ」＝ EventBridge（橋）。<\/div>", "trap": "TRAP 06", "src": "https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html"}, {"s": 3, "q": "ローンの申込みの処理で、「審査用の Lambda 関数を呼ぶ → 金額が大きければ担当者の承認を待つ → 結果を通知する」という手順を組みたい。途中で失敗したら自動で再試行し、各ステップの状態を画面で確認したい。最も適切なサービスはどれか。", "o": ["AWS Step Functions", "Amazon SQS", "Amazon EventBridge", "AWS CodePipeline"], "a": [0], "e": "<b>正解：AWS Step Functions<\/b>。合図は「手順（ワークフロー）」「条件で分岐」「人の承認を待つ」「再試行」「状態を画面で確認」。Step Functions はワークフロー（ステートマシン）で、処理の順番・分岐・並列・エラー時の再試行を定義でき、コンソールで流れを図として確認できる。<br>×SQS：メッセージを溜めるだけ。手順や分岐は持たない。<br>×EventBridge：イベントを宛先に届ける。複数のステップの順番や状態を管理する役ではない。<br>×CodePipeline：ソフトウェアのリリース（ビルド・テスト・デプロイ）の流れを自動化するサービス。業務の処理の流れではない。<div class=\"mem\">手順・分岐・再試行・承認待ち → Step Functions。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html"}, {"s": 3, "q": "AWS Organizations の一括請求（consolidated billing）について、正しいものを", "o": ["組織のすべてのアカウントの料金を、管理アカウントがまとめて支払う（請求がまとまる）", "全アカウントの使用量を合算できるので、ボリューム割引やリザーブドインスタンス、Savings Plans の割引を共有できる", "一括請求を使うには、アカウントの数に応じた追加料金がかかる", "一括請求を使うと、すべてのメンバーアカウントに Enterprise Support が自動で付く", "一括請求だけの機能セットでも、SCP でメンバーアカウントの権限を制限できる"], "a": [0, 1], "e": "<b>正解：管理アカウントがまとめて払う／使用量を合算して割引を共有<\/b>。<br>×追加料金：一括請求も AWS Organizations も追加料金なし。<br>×Enterprise Support が自動で付く：サポートプランは別に選んで契約するもの。<br>×一括請求だけで SCP：SCP は「すべての機能（all features）」を有効にした組織でだけ使える。一括請求だけの機能セットでは使えない。<div class=\"mem\">一括請求の3点：請求がまとまる、合算で割引、追加料金なし。<\/div>", "trap": "TRAP 12", "src": "https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html"}, {"s": 3, "q": "新しく AWS を本格的に使い始める会社が、セキュリティとコンプライアンスのベストプラクティスに沿った複数アカウントの環境（ランディングゾーン）を短時間で用意したい。守るべきルール（コントロール）も最初から設定し、新しいアカウントも決まった設定で払い出したい。最も適切なサービスはどれか。", "o": ["AWS Control Tower", "AWS Organizations だけを使い、OU と SCP を一から自分で設計する", "AWS Service Catalog", "AWS Trusted Advisor"], "a": [0], "e": "<b>正解：AWS Control Tower<\/b>。合図は「ランディングゾーン」「ベストプラクティスに沿って短時間で」「新しいアカウントを決まった設定で（Account Factory）」。Control Tower は AWS Organizations、AWS Service Catalog、AWS IAM Identity Center などを組み合わせて、ランディングゾーンを1時間かからずに作り、コントロールで統制する。<br>×Organizations だけで一から設計：できなくはないが、ルールやアカウントの設定を全部自分で作るので時間と手間がかかる。「短時間で、ベストプラクティスどおりに」に最も合うのは Control Tower。<br>×Service Catalog：承認済みの製品を利用者に配るカタログ。Control Tower の Account Factory の土台に使われるが、環境全体は作らない。<br>×Trusted Advisor：既存の環境を点検して推奨を出す。環境は作らない。<div class=\"mem\">Organizations ＝ 部品、Control Tower ＝ 部品を組んだ完成品（ランディングゾーン）。<\/div>", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html"}, {"s": 3, "q": "AWS Control Tower のコントロール（ガードレール）について、正しいものを", "o": ["予防的なコントロールは、ルールに反する操作をそもそも実行できないようにする（SCP などで実装される）", "発見的なコントロールは、ルールに反するリソースを見つける（AWS Config のルールで実装される）", "コントロールは1人の IAM ユーザーにだけかかり、OU の中のアカウントにはかからない", "必須（mandatory）のコントロールは、利用者がいつでも無効にできる", "コントロールは、管理アカウントのルートユーザーや管理者の操作も必ず止める"], "a": [0, 1], "e": "<b>正解：予防的＝止める（SCP など）／発見的＝見つける（AWS Config のルール）<\/b>。ほかに事前的（proactive）なコントロールもあり、CloudFormation のテンプレートで作る前に準拠を確かめ、違反なら作らせない（CloudFormation フックで実装）。<br>×1人の IAM ユーザーにだけ：コントロールは OU 全体にかかり、その中のすべてのアカウントが対象。<br>×必須をいつでも無効にできる：必須のコントロールは常にかかり、変えられない。選べるのは「強く推奨」と「任意（elective）」。<br>×管理アカウントも必ず止める：管理アカウントのルートユーザーと管理者は意図的な例外（使えなくなるのを防ぐため）。操作はログに残る。<div class=\"mem\">予防＝鍵をかける（SCP）、発見＝見回り（Config）、事前＝作る前の検査（CloudFormation フック）。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/controltower/latest/userguide/how-controls-work.html"}, {"s": 3, "q": "ある会社の IT 部門は、各チームが使ってよい構成（承認済みのインスタンスタイプ、決まったネットワーク設定の Web サーバーなど）だけを用意し、チームが必要なときに自分で起動できるようにしたい。チームには EC2 などへの幅広い権限は与えたくない。最も適切なサービスはどれか。", "o": ["AWS Service Catalog", "AWS Marketplace", "AWS License Manager", "作った AMI を誰でも使えるように公開する"], "a": [0], "e": "<b>正解：AWS Service Catalog<\/b>。合図は「承認済みの構成だけ」「自分で起動（セルフサービス）」「幅広い権限は与えない」。管理者は製品をポートフォリオにまとめ、制約（使えるインスタンスタイプなど）を付けて、IAM のユーザーやグループに使わせる。利用者は下のサービスへの直接の権限がなくても、承認された製品を起動できる。<br>×AWS Marketplace：サードパーティのソフトウェアを探して買うオンラインストア。自社の承認済み構成を配る場ではない。<br>×License Manager：ソフトウェアのライセンスの管理。<br>×AMI を誰でも使えるように公開：起動の権限やネットワーク設定を統制できず、公開範囲も広すぎる。<div class=\"mem\">社内の「承認済みメニュー」＝ Service Catalog。社外から買う店＝ Marketplace。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html"}, {"s": 3, "q": "アプリの設定値（接続先のエンドポイントの URL、環境名、使ってよい AMI の ID など）を、コードに直接書かずに一か所で管理したい。階層（/prod/アプリ名/… のような形）で整理し、IAM で読める範囲を制御したい。パスワードの自動ローテーションのような機能は不要で、追加の費用はできるだけ抑えたい。最も適切なものはどれか。", "o": ["AWS Systems Manager Parameter Store（標準のパラメータ）", "AWS Secrets Manager", "AWS Config", "AWS KMS"], "a": [0], "e": "<b>正解：Systems Manager Parameter Store<\/b>。合図は「設定値」「階層で整理」「ローテーション不要」「費用を抑える」。Parameter Store は設定データを名前つきの値（パラメータ）として一元管理する。標準の階層（standard tier）は追加料金なし。暗号化したい値は SecureString にすると AWS KMS で暗号化される。<br>×Secrets Manager：DB の認証情報や API キーなどの秘密情報向けで、自動ローテーションがある。ただしシークレットごとの月額と API 呼び出しの料金がかかる。今回の要件には過剰。<br>×AWS Config：リソースの設定の履歴とルールへの準拠を見るサービス。アプリの設定値を置く場所ではない。<br>×AWS KMS：暗号鍵の管理。値そのものを保存して配る場所ではない。<div class=\"mem\">設定値 → Parameter Store。秘密情報＋ローテーション → Secrets Manager。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html"}, {"s": 3, "q": "セキュリティの監査で、次の2つを求められた。(1) EC2 インスタンスへの接続のために SSH の受信ポートを開けるのをやめ、踏み台サーバー（bastion host）も廃止する。接続中の操作の記録は残す。(2) OS のパッチの適用状況を確認し、足りないパッチを自動で当てる。最も適切なものを", "o": ["AWS Systems Manager Session Manager", "AWS Systems Manager Patch Manager", "AWS Systems Manager Parameter Store", "Amazon Inspector", "AWS Client VPN"], "a": [0, 1], "e": "<b>正解：Session Manager と Patch Manager<\/b>。<br>Session Manager：受信ポートを開けず、踏み台サーバーや SSH キーの管理もなしに、ブラウザや AWS CLI からノードに接続できる。誰が接続できるかは IAM で決め、操作の記録を Amazon S3 や CloudWatch Logs に残せる。<br>Patch Manager：パッチベースライン（どのパッチを承認するかのルール）に沿って、足りないパッチを調べるだけ（Scan）か、調べて自動で当てる（Scan and install）かを選べる。<br>×Parameter Store：設定値の保存。<br>×Amazon Inspector：脆弱性を見つけるサービス。見つけるが、パッチを当てる役ではない（半分だけ正しい）。<br>×AWS Client VPN：利用者の端末から VPC へ暗号化した経路を作るサービス。パッチを当てる機能はなく、踏み台なしでの接続と操作の記録という要件に最も合うのは Session Manager。<div class=\"mem\">入る＝ Session Manager、直す＝ Patch Manager、一斉に＝ Run Command、置く＝ Parameter Store。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"}, {"s": 3, "q": "AWS CloudFormation のスタックで作ったセキュリティグループのルールを、誰かがコンソールから直接変更したらしい。テンプレートで定義した状態と、今の実際の設定が食い違っているリソースを見つけたい。最も適切なものはどれか。", "o": ["CloudFormation のドリフト検出", "AWS CloudTrail のイベント履歴だけを見る", "AWS Trusted Advisor のチェック", "Service Quotas"], "a": [0], "e": "<b>正解：CloudFormation のドリフト検出<\/b>。合図は「テンプレートの定義と実際の設定の食い違い」。ドリフト検出は、スタックのリソースが CloudFormation の外で変更・削除されたかを調べ、食い違い（ドリフト）があるリソースとその中身を示す。<br>×CloudTrail だけ：「誰が・いつ変更したか」は分かるが、テンプレートとの差を一覧にはしない。誰が変えたかを調べたいなら組み合わせて使う。<br>×Trusted Advisor：ベストプラクティスの点検。テンプレートとの差は見ない。<br>×Service Quotas：サービスの上限の確認と引き上げ申請。<div class=\"mem\">ドリフト＝漂流。テンプレートから流されていないかを見る。<\/div>", "trap": "TRAP 06", "src": "https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-drift.html"}, {"s": 3, "q": "EC2 インスタンス、EBS ボリューム、Lambda 関数の設定が、実際の使われ方に対して大きすぎるか小さすぎるかを知りたい。CloudWatch のメトリクスなど過去の使用状況を分析して、適正なサイズの推奨を出してほしい。最も適切なサービスはどれか。", "o": ["AWS Compute Optimizer", "AWS Pricing Calculator", "AWS Budgets", "Service Quotas"], "a": [0], "e": "<b>正解：AWS Compute Optimizer<\/b>。合図は「実際の使われ方を分析」「適正なサイズ（ライトサイジング）の推奨」。オプトイン（利用の申し込み）すると、CloudWatch の過去14日分のメトリクスなどを分析し、最適か、過剰か、不足かを示して推奨を出す。使われていない（アイドルの）リソースも見つける。<br>×Pricing Calculator：これから使う構成の料金の見積もり。今の使われ方は分析しない。<br>×Budgets：予算を決めて、超えそうなら通知する。<br>×Service Quotas：サービスの上限の確認と引き上げ申請。<div class=\"mem\">Optimizer ＝ 最適化。過去の使われ方から「ちょうどよい大きさ」を勧める。<\/div>", "trap": "TRAP 09", "src": "https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html"}, {"s": 3, "q": "ある会社は、Microsoft や Oracle のソフトウェアのライセンスを持ち込み（BYOL）、AWS とオンプレミスの両方で使っている。契約の数を超えて使ってしまわないよう、ライセンスの使用数を追跡し、上限を超える新しい起動を止めたい。最も適切なサービスはどれか。", "o": ["AWS License Manager", "Service Quotas", "AWS Marketplace", "AWS Artifact"], "a": [0], "e": "<b>正解：AWS License Manager<\/b>。合図は「ライセンス」「BYOL」「使用数を追跡」「超えないように」。License Manager は vCPU、コア、ソケット、台数などで数えるライセンスを追跡し、ルールでハードの上限（超える使用を止める）やソフトの上限を設定できる。AWS Systems Manager と組み合わせると、AWS の外のサーバーのライセンスも管理できる。<br>×Service Quotas：AWS のサービスの上限（例：リージョンあたりの VPC の数）。ソフトウェアのライセンスではない。「上限」という言葉に引っ張られないこと。<br>×AWS Marketplace：ソフトウェアを探して買う場所。<br>×AWS Artifact：AWS のコンプライアンスレポートと契約の入手。<div class=\"mem\">ライセンスの数 → License Manager。AWS の上限 → Service Quotas。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html"}, {"s": 3, "q": "新しいサービスの開始に向けて、あるリージョンで使う EC2 インスタンスや VPC の数が、アカウントの既定の上限を超えそうだと分かった。今の上限と使用量を確認し、上限の引き上げを申請したい。最も適切なサービスはどれか。", "o": ["Service Quotas", "AWS License Manager", "AWS Budgets", "AWS Health Dashboard"], "a": [0], "e": "<b>正解：Service Quotas<\/b>。合図は「上限（クォータ）」「引き上げを申請」。Service Quotas で AWS のサービスの既定値、適用中の値、使用率を一か所で確認し、調整できる上限なら引き上げを申請できる。申請は審査され、承認・却下・一部承認のいずれかになる。上限にはリージョンごとのもの（例：リージョンあたりの VPC の数）と、アカウント単位のもの（例：アカウントあたりの IAM ロールの数）がある。<br>×License Manager：ソフトウェアのライセンスの管理。<br>×Budgets：費用の予算と通知。<br>×Health Dashboard：AWS 側の障害や予定されたメンテナンスの情報。<div class=\"mem\">Quota ＝ 割り当て量。足りなければ Service Quotas から申請。<\/div><div class=\"warn\">引っかけ注意：「申請すれば必ず通る」は言い切り。審査がある。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/servicequotas/latest/userguide/intro.html"}, {"s": 3, "q": "ネットワークを担当するアカウントで作った VPC のサブネットを、同じ組織の複数のアカウントで使わせたい。各アカウントに同じネットワークを作り直すのは避けたい。最も適切なサービスはどれか。", "o": ["AWS Resource Access Manager（AWS RAM）", "AWS IAM Identity Center", "AWS Service Catalog", "AWS Control Tower のコントロール"], "a": [0], "e": "<b>正解：AWS RAM<\/b>。合図は「リソースをアカウント間で共有」「作り直さない」。RAM はリソースを1回作り、組織全体、特定の OU、特定のアカウントに共有できる。重複して作らなくてよいので運用の手間が減る。RAM 自体に追加料金はない。<br>×IAM Identity Center：社員が複数のアカウントにシングルサインオンするための仕組み。リソースは共有しない。<br>×Service Catalog：承認済みの製品を配り、各自に起動させる。共有ではなく、それぞれのアカウントに作ることになる。<br>×Control Tower のコントロール：ルールでアカウントを統制する。リソースの共有ではない。<div class=\"mem\">RAM ＝ Resource Access Manager。リソースを貸し出す。<\/div>", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/ram/latest/userguide/what-is.html"}, {"s": 3, "q": "設計部門で使っている Windows 用の CAD アプリを、社外の協力会社の人にも使わせたい。デスクトップ全体は不要で、そのアプリだけをブラウザから使わせ、データは利用者の端末に残したくない。最も適切なサービスはどれか。", "o": ["Amazon AppStream 2.0", "Amazon WorkSpaces", "Amazon WorkSpaces Secure Browser", "AWS Amplify"], "a": [0], "e": "<b>正解：Amazon AppStream 2.0<\/b>。合図は「デスクトップ全体は不要」「アプリだけ」「ブラウザから」。AppStream 2.0 は既存のデスクトップアプリを AWS で動かし、利用者に配信（ストリーミング）する。アプリは AWS 上で動き、データは利用者の端末に保存されない。<br>×WorkSpaces：仮想デスクトップ（デスクトップ全体）を提供する。アプリ1つだけなら過剰。<br>×WorkSpaces Secure Browser：社内の Web サイトや SaaS を安全に見るためのもの。Windows のデスクトップアプリは配信しない。<br>×Amplify：Web・モバイルアプリの開発とホスティング。<div class=\"mem\">デスクトップ丸ごと＝ WorkSpaces、アプリだけ＝ AppStream、Web だけ＝ Secure Browser。<\/div><div class=\"warn\">名前の注意：公式ドキュメントでは Amazon WorkSpaces Applications という名前で書かれている。試験ガイドの範囲内サービス一覧では Amazon AppStream 2.0。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/appstream2/latest/developerguide/what-is-appstream.html"}, {"s": 3, "q": "オンプレミスの VMware 上で動く数百台のサーバーを、アプリを作り直さずにそのまま AWS へ移したい（リホスト）。移行中もサーバーのデータを継続的に AWS へ複製し、切り替えのときの停止時間は数分程度にしたい。最も適切なサービスはどれか。", "o": ["AWS Application Migration Service", "AWS Database Migration Service（AWS DMS）", "AWS Application Discovery Service", "AWS Schema Conversion Tool（AWS SCT）"], "a": [0], "e": "<b>正解：AWS Application Migration Service<\/b>。合図は「サーバーをそのまま」「リホスト（リフト＆シフト）」「継続的に複製」「停止時間が短い」。物理・仮想・他のクラウドのサーバーをブロックレベルで継続的に複製し、AWS で起動できる形に変換する。切り替えの時間は通常数分。<br>×DMS：データベースのデータの移行。サーバー丸ごとではない。<br>×Application Discovery Service：移行の計画のために、オンプレミスのサーバーの情報を集める。移す役ではない。<br>×SCT：違う種類の DB へのスキーマの変換。<div class=\"mem\">サーバー丸ごと → MGN。DB → DMS。調べる → Discovery。<\/div><div class=\"warn\">名前の注意：公式ドキュメントでは AWS Transform MGN と表記されている。試験ガイドでは AWS Application Migration Service。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html"}, {"s": 3, "q": "ある会社は、データセンターから AWS への移行を検討し始めた段階である。まず (1) 今のサーバーの構成、使用率、サーバー間の通信のつながりを集め、(2) それをもとに、AWS に移した場合の費用の見込みを示すビジネスケースを作りたい。この段階で使うものを", "o": ["AWS Application Discovery Service", "Migration Evaluator", "AWS Application Migration Service", "AWS DMS", "AWS Elastic Disaster Recovery"], "a": [0, 1], "e": "<b>正解：Application Discovery Service と Migration Evaluator<\/b>。<br>Application Discovery Service：オンプレミスのサーバーの構成、使用率、サーバー間のネットワークのつながりを集める（各サーバーに入れるエージェント型と、VMware vCenter に置くエージェントレス型がある）。<br>Migration Evaluator：オンプレミスの使用状況をもとに、適正なサイズの AWS の構成と費用の見込み（BYOL とライセンス込みの比較も）を示し、移行のビジネスケース作りを助ける。<br>×Application Migration Service：実際にサーバーを移す段階で使う。<br>×DMS：実際に DB を移す段階で使う。<br>×Elastic Disaster Recovery：災害からの復旧のためのサービス。<div class=\"mem\">調べる → Discovery、試算する → Evaluator、移す → MGN・DMS。<\/div><div class=\"warn\">2026年の注意：公式ドキュメントによると、Application Discovery Service は新規のお客様の受付を終了し、代わりに AWS Transform が案内されている。試験ガイドの範囲内サービス一覧にはまだ載っている。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/application-discovery/latest/userguide/what-is-appdiscovery.html"}, {"s": 4, "q": "ある会社は EC2 を3年間使い続ける予定だが、2年目以降に新しいインスタンスファミリーや別の OS へ移る可能性が高い。リザーブドインスタンスで割引を受けながら、期間中に構成を変えられるようにしたい。最も適切なものはどれか。", "o": ["コンバーティブルリザーブドインスタンスを購入する", "スタンダードリザーブドインスタンスを購入する", "スポットインスタンスを使う", "Dedicated Hosts を割り当てる"], "a": [0], "e": "<b>正解：コンバーティブルリザーブドインスタンス<\/b>。合図は「期間中に構成を変えたい」。期間中に、ファミリー・タイプ・プラットフォーム・範囲・テナンシーの違う別のコンバーティブル RI に交換できる。<br>×スタンダード RI：割引は最も大きいが、交換はできない（一部の属性の変更だけ）。<br>×スポットインスタンス：中断されることがあり、3年間安定して動かす用途には向かない。<br>×Dedicated Hosts：物理サーバーの専有。構成変更の柔軟さとは関係がない。<div class=\"mem\">コンバーティブル＝コンバート（変換）できる。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-types.html"}, {"s": 4, "q": "ある会社は、事業の縮小で、残り期間が1年以上あるリザーブドインスタンスが不要になった。使わない RI を、他の AWS のお客様に売りたい。リザーブドインスタンスマーケットプレイスで売ることができるものはどれか。", "o": ["スタンダードリザーブドインスタンス", "コンバーティブルリザーブドインスタンス", "Compute Savings Plans", "オンデマンドキャパシティ予約"], "a": [0], "e": "<b>正解：スタンダードリザーブドインスタンス<\/b>。合図は「売りたい」。スタンダード RI はリザーブドインスタンスマーケットプレイスで売買できる。<br>×コンバーティブル RI：マーケットプレイスで売ることも買うこともできない。代わりに交換ができる。<br>×Compute Savings Plans：RI マーケットプレイスで売る仕組みではない。<br>×オンデマンドキャパシティ予約：期間の約束がない予約なので、不要ならキャンセルするだけ。<div class=\"mem\">スタンダードは「売れる」、コンバーティブルは「換えられる」。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-types.html"}, {"s": 4, "q": "ある会社は、東京リージョンの特定のアベイラビリティーゾーン（AZ）で、今後1年間、決まった数の EC2 インスタンスを確実に起動できるようにしたい。同時に、オンデマンドより安い料金にしたい。最も適切なものはどれか。", "o": ["その AZ を指定したゾーナルリザーブドインスタンスを購入する", "リージョナルリザーブドインスタンスを購入する", "Compute Savings Plans を購入する", "スポットインスタンスを使う"], "a": [0], "e": "<b>正解：ゾーナルリザーブドインスタンス<\/b>。合図は「特定の AZ で確実に起動」と「割引」の両方。ゾーナル RI は指定した AZ で容量を予約し、割引も付く。<br>×リージョナル RI：AZ を問わず割引が効くが、容量は予約しない。<br>×Compute Savings Plans：割引だけで、容量の予約はない。<br>×スポットインスタンス：中断されることがあり、確実に起動できるとは限らない。<div class=\"mem\">ゾーン（AZ）を決めると、席（容量）も取れる。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html"}, {"s": 4, "q": "リージョナルリザーブドインスタンスについて正しいものはどれか。", "o": ["リージョン内のどのアベイラビリティーゾーンで動くインスタンスにも割引が効く", "条件を満たせば、同じインスタンスファミリーの別のサイズにも割引が効く", "指定したアベイラビリティーゾーンで容量を予約する", "ゾーナルリザーブドインスタンスより料金が高い", "期間中に別のインスタンスファミリーへ必ず交換できる"], "a": [0, 1], "e": "<b>正解：AZ を問わず割引が効く、同じファミリーのサイズ違いにも効く<\/b>。サイズの柔軟性は、Linux/Unix かつ共有テナンシーの RI で使える。<br>×容量を予約する：それはゾーナル RI。リージョナル RI は容量を予約しない。<br>×料金が高い：範囲（リージョナルかゾーナルか）で価格は変わらない。<br>×必ず交換できる：交換できるのはコンバーティブル RI。範囲の話ではない。<div class=\"mem\">リージョナル＝割引が広く効く、席は取らない。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html"}, {"s": 4, "q": "ある会社は、東京リージョンで M 系のインスタンスファミリーだけを、今後3年間使い続けると決めている。インスタンスのサイズや OS は途中で変える。AWS Lambda や AWS Fargate は使わない。Savings Plans で最も大きな割引を受けたい。最も適切なものはどれか。", "o": ["EC2 Instance Savings Plans", "Compute Savings Plans", "コンバーティブルリザーブドインスタンス", "スポットインスタンス"], "a": [0], "e": "<b>正解：EC2 Instance Savings Plans<\/b>。合図は「1つのリージョンの1つのファミリー」「最も大きな割引」。選んだリージョンのファミリーなら、サイズ・AZ・OS・テナンシーを問わず最大72%の割引。<br>×Compute Savings Plans：リージョンやファミリーをまたげて Lambda・Fargate にも効くが、割引は最大66%と小さめ。この会社には柔軟さが要らない。<br>×コンバーティブル RI：交換はできるが、Savings Plans の質問の答えではなく、割引も最大66%。<br>×スポットインスタンス：中断されることがあり、3年間使い続ける前提に合わない。<div class=\"mem\">柔軟さが要らないなら、狭く約束して深く割引（EC2 Instance）。<\/div>", "trap": "TRAP 01", "src": "https://aws.amazon.com/savingsplans/faq/"}, {"s": 4, "q": "あるデータ分析チームは、Amazon SageMaker AI で機械学習モデルの学習と推論を一年中続けている。インスタンスのファミリーやリージョンは変わる可能性がある。SageMaker AI の利用料を、約束によって下げたい。最も適切なものはどれか。", "o": ["SageMaker AI 向けの Savings Plans（Amazon SageMaker Savings Plans）", "Compute Savings Plans", "EC2 Instance Savings Plans", "スポットインスタンス"], "a": [0], "e": "<b>正解：SageMaker AI 向けの Savings Plans<\/b>。合図は「SageMaker AI の利用料」。学習・推論・ノートブックなどの対象の利用に、ファミリー・サイズ・リージョンを問わず割引が効く（最大64%）。<br>×Compute Savings Plans：効くのは EC2・Lambda・Fargate。SageMaker AI には効かない。<br>×EC2 Instance Savings Plans：特定のリージョンの EC2 のファミリーだけ。<br>×スポットインスタンス：EC2 の買い方。約束による割引ではない。<div class=\"mem\">Savings Plans は「どのサービスに効くか」で選ぶ。Compute は EC2・Lambda・Fargate の3つ。<\/div>", "trap": "TRAP 11", "src": "https://aws.amazon.com/savingsplans/faq/"}, {"s": 4, "q": "ある会社は、動画の変換処理をスポットインスタンスで動かしている。インスタンスが中断される前に、途中の結果を Amazon S3 に保存してから終わらせたい。AWS が中断の前に提供するものとして、最も適切なものはどれか。", "o": ["中断の約2分前に、Amazon EventBridge のイベントとインスタンスメタデータで中断通知が出る", "中断の24時間前に、アカウントのメールアドレスへ必ず通知が届く", "スポットインスタンスは、一度起動すれば中断されることはない", "中断の1時間前に、AWS Health Dashboard にメンテナンス予定が表示される"], "a": [0], "e": "<b>正解：約2分前の中断通知<\/b>。合図は「中断される前に保存」。スポットインスタンスの中断通知は、停止・終了の2分前に出る。EventBridge で受けたり、インスタンスメタデータを確認したりして、後始末の処理を動かせる（休止を選んだ場合は2分前の予告なし）。<br>×24時間前に必ずメール：そのような仕組みではない。「必ず」は言い切り。<br>×中断されない：スポットは AWS が容量を必要とすると中断される。<br>×1時間前に Health Dashboard：スポットの中断はこの方法では知らされない。<div class=\"mem\">スポットの合図は「2分」。カップラーメンより短い。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html"}, {"s": 4, "q": "ある金融機関は、規制のため、EC2 インスタンスを他のお客様とハードウェアを共有しない環境で動かす必要がある。ソケット数やコア数に基づくライセンスは使っておらず、どの物理サーバーに配置されるかを管理する必要もない。インスタンス単位で課金されるほうがよい。最も適切なものはどれか。", "o": ["Dedicated Instances", "Dedicated Hosts", "スポットインスタンス", "オンデマンドキャパシティ予約（共有テナンシー）"], "a": [0], "e": "<b>正解：Dedicated Instances<\/b>。合図は「ハードウェアを共有しないだけでよい」「配置の管理は不要」「インスタンス単位の課金」。<br>×Dedicated Hosts：ホスト単位の課金。ソケット・コアが見え、配置を管理できる。ソケット・コア単位のライセンス（BYOL）が必要なときに選ぶ。<br>×スポットインスタンス：余った容量を安く使う買い方。専有ではない。<br>×共有テナンシーのキャパシティ予約：容量の確保であって、ハードウェアの専有ではない。<div class=\"mem\">ホスト＝サーバー丸ごと借りて中まで見える。インスタンス＝自分専用の部屋だが建物の図面は見えない。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html"}, {"s": 4, "q": "ある会社は AWS Organizations で複数のアカウントを管理している。リザーブドインスタンスと Savings Plans の割引は組織内で共有されているが、子会社用の1つのメンバーアカウントだけは、他のアカウントで買った割引を受けないようにしたい。最も適切なものはどれか。", "o": ["管理アカウントで、そのアカウントの RI と Savings Plans の割引の共有を無効にする", "メンバーアカウントで、購入済みのリザーブドインスタンスをすべてキャンセルする", "サービスコントロールポリシー（SCP）で EC2 の起動を禁止する", "一括請求では割引は常に全アカウントで共有されるため、変更できない"], "a": [0], "e": "<b>正解：管理アカウントで割引の共有を無効にする<\/b>。組織の管理アカウントは、Billing の設定でアカウントごとに RI と Savings Plans の割引の共有を有効・無効にできる。<br>×RI をキャンセル：割引の共有の設定とは関係がない。<br>×SCP で起動を禁止：アカウントでのサービスの利用を止めてしまう。割引の共有とは別の話。<br>×常に共有で変更不可：言い切り。共有は設定で変えられる。<div class=\"mem\">割引の配り方を決めるのは、お財布を持つ管理アカウント。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html"}, {"s": 4, "q": "ある学生は、AWS を初めて使い、学習のためにいくつかのサービスを試したい。誤って課金されることは絶対に避けたい。新しく AWS アカウントを作るとき、最も適切なものはどれか。", "o": ["無料アカウントプラン（Free account plan）を選ぶ", "有料アカウントプラン（Paid account plan）を選び、クレジットがなくなっても請求されないことを確認する", "Business Support+ に加入する", "Dedicated Hosts を使い、無料利用枠を受ける"], "a": [0], "e": "<b>正解：無料アカウントプラン<\/b>。合図は「試したい」「課金を絶対に避けたい」。無料プランでは、有料プランにアップグレードしない限り請求されない（最大6か月、またはクレジットを使い切るまで）。<br>×有料プラン：クレジットを超えた分や、クレジットが効かないサービスは通常の料金で請求される。<br>×Business Support+：有料のサポートプラン。課金を避ける話ではない。<br>×Dedicated Hosts：無料利用枠の対象外。<div class=\"mem\">試すだけなら「無料プラン」、本番なら「有料プラン」。<\/div>", "trap": "TRAP 12", "src": "https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/free-tier.html"}, {"s": 4, "q": "AWS の無料アカウントプラン（Free account plan）について、AWS の公式の説明と合っているものはどれか。", "o": ["新しいお客様は、アカウント作成時に100ドル分のクレジットを受け取り、決められた活動でさらに最大100ドル分を得られる", "無料プランは、6か月たつか、クレジットを使い切るか、どちらか早いほうで終わる", "無料プランでは、AWS のすべてのサービスを制限なく使える", "無料プランが終わると、自動で有料プランに切り替わり、利用料が請求される", "無料プランが終わると、データはその日のうちに消去され、元に戻せない"], "a": [0, 1], "e": "<b>正解：100ドル＋最大100ドルのクレジット、6か月かクレジットを使い切るまで<\/b>。<br>×すべてのサービスを制限なく：無料プランでは、クレジットをすぐに使い切るようなサービスやハードウェアの購入は使えない。<br>×自動で有料プランへ：自分でアップグレードしない限り請求されない。<br>×その日のうちに消去：アカウントは停止されるが、AWS はデータを90日保持し、その間にアップグレードすれば戻せる。<div class=\"mem\">100＋100ドル、6か月。終わっても90日は待ってくれる。<\/div>", "trap": "TRAP 12", "src": "https://aws.amazon.com/free/free-tier-faqs/"}, {"s": 4, "q": "ある会社は、購入したリザーブドインスタンスが十分に使われているかを見張りたい。1日の RI 使用率が80%を下回ったら、メールで知らせてほしい。最も適切なものはどれか。", "o": ["AWS Budgets で RI 使用率予算を作る", "AWS Pricing Calculator で見積もりを作り直す", "AWS CloudTrail で RI の購入の API 呼び出しを記録する", "AWS Health Dashboard で RI の状態を確認する"], "a": [0], "e": "<b>正解：AWS Budgets の RI 使用率予算<\/b>。合図は「下回ったら知らせて」。Budgets には、コスト予算・使用量予算のほかに、RI と Savings Plans の使用率予算・カバレッジ予算がある。通知はメールか Amazon SNS。<br>×Pricing Calculator：使う前の見積もり。<br>×CloudTrail：API 呼び出しの記録。使用率の見張りではない。<br>×Health Dashboard：AWS 側の障害やメンテナンスの情報。<div class=\"mem\">「しきい値を超えたら・下回ったら知らせて」は Budgets。<\/div>", "trap": "TRAP 09", "src": "https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html"}, {"s": 4, "q": "ある会社は、開発用アカウントの月の費用の予測が予算の90%に達したら、通知するだけでなく、開発者が新しい EC2 インスタンスを作れないようにする IAM ポリシーを自動で適用したい。最も適切なものはどれか。", "o": ["AWS Budgets の予算アクションを設定する", "AWS Cost Explorer の予測を毎日確認する", "AWS Cost and Usage Report を S3 に出力する", "AWS Organizations の一括請求を有効にする"], "a": [0], "e": "<b>正解：AWS Budgets の予算アクション<\/b>。合図は「しきい値に達したら、自動でポリシーを適用」。予算アクションは、自動で、または承認のあとで、IAM ポリシーや SCP の適用、特定の EC2・RDS インスタンスを対象にした操作を行える。<br>×Cost Explorer：分析と予測を見るツール。自動でポリシーを適用しない。<br>×Cost and Usage Report：詳細な請求データの出力。<br>×一括請求：請求をまとめる機能。利用を止める機能ではない。<div class=\"mem\">Budgets は「見張って、知らせて、止める」。<\/div>", "trap": "TRAP 09", "src": "https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-controls.html"}, {"s": 4, "q": "ある会社は、すべての EC2 インスタンスに「CostCenter」というタグを付けた。しかし、AWS Cost Explorer でこのタグごとにコストを分けて見ることができない。最も可能性が高い原因と対処はどれか。", "o": ["タグをコスト配分タグとして、Billing and Cost Management コンソールで有効化していない", "タグを付ければ、すべてのレポートに必ずすぐに表示されるので、AWS の障害である", "AWS CloudTrail を有効にしていない", "AWS Config のルールでタグを評価していない"], "a": [0], "e": "<b>正解：コスト配分タグとして有効化していない<\/b>。ユーザー定義タグも AWS 生成タグも、有効化しないと Cost Explorer やコスト配分レポートに出てこない。有効化してから表示まで最大24時間。組織では管理アカウントが有効化する。<br>×必ずすぐに表示：言い切り。有効化が必要。<br>×CloudTrail：API の記録。コストの分類とは関係がない。<br>×Config：設定の準拠を評価するもの。コストの集計には使わない。<div class=\"mem\">タグは「付けて、有効化して、やっと見える」。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html"}, {"s": 4, "q": "AWS のコスト配分タグについて正しいものはどれか。", "o": ["AWS が付ける AWS 生成タグと、利用者が付けるユーザー定義タグの2種類がある", "AWS Organizations では、コスト配分タグを管理できるのは管理アカウントである", "AWS 生成タグは有効化しなくても、常に Cost Explorer に表示される", "有効化すると、その瞬間にすべての画面に反映される", "コスト配分タグを付けると、リソースへのアクセスが制限される"], "a": [0, 1], "e": "<b>正解：2種類（AWS 生成とユーザー定義）、組織では管理アカウントが管理<\/b>。AWS 生成タグは aws: で始まり（例 createdBy）、ユーザー定義タグは user: で始まる。<br>×AWS 生成タグは有効化不要：どちらの種類も、それぞれ有効化が必要。「常に」は言い切り。<br>×その瞬間に反映：表示まで最大24時間かかる。<br>×アクセスが制限される：コスト配分タグはコストの分類のためのもの。アクセス制御の仕組みではない。<div class=\"mem\">タグは2種類、どちらも有効化、組織では管理アカウント。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html"}, {"s": 4, "q": "ある会社の財務チームは、請求データのうち必要な列だけを選び、特定のアカウントの行を除いた、最も細かいコストと使用量のデータを、毎日 Amazon S3 に自動で出力して分析したい。最も適切なものはどれか。", "o": ["AWS Data Exports で Cost and Usage Report 2.0（CUR 2.0）のエクスポートを作る", "AWS Cost Explorer の画面でグラフを見る", "AWS Budgets でコスト予算を作る", "AWS Pricing Calculator で見積もりを作り、CSV で出力する"], "a": [0], "e": "<b>正解：AWS Data Exports の CUR 2.0<\/b>。合図は「最も細かい」「列を選ぶ」「S3 に定期的に出力」。Data Exports は、列の選択や SQL での絞り込みをして、最も細かいデータを S3 に定期的に出力できる。CUR 2.0 は詳細なコストと使用量のデータを受け取る推奨の方法。<br>×Cost Explorer：グラフで分析・予測する。最も細かいデータを S3 に定期出力するものではない。<br>×Budgets：予算の通知。<br>×Pricing Calculator：使う前の見積もり。実際の請求データではない。<div class=\"mem\">「最も細かい請求データを S3 へ」は CUR。今の入口は Data Exports。<\/div>", "trap": "TRAP 09", "src": "https://docs.aws.amazon.com/cur/latest/userguide/what-is-data-exports.html"}, {"s": 4, "q": "AWS Pricing Calculator について正しいものはどれか。", "o": ["無料で使える", "見積もりのリンクを保存して共有したり、CSV や PDF で出力したりできる", "見積もりには、かかる税金がすべて含まれる", "見積もった金額で、実際の請求額が保証される", "使うには Business Support+ 以上のサポートプランが必要である"], "a": [0, 1], "e": "<b>正解：無料、リンクの共有と CSV・PDF での出力<\/b>。AWS や クラウドの経験がなくても使える。<br>×税金が含まれる：見積もりには税金は含まれない。<br>×実際の請求額が保証される：あくまで入力した情報からの見積もり。<br>×サポートプランが必要：無料のツールで、サポートプランは関係ない。<div class=\"mem\">Calculator は「使う前に、無料で、見積もって、共有」。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/pricing-calculator/latest/userguide/what-is-pricing-calculator.html"}, {"s": 4, "q": "ある会社は、AWS 側の障害やメンテナンスの情報を、自社の運用ツールにプログラムから自動で取り込みたい。そのために AWS Health API を使いたい。今は Basic サポートを使っている。最もコストを抑えて Health API を使えるようにするには、どうするのが最も適切か。", "o": ["Business Support+ に変更する", "Basic のままでよい。Health API はすべてのお客様が使える", "Enterprise Support 以上に変更する必要がある", "Unified Operations に変更する必要がある"], "a": [0], "e": "<b>正解：Business Support+ に変更する<\/b>。AWS Health API を使うには、Business Support+、Enterprise Support、Unified Operations のいずれかが必要。最も安いのは Business Support+。<br>×Basic のままでよい：Basic でも AWS Health Dashboard は見られるが、Health API は使えない（呼ぶとエラー）。<br>×Enterprise Support 以上が必要：Business Support+ で使える。<br>×Unified Operations が必要：最も高いプラン。必要以上。<div class=\"mem\">「画面で見る」は全員、「API で取る」は Business Support+ から。<\/div>", "trap": "TRAP 12", "src": "https://docs.aws.amazon.com/health/latest/ug/health-api.html"}, {"s": 4, "q": "Basic サポートのお客様が、追加の料金なしで使える AWS Trusted Advisor のチェックとして、最も適切なものはどれか。", "o": ["サービスの上限（Service Limits）カテゴリのすべてのチェックと、セキュリティ・耐障害性カテゴリの一部のチェック", "コスト最適化カテゴリのすべてのチェック", "すべてのカテゴリのすべてのチェックと Trusted Advisor API", "Trusted Advisor Priority による優先順位付きの推奨"], "a": [0], "e": "<b>正解：サービスの上限のすべてと、セキュリティ・耐障害性の一部<\/b>。Basic では、セキュリティのチェックは手動で更新する必要がある。<br>×コスト最適化のすべて：Business Support+ 以上。<br>×すべてのチェックと API：Business Support+ 以上。<br>×Trusted Advisor Priority：Enterprise Support と Unified Operations。<div class=\"mem\">Basic の Trusted Advisor は「上限と、セキュリティの基本」だけ。<\/div>", "trap": "TRAP 12", "src": "https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html"}, {"s": 4, "q": "ある会社は、専任のテクニカルアカウントマネージャー（TAM）を付けたい。また、アカウントの乗っ取りやランサムウェアなどのセキュリティインシデントに備えて、AWS Security Incident Response を追加料金なしで使いたい。条件を満たす最も安いサポートプランはどれか。", "o": ["Enterprise Support", "Business Support+", "Unified Operations", "Basic"], "a": [0], "e": "<b>正解：Enterprise Support<\/b>。専任の TAM、本番の重大な障害への15分以内の応答、AWS Security Incident Response の利用が含まれる（月5,000ドル〜）。<br>×Business Support+：24時間の技術サポートはあるが、専任の TAM はない。<br>×Unified Operations：条件は満たすが、月50,000ドル〜で、最も安いものではない。<br>×Basic：技術サポートも TAM もない。<div class=\"mem\">TAM が欲しくなったら Enterprise。セキュリティインシデント対応も付いてくる。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html"}, {"s": 4, "q": "ある大手企業は、止まると事業に大きな影響が出る重要なシステムを AWS で動かしている。TAM に加えて、自社のユースケースに詳しいドメインスペシャリストエンジニアを付けたい。重大な障害には、インシデント管理エンジニアに数分以内で対応してほしい。最も適切なサポートプランはどれか。", "o": ["Unified Operations", "Enterprise Support", "Business Support+", "AWS Professional Services と Basic の組み合わせ"], "a": [0], "e": "<b>正解：Unified Operations<\/b>。合図は「ドメインスペシャリストエンジニア」「インシデント管理エンジニア」「数分以内」。TAM と DSE が付き、重大な障害にはインシデント管理エンジニアが5分以内に対応する。AWS Countdown Premium や重要ワークロードのレビューも含まれる。<br>×Enterprise Support：TAM は付くが、DSE やインシデント管理エンジニアの5分以内の対応はない。<br>×Business Support+：TAM もない。<br>×Professional Services と Basic：Professional Services はプロジェクト単位の支援。24時間の障害対応のサポートプランではない。<div class=\"mem\">一番上の Unified Operations は「専門家チームが張り付く」。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html"}, {"s": 4, "q": "ある会社は、旧サポートプランの Enterprise On-Ramp を契約している。AWS の公式の案内によると、このプランは今後どうなるか。最も適切なものはどれか。", "o": ["2026年中に契約更新時などで順に Enterprise Support へ自動で移行し、Enterprise On-Ramp は2027年1月1日で終了する", "2027年1月1日に自動で Basic に戻り、技術サポートが使えなくなる", "料金は変わらず、ずっと提供が続く", "2027年1月1日以降は、自分で Business Support+ を申し込まない限りすべてのサポートが止まる"], "a": [0], "e": "<b>正解：Enterprise Support へ自動で移行し、2027年1月1日で終了<\/b>。移行の1か月前にメールで知らせが届き、お客様の作業は不要。なお Developer と Business は、2027年1月1日までに自分で Business Support+ へ移る案内になっている。<br>×Basic に戻る：Enterprise On-Ramp は Enterprise Support へ自動で移行する。<br>×ずっと続く：2027年1月1日で終了する。<br>×すべてのサポートが止まる：自動で移行するので、自分で申し込む必要はない。<div class=\"mem\">On-Ramp（入口）から、本線の Enterprise へ自動で合流。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html"}, {"s": 4, "q": "ある会社は、サードパーティのセキュリティ製品を、AWS で動かすために購入したい。時間単位や年単位の料金、手持ちのライセンスの持ち込み（BYOL）から選べて、費用は AWS の請求書にまとめたい。最も適切なものはどれか。", "o": ["AWS Marketplace", "AWS Partner Network（APN）", "AWS Service Catalog", "AWS Professional Services"], "a": [0], "e": "<b>正解：AWS Marketplace<\/b>。合図は「サードパーティの製品を購入」「AWS の請求書にまとめる」。無料トライアル、時間単位、月単位、年単位、複数年、BYOL などの料金があり、費用は AWS の請求に含まれる。<br>×APN：AWS のパートナー企業のプログラム。製品を買う場所ではない。<br>×Service Catalog：社内で承認した製品のカタログを管理するもの。外部の製品を買う場所ではない。<br>×Professional Services：AWS の専門家チームによる導入支援。<div class=\"mem\">買う＝Marketplace、手伝ってもらう会社＝APN、AWS 自身の専門家＝Professional Services。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html"}, {"s": 4, "q": "AWS Lambda の料金を決める主な要素として、正しいものはどれか。", "o": ["関数へのリクエストの数", "コードが動いた時間と、関数に割り当てたメモリの量（GB 秒）", "関数が呼ばれていない間も、サーバーが起動している時間", "関数を置くアベイラビリティーゾーンの数", "使う量に関係なく、Lambda は常に無料"], "a": [0, 1], "e": "<b>正解：リクエストの数、動いた時間とメモリ（GB 秒）<\/b>。無料利用枠では、月100万リクエストと40万 GB 秒が含まれる。<br>×呼ばれていない間のサーバーの時間：サーバーレスなので、待っている間のサーバー代はかからない。<br>×AZ の数：料金の要素ではない。<br>×常に無料：言い切り。無料の枠を超えると課金される。<div class=\"mem\">Lambda は「回数×時間×メモリ」。<\/div>", "trap": "TRAP 08", "src": "https://aws.amazon.com/lambda/pricing/"}, {"s": 4, "q": "Amazon S3 のデータ転送の料金について、帯域幅の料金がかからないものはどれか。", "o": ["インターネットから S3 へのデータ転送（受信）", "S3 から Amazon CloudFront へのデータ転送", "S3 からインターネットへのデータ転送（送信）", "S3 のクロスリージョンレプリケーションでの、リージョン間のデータ転送", "S3 から別のリージョンの EC2 インスタンスへのデータ転送"], "a": [0, 1], "e": "<b>正解：インターネットからの受信、CloudFront への転送<\/b>。S3 の料金ページでは、これらと、同じリージョン内の S3 バケット間の転送が、帯域幅の料金の例外になっている。<br>×インターネットへの送信：有料。<br>×クロスリージョンレプリケーション：リージョン間の転送料がかかる。<br>×別のリージョンへの転送：リージョンをまたぐ転送は有料。<div class=\"mem\">入るのはタダ、CloudFront へもタダ、外へ出るのとリージョンをまたぐのは有料。<\/div>", "trap": "TRAP 08", "src": "https://aws.amazon.com/s3/pricing/"}, {"s": 0, "q": "ある小売会社がオンプレミスから AWS に移行する。受注 DB は今後3年間、24時間365日同じ規模で動き続ける。一方、Web サーバーは年末のセールの時期だけアクセスが数倍になり、それ以外は少ない。コストを最も抑えられる組み合わせはどれか。", "o": ["受注 DB も Web サーバーも、セールの時期の最大の台数に合わせて3年のリザーブドインスタンスを買う", "受注 DB はオンデマンド、Web サーバーは Dedicated Hosts で動かす", "受注 DB はリザーブドインスタンス（または Savings Plans）で買い、Web サーバーは Auto Scaling でオンデマンドの台数を需要に合わせて増減する", "受注 DB も Web サーバーもスポットインスタンスで動かす。スポットは常に最も安いので、すべての用途に向いている"], "a": [2], "e": "<b>正解：一定の DB は予約で割引、変動する Web は Auto Scaling で必要な分だけ<\/b>。合図は「3年間・24時間365日・同じ規模」と「セールの時期だけ」。<br>×スポットで全部：中断されることがあるので、止められない受注 DB には向かない。「常に」も言い切りの誤り。<br>×最大に合わせて3年予約：セール以外の時期は使わない容量にお金を払い続ける。クラウドの利点（容量の推測をやめる）を捨てている。<br>×Dedicated Hosts：ライセンスや規制のための専有で、コスト削減の手段ではない。<div class=\"mem\">一定は予約、変動は自動で増減、中断してよいならスポット。<\/div>", "trap": "TRAP 01", "src": "https://aws.amazon.com/ec2/pricing/"}, {"s": 0, "q": "医療データを扱う会社が AWS に移行する。法律で患者データを日本の国内に保存する必要がある。また、データセンター1か所の障害でもサービスを止めたくない。最も適切なものを", "o": ["同じリージョン内の複数のアベイラビリティーゾーン（AZ）にシステムを配置する", "日本国内のリージョン（東京や大阪）を選び、そのリージョンにデータを保存する", "AWS のデータセンターは必ず止まらないので、1つの AZ に置けば十分である", "Amazon CloudFront を使えば、データが世界中のリージョンに自動で複製され、可用性が上がる", "データをエッジロケーションに保存すれば、国外に出ることはない"], "a": [0, 1], "e": "<b>正解：国内のリージョンを選ぶ（データ主権）＋複数 AZ に置く（高可用性）<\/b>。合図は「国内に保存」と「データセンター1か所の障害」。<br>×エッジロケーションに保存：エッジロケーションはコンテンツを配信するキャッシュの拠点で、データの保存先を決める場所ではない。<br>×必ず止まらない：言い切りの誤り。AZ ごとの障害を前提に、複数 AZ で設計する。<br>×CloudFront で全リージョンに複製：CloudFront はリージョンにデータを複製するサービスではない。お客様が選んだリージョンの外にデータを勝手に移すこともない。<div class=\"mem\">どこに置くか＝リージョン（データ主権）、止めないため＝複数 AZ。<\/div>", "trap": "TRAP 04", "src": "https://docs.aws.amazon.com/whitepapers/latest/aws-overview/global-infrastructure.html"}, {"s": 0, "q": "会社は、AWS Lambda と Amazon DynamoDB でサーバーレスのアプリを作った。AWS 責任共有モデルで、お客様の責任に当てはまらないものはどれか。", "o": ["どのデータを保存するか、そのデータをどう分類して扱うか", "Lambda 関数が動く基盤のサーバーの OS にセキュリティパッチを当てること", "DynamoDB のテーブルを誰が読み書きできるかを決める IAM ポリシー", "Lambda 関数のコードの中身と、その中の脆弱性"], "a": [1], "e": "<b>正解：基盤の OS のパッチ<\/b>。サーバーレスでは、基盤のサーバーと OS の管理は AWS の責任。<br>×コードの中身：お客様が書いたコードはお客様の責任。<br>×IAM ポリシー：誰に何を許すかは、どのサービスでも常にお客様の責任。<br>×データの分類と扱い：データはお客様のもの。<div class=\"mem\">サーバーレスでも残るお客様の責任は「コード・権限・データ」の3つ。<\/div>", "trap": "TRAP 05", "src": "https://aws.amazon.com/compliance/shared-responsibility-model/"}, {"s": 0, "q": "運用の担当者がいない小さなスタートアップが、新しい Web サービスの API とデータの保存先を作る。サーバーの管理をせず、使った分だけ払いたい。最も適切なものを", "o": ["Amazon DynamoDB", "AWS Lambda", "AWS Outposts", "Amazon EC2 の Dedicated Hosts", "EC2 インスタンスに自分でインストールした MySQL"], "a": [0, 1], "e": "<b>正解：Lambda と DynamoDB<\/b>。合図は「サーバーの管理をせず」「使った分だけ」。どちらもサーバーレスで、リクエストや使用量に応じて払う。<br>×Dedicated Hosts：物理サーバーを専有する買い方で、管理も費用も増える。<br>×Outposts：AWS の機器を自社のデータセンターに置くもの。スタートアップの目的と合わない。<br>×EC2 上の MySQL：OS や DB のパッチ、バックアップを自分で行う必要がある。<div class=\"mem\">「管理しない＋使った分だけ」＝サーバーレス（Lambda、DynamoDB、Fargate など）。<\/div>", "trap": "TRAP 02", "src": "https://aws.amazon.com/serverless/"}, {"s": 0, "q": "AWS に移行した会社に監査が入った。監査人は(1) AWS 自身が第三者の監査を受けた証明書（SOC レポートなど）と、(2) 先週、誰がどの S3 バケットを削除したかの記録を求めている。それぞれに使うサービスを", "o": ["AWS Artifact", "AWS CloudTrail", "Amazon Inspector", "AWS Trusted Advisor", "Amazon Macie"], "a": [0, 1], "e": "<b>正解：(1) は AWS Artifact、(2) は AWS CloudTrail<\/b>。合図は「AWS の監査レポート」と「誰が、いつ、何をしたか」。<br>×Inspector：EC2 やコンテナイメージなどの脆弱性を探す。操作の記録ではない。<br>×Trusted Advisor：コストやセキュリティのベストプラクティスの点検。<br>×Macie：S3 の中の個人情報などの機密データを見つける。<div class=\"mem\">AWS の証明書＝Artifact、API 操作の足跡＝CloudTrail。<\/div>", "trap": "TRAP 06", "src": "https://aws.amazon.com/artifact/"}, {"s": 0, "q": "ある企業には部署ごとに20の AWS アカウントがある。(1) どのアカウントでも日本以外のリージョンを使えないように制限し、(2) 請求を1つにまとめて使用量の割引を受けたい。最も適切なものはどれか。", "o": ["AWS IAM Identity Center で、社員のサインインを1か所にまとめる", "AWS Organizations を使い、サービスコントロールポリシー（SCP）と一括請求（統合請求）を設定する", "AWS Config で、リージョンごとの設定の変化を記録する", "AWS Budgets で、アカウントごとに予算を作る"], "a": [1], "e": "<b>正解：AWS Organizations（SCP＋一括請求）<\/b>。合図は「複数アカウントで使えないように制限」と「請求を1つ」。SCP はアカウントで使える権限の上限を決め、一括請求は使用量を合算する。<br>×IAM Identity Center：サインインと権限の割り当てをまとめるもので、組織全体の上限や請求は扱わない。<br>×Budgets：予算の通知で、使用を禁止できない。<br>×Config：設定を記録・評価するが、使えないようにするものではない。<div class=\"mem\">複数アカウントの「禁止」と「請求」＝Organizations。<\/div>", "trap": "", "src": "https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"}, {"s": 0, "q": "季節によって需要が大きく変わる会社が、AWS への移行の利点を経営会議で説明する。AWS クラウドの利点として当てはまらないものはどれか。", "o": ["AWS に移行すれば、データとアクセス権の管理を含め、セキュリティの責任はすべて AWS に移る", "数分で世界の複数のリージョンにシステムを展開できる", "データセンターや機器への先行投資（設備投資）を、使った分だけの変動費に変えられる", "需要の予測が外れても、必要なときに容量を増やしたり減らしたりできる"], "a": [0], "e": "<b>正解（当てはまらない）：セキュリティの責任がすべて AWS に移る<\/b>。責任共有モデルでは、データ、権限、設定などはお客様の責任のまま。「すべて」は言い切りの誤り。<br>×容量を増減できる：「容量の推測をやめる」利点。<br>×変動費に変える：「設備投資を変動費に」の利点。<br>×数分で世界に展開：「数分でグローバルに展開」の利点。<div class=\"mem\">利点の文に「すべて AWS が」と出たら疑う。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/whitepapers/latest/aws-overview/six-advantages-of-cloud-computing.html"}, {"s": 0, "q": "世界中に顧客がいる EC サイトを AWS に移す。画像などの静的なコンテンツを顧客の近くから低い遅延で配信し、さらにネットワーク層（レイヤー3・4）の一般的な DDoS 攻撃から、追加料金なしで守りたい。最も適切なものを", "o": ["AWS Shield Standard", "Amazon CloudFront", "AWS Shield Advanced", "Amazon Inspector", "AWS Direct Connect"], "a": [0, 1], "e": "<b>正解：CloudFront と Shield Standard<\/b>。合図は「顧客の近くから配信」と「追加料金なし」。Shield Standard はすべての AWS のお客様に追加料金なしで自動で適用される。<br>×Shield Advanced：より高度な保護と専門チームの支援があるが有料。「追加料金なし」に合わない。<br>×Direct Connect：自社と AWS を専用線でつなぐもの。顧客への配信ではない。<br>×Inspector：脆弱性の検査で、DDoS の防御ではない。<div class=\"mem\">配る＝CloudFront、DDoS の無料の盾＝Shield Standard、有料の強化版＝Shield Advanced。<\/div>", "trap": "TRAP 12", "src": "https://aws.amazon.com/shield/features/"}, {"s": 0, "q": "移行後、開発チームの AWS の費用が増えた。(1) 月の費用が決めた額を超えそうなときに通知を受け、(2) どのプロジェクトがいくら使ったかを請求データで分けて見たい。最も適切なものを", "o": ["AWS Trusted Advisor のすべてのチェックは無料で使えるので、それで費用が自動で減る", "AWS Pricing Calculator で、来月の費用を見積もる", "AWS Budgets でコストの予算とアラートを設定する", "リソースにコスト配分タグを付け、請求データでプロジェクトごとに分ける", "AWS CloudTrail で、誰がリソースを作ったかを調べる"], "a": [2, 3], "e": "<b>正解：Budgets のアラート＋コスト配分タグ<\/b>。合図は「超えそうなとき通知」と「プロジェクトごとに分ける」。<br>×Pricing Calculator：使う前の見積もりの道具。今の費用の見張りや分類はできない。<br>×CloudTrail：操作の記録で、費用の分類ではない。<br>×Trusted Advisor：すべてのチェックが使えるのは上位のサポートプランだけで、「すべて無料」は誤り。点検しても費用が自動で減るわけでもない。<div class=\"mem\">事前＝Pricing Calculator、見張り＝Budgets、振り返り＝Cost Explorer、仕分け＝タグ。<\/div>", "trap": "TRAP 09", "src": "https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html"}, {"s": 0, "q": "金融系の会社が、止められない本番システムを AWS に移す。名前の決まった担当者（テクニカルアカウントマネージャー、TAM）と、本番の重大な障害に15分以内の応答が必要である。この条件を満たすサポートプランのうち、最も費用を抑えられるものはどれか。", "o": ["AWS Business Support+", "AWS Unified Operations", "Basic Support", "AWS Enterprise Support"], "a": [3], "e": "<b>正解：Enterprise Support<\/b>。合図は「TAM」「15分以内」「最も費用を抑えて」。Enterprise Support には指名された TAM と、本番の重大な障害への最大15分の応答がある（最低 月 5,000 USD）。<br> ration Evaluator", "AWS Cost Explorer"], "a": [2], "e": "<b>正解：Migration Evaluator<\/b>。合図は「移す前に」「コストの試算」「ビジネスケース」。オンプレミスの実際の使用状況から AWS の費用を見積もる。<br>×Application Migration Service：実際にサーバーを移す（リホスト）道具。試算ではない。<br>×DMS：DB を移す道具。<br>×Cost Explorer：すでに AWS で使った費用の分析。まだ AWS にないものは見えない。<div class=\"mem\">移す前の値段＝Migration Evaluator、実際に移す＝Application Migration Service。<\/div>", "trap": "TRAP 09", "src": "https://aws.amazon.com/migration-evaluator/"}, {"s": 0, "q": "工場では、生産ラインの機械のデータを、工場の中で非常に低い遅延で処理する必要がある。同時に、AWS と同じ API、道具、サービスを使って開発と運用をそろえたい。最も適切なものはどれか。", "o": ["AWS Storage Gateway", "AWS Direct Connect", "Amazon Lightsail", "AWS Outposts"], "a": [3], "e": "<b>正解：AWS Outposts<\/b>。合図は「自社の場所で低遅延」と「AWS と同じ API・道具」。AWS が管理する機器を自社の施設に置く。<br>×Direct Connect：専用線で AWS とつなぐだけで、処理は AWS のリージョンで行われる。<br>×Storage Gateway：オンプレミスから AWS のストレージを使うためのもの。<br>×Lightsail：かんたんな仮想サーバーで、リージョンで動く。<div class=\"mem\">AWS を自社に持ってくる＝Outposts（ハイブリッド）。<\/div>", "trap": "", "src": "https://aws.amazon.com/outposts/"}, {"s": 0, "q": "会社は、オンプレミスの重要なサーバーを AWS に継続的に複製しておき、データセンターが災害にあったときは、数分で AWS 上で立ち上げて業務を続けたい。最も適切なものはどれか。", "o": ["Amazon S3 Glacier Deep Archive", "AWS Elastic Disaster Recovery", "AWS Config", "AWS Backup"], "a": [1], "e": "<b>正解：AWS Elastic Disaster Recovery<\/b>。合図は「継続的に複製」「災害時に数分で立ち上げ」。<br>×AWS Backup：決まった予定でバックアップを取り、保持を一元管理する。災害時にすぐ切り替える仕組みではない。<br>×Glacier Deep Archive：最も安い長期保管だが、取り出しに時間がかかる。<br>×Config：設定の記録と評価。<div class=\"mem\">止まったら別の場所ですぐ起動＝Elastic Disaster Recovery、定期的な保管＝Backup。<\/div>", "trap": "TRAP 04", "src": "https://aws.amazon.com/disaster-recovery/"}, {"s": 0, "q": "会社は、Web アプリを AWS に移すときに高可用性を確保したい。高可用性のための設計として当てはまらないものはどれか。", "o": ["複数の AZ に EC2 インスタンスを置き、Elastic Load Balancing で振り分ける", "Amazon RDS をマルチ AZ 配置にする", "AWS のデータセンターは障害が起きないので、性能の高い大きなインスタンスを1つの AZ に1台だけ置く", "Auto Scaling で、異常なインスタンスを自動で置き換える"], "a": [2], "e": "<b>正解（当てはまらない）：1つの AZ に大きなインスタンスを1台<\/b>。単一障害点になる。「障害が起きない」も言い切りの誤り。<br>×複数 AZ ＋ ELB：高可用性の基本。<br>×RDS マルチ AZ：別の AZ に待機の DB を持ち、障害時に自動で切り替える。<br>×A /* ---------- 略語に正式名を添える（用語集 GLOSS をもとに、ブロックごとに最初の1回だけ） ---------- */
let ABBR=null;
function abbrMap(){
  if(ABBR)return ABBR;
  const m=new Map();
  GLOSS.forEach(g=>{const k=g[0],f=g[1];if(/^[A-Za-z][A-Za-z0-9\/ .&-]*$/.test(k)&&f&&!m.has(k))m.set(k,f.replace(/（([^）]*)）/g,'、$1'))});
  const keys=[...m.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'));
  ABBR={m,re:new RegExp('(^|[^A-Za-z0-9])('+keys.join('|')+')(?![A-Za-z0-9])','g')};
  return ABBR;
}
function annot(root){
  if(!root)return;
  const {m,re}=abbrMap();const whole=root.textContent;const seen=new Set();
  // 正式名がすでに書いてある略語は、添えない
  m.forEach((f,k)=>{if(whole.includes(f))seen.add(k)});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('summary,a,code,button,.ab')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach((n,ni)=>{
    const t=n.nodeValue;const nx=nodes[ni+1]?nodes[ni+1].nodeValue.trimStart()[0]:'';let out='',last=0,hit=false;re.lastIndex=0;let x;
    while((x=re.exec(t))){
      const k=x[2],st=x.index+x[1].length,en=st+k.length;
      const after=en<t.length?t[en]:nx;
      if(seen.has(k)||after==='（'||after==='('){continue}
      seen.add(k);hit=true;
      out+=esc(t.slice(last,en))+`<span class="ab">（${esc(m.get(k))}）</span>`;last=en;
    }
    if(!hit)return;
    out+=esc(t.slice(last));
    const sp=document.createElement('span');sp.innerHTML=out;n.replaceWith(sp);
  });
}

    $('#plist').innerHTML=PGROUPS.filter(G=>L.some(p=>p.g===G[0])).map(G=>`<h3>${G[1]}</h3><div class="grid">${L.filter(p=>p.g===G[0]).map(p=>`<div class="pc">${p.k?'<span class="star">★</span> ':''}<b>${esc(p.n)}</b>${p.f?`<div class="f">${esc(p.f)}</div>`:''}<div>${esc(p.d)}</div>${p.v?`<div class="v">違い：${esc(p.v)}</div>`:''}</div>`).join('')}</div>`).join('');
  };
  ['pq','pg','pk'].forEach(i=>$('#'+i).addEventListener('input',draw));draw();
}
