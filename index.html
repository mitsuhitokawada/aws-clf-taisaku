/* =========================================================
   クイズ
   ========================================================= */
const QZ={st:null,timer:null};
// 根拠にした公式ページへのリンク（https の URL だけ出す）
function srcLink(q){return q.src&&/^https:\/\//.test(q.src)?`<div class="small" style="margin-top:6px">根拠（公式）：<a href="${esc(q.src)}" target="_blank" rel="noopener">${esc(q.src.replace(/^https:\/\//,'').slice(0,70))}</a></div>`:''}
const byId=id=>QS.find(q=>q.id===id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function marked(){const f=load(K.flag,[]);return QS.filter(q=>q.nw||f.includes(q.id))}
// 配点に合わせて、ドメインから問題を選ぶ
function weighted(n){
  const out=[];const pool={};[1,2,3,4].forEach(s=>pool[s]=shuffle(QS.filter(q=>q.s===s)));
  const fin=shuffle(QS.filter(q=>q.s===0));
  [1,2,3,4].forEach(s=>{const k=Math.round(n*SECTIONS[s].w/100);out.push(...pool[s].slice(0,k))});
  let rest=shuffle([...fin,...Object.values(pool).flat().filter(q=>!out.includes(q))]);
  while(out.length<n&&rest.length)out.push(rest.shift());
  return shuffle(out.slice(0,n));
}

function renderQuizMenu(){
  clearInterval(QZ.timer);
  const res=load(K.resume,null);const wrong=load(K.wrong,[]).filter(byId);const mk=marked();
  const c=s=>QS.filter(q=>q.s===s).length;
  $('#tab-quiz').innerHTML=`<h2>クイズ・模試</h2>
${res?`<div class="warn">途中のクイズがあります（${esc(res.m)}、${res.i}/${res.list.length} 問まで）。<div class="row" style="margin:6px 0 0"><button class="pri" id="rs">続きから再開</button><button id="rsx">破棄する</button></div></div>`:''}
<div class="row"><label><input type="checkbox" id="ten"> 10問だけ出す（ランダム）</label></div>
<div class="mbtn">
${[1,2,3,4].map(s=>`<button data-m="s${s}">${pill(s)}${SECTIONS[s].name.replace(/^ドメイン\d：/,'')}<small>${c(s)} 問</small></button>`).join('')}
<button data-m="s0">${pill(0)}総仕上げ<small>ドメイン横断 ${c(0)} 問</small></button>
<button data-m="mock">総合模試（20問）<small>配点に合わせて出題</small></button>
<button data-m="real">本番形式（65問・90分）<small>時間制限つき。解説は最後にまとめて</small></button>
<button data-m="wrong" ${wrong.length?'':'disabled'}>間違えた問題だけ<small>${wrong.length} 問（正解すると外れる）</small></button>
<button data-m="mark" ${mk.length?'':'disabled'}>印つき<small>${mk.length} 問（間違い・自信なし・まぐれ）</small></button>
<button data-m="all">全問<small>${QS.length} 問</small></button>
</div>
<h3>問題検索</h3>
<div class="row"><input type="search" id="qq" placeholder="問題・選択肢・解説を検索"><span class="small" id="qn"></span></div><div id="ql"></div>`;
  $('#tab-quiz').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.m));
  if(res){$('#rs').onclick=()=>{QZ.st=res;resumeTimer();renderQ()};$('#rsx').onclick=()=>{save(K.resume,null);renderQuizMenu()}}
  $('#qq').oninput=()=>{const q=$('#qq').value.trim().toLowerCase();
    if(!q){$('#ql').innerHTML='';$('#qn').textContent='';return}
    const L=QS.filter(x=>(x.q+x.o.join(' ')+x.e).toLowerCase().includes(q));
    $('#qn').textContent=L.length+' 件';
    $('#ql').innerHTML=L.map(x=>`<div class="ql">${pill(x.s)}${esc(x.q)}<details style="margin-top:4px"><summary class="small">答えと解説</summary><b>正解：</b>${x.a.map(i=>esc(x.o[i])).join('／')}<div>${x.e}</div></details></div>`).join('')};
}

function startQuiz(m){
  let L,name;
  const ten=$('#ten')&&$('#ten').checked;
  if(m.startsWith('s')){const s=+m.slice(1);L=shuffle(QS.filter(q=>q.s===s));name=s?`D${s}`:'総仕上げ'}
  else if(m==='mock'){L=weighted(20);name='総合模試'}
  else if(m==='real'){L=weighted(Math.min(65,QS.length));name='本番形式'}
  else if(m==='wrong'){L=shuffle(load(K.wrong,[]).map(byId).filter(Boolean));name='間違い復習'}
  else if(m==='mark'){L=shuffle(marked());name='印つき'}
  else {L=shuffle(QS);name='全問'}
  if(ten&&m!=='real'){L=L.slice(0,10);name+='（10問）'}
  if(!L.length)return;
  QZ.st={m:name,mode:m,list:L.map(q=>q.id),i:0,ans:{},order:{},sel:[],done:false,
    end:m==='real'?Date.now()+90*60000:null};
  L.forEach(q=>QZ.st.order[q.id]=shuffle(q.o.map((_,i)=>i)));
  save(K.resume,QZ.st);resumeTimer();renderQ();
}
function resumeTimer(){
  clearInterval(QZ.timer);
  if(!QZ.st||!QZ.st.end)return;
  QZ.timer=setInterval(()=>{const el=$('#tm');const r=QZ.st.end-Date.now();
    if(r<=0){clearInterval(QZ.timer);finish();return}
    if(el)el.textContent=`残り ${Math.floor(r/60000)}:${String(Math.floor(r/1000)%60).padStart(2,'0')}`},1000);
}
function renderQ(){
  const st=QZ.st;if(!st)return renderQuizMenu();
  if(st.i>=st.list.length)return finish();
  const q=byId(st.list[st.i]);const ord=st.order[q.id];const multi=q.a.length>1;
  const a=st.ans[q.id];const real=st.mode==='real';const flag=load(K.flag,[]);
  const showRes=a&&!real;
  $('#tab-quiz').innerHTML=`
<div class="qhead"><span>${pill(q.s)}<b>${esc(st.m)}</b>　${st.i+1} / ${st.list.length}</span>
<span>${st.end?'<span class="timer" id="tm"></span>　':''}<button id="qx">中断してメニューへ</button></span></div>
<div class="card" style="margin-top:10px">
<div style="font-size:16px" class="qt">${esc(q.q)}${multi?`<b>（${q.a.length}つ選べ）</b>`:''}</div>
<div id="opts">${ord.map(i=>{let c='qopt';
  if(showRes){if(q.a.includes(i))c+=' ok';else if(a.sel.includes(i))c+=' ng'}
  else if((a?a.sel:st.sel).includes(i))c+=' sel';
  return `<button class="${c}" data-i="${i}" ${showRes?'disabled':''}>${esc(q.o[i])}</button>`}).join('')}</div>
${!a?`<div class="row" style="margin-top:8px"><button class="pri" id="sub" ${st.sel.length===q.a.length?'':'disabled'}>答える</button><span class="small">${multi?`${q.a.length}つ選んでから「答える」`:''}</span></div>`:''}
${showRes?`<div class="res"><div class="h ${a.ok?'ok':'ng'}">${a.ok?'正解':'不正解'}</div>${q.trap?`<div class="small">罠の型：${q.trap}（${esc((TRAPS.find(t=>t.id===q.trap)||{}).f||'')}）</div>`:''}<div class="qe">${q.e}</div>${srcLink(q)}</div>`:''}
${a?`<div class="row" style="margin-top:10px"><button class="pri" id="nx">${st.i+1<st.list.length?'次へ':'結果を見る'}</button>
<label><input type="checkbox" id="fl" ${flag.includes(q.id)?'checked':''}> 印をつける（自信なし・まぐれ）</label></div>`:''}
</div>`;
  annot(document.querySelector('#tab-quiz .qt'));annot(document.querySelector('#tab-quiz .qe'));
  $('#qx').onclick=()=>{clearInterval(QZ.timer);QZ.st=null;renderQuizMenu()};
  if(!a){
    $('#opts').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;
      if(multi){st.sel=st.sel.includes(i)?st.sel.filter(x=>x!==i):(st.sel.length<q.a.length?[...st.sel,i]:st.sel)}else st.sel=[i];
      renderQ()};
    $('#sub').onclick=()=>answer(q);
  }else{
    $('#nx').onclick=()=>{st.i++;st.sel=[];save(K.resume,st);renderQ()};
    $('#fl').onchange=e=>{let f=load(K.flag,[]);f=e.target.checked?[...new Set([...f,q.id])]:f.filter(x=>x!==q.id);save(K.flag,f)};
  }
  if(st.end){const r=st.end-Date.now();const el=$('#tm');if(el)el.textContent=`残り ${Math.floor(r/60000)}:${String(Math.floor(r/1000)%60).padStart(2,'0')}`}
}
function answer(q){
  const st=QZ.st;const sel=st.sel.slice();
  const ok=sel.length===q.a.length&&sel.every(i=>q.a.includes(i));
  st.ans[q.id]={sel,ok};
  // 答えた瞬間に、間違いを保存（間違い復習モードで正解したら外す）
  let w=load(K.wrong,[]);
  if(!ok)w=[...new Set([...w,q.id])];else if(st.mode==='wrong')w=w.filter(x=>x!==q.id);
  save(K.wrong,w);save(K.resume,st);
  if(st.mode==='real'){st.i++;st.sel=[];save(K.resume,st)}
  renderQ();
}
function finish(){
  clearInterval(QZ.timer);
  const st=QZ.st;if(!st)return renderQuizMenu();
  const ids=st.list;const n=ids.length;const c=ids.filter(id=>st.ans[id]&&st.ans[id].ok).length;
  if(!st.done){
    st.done=true;
    const per=[0,1,2,3,4].map(s=>{const L=ids.filter(id=>byId(id).s===s);return {s,n:L.length,c:L.filter(id=>st.ans[id]&&st.ans[id].ok).length}}).filter(p=>p.n);
    const h=load(K.hist,[]);const d=new Date();
    h.push({t:`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`,m:st.m,c,n,per});
    save(K.hist,h.slice(-200));save(K.resume,null);
    // 本番形式で未回答の問題は、不正解として間違いリストへ
    if(st.mode==='real'){let w=load(K.wrong,[]);ids.forEach(id=>{if(!st.ans[id])w.push(id)});save(K.wrong,[...new Set(w)])}
  }
  const ng=ids.filter(id=>!(st.ans[id]&&st.ans[id].ok));
  $('#tab-quiz').innerHTML=`<h2>結果：${esc(st.m)}</h2>
<div class="card"><div style="font-size:22px"><b>${c} / ${n}</b>（${Math.round(c/n*100)}%）</div>
<div class="small">本番の合格ライン（700点）は、目安として正答率7割強。採点は換算されるので、この数字は目安。</div>
${[0,1,2,3,4].map(s=>{const L=ids.filter(id=>byId(id).s===s);if(!L.length)return'';const k=L.filter(id=>st.ans[id]&&st.ans[id].ok).length;
return `<div style="margin:6px 0">${pill(s)}${k}/${L.length}<div class="bar"><i style="width:${k/L.length*100}%;background:var(--d${s})"></i></div></div>`}).join('')}
<div class="row" style="margin-top:10px"><button class="pri" id="bk">メニューへ</button></div></div>
<h3>復習リスト（${ng.length} 問）</h3>
${ng.map(id=>{const q=byId(id);const a=st.ans[id];return `<div class="card">${pill(q.s)}${esc(q.q)}
<div style="margin-top:6px"><b>正解：</b>${q.a.map(i=>esc(q.o[i])).join('／')}</div>
<div class="small">あなたの答え：${a?a.sel.map(i=>esc(q.o[i])).join('／'):'未回答'}</div>
<details><summary class="small">解説</summary>${q.e}${srcLink(q)}</details></div>`}).join('')||'<p>全問正解！</p>'}`;
  $('#bk').onclick=()=>{QZ.st=null;renderQuizMenu()};
  window.scrollTo(0,0);
}

/* ---------- テーマ切り替え ---------- */
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
$('#themeBtn').onclick=()=>{const cur=load(K.theme,'');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const nt=dark?'light':'dark';save(K.theme,nt);applyTheme(nt)};

/* ---------- 起動 ---------- */
applyTheme(load(K.theme,''));
buildShell();countdown();
renderRead();renderProd();renderGloss();renderTrap();renderPair();renderStumble();renderTech();
let start='map';try{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))start=h}catch(e){}
show(start);
</script>
