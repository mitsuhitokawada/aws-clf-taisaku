READ.push(...[{"s": 1, "t": "1.2 補足：一般的な設計原則と各柱の設計原則", "h": "<p>Well-Architected フレームワークには、6本の柱とは別に、全体に通じる<b>一般的な設計原則（General design principles）<\/b>が6つある。<\/p><div class=\"tw\"><table><tr><th>一般的な設計原則<\/th><th>意味<\/th><\/tr><tr><td>容量の推測をやめる（Stop guessing your capacity needs）<\/td><td>必要な分だけ使い、自動で増減する<\/td><\/tr><tr><td>本番と同じ規模でテストする（Test systems at production scale）<\/td><td>本番規模のテスト環境を必要なときだけ作り、終わったら消す。動かした時間分だけ払う<\/td><\/tr><tr><td>実験を前提に自動化する（Automate with architectural experimentation in mind）<\/td><td>低コストで作り直せる。変更を追跡し、元に戻せる<\/td><\/tr><tr><td>進化するアーキテクチャを考える（Consider evolutionary architectures）<\/td><td>最初の設計を固定せず、時間とともに変えていく<\/td><\/tr><tr><td>データで設計を決める（Drive architectures using data）<\/td><td>事実（データ）にもとづいて改善する<\/td><\/tr><tr><td>ゲームデーで改善する（Improve through game days）<\/td><td>本番の出来事を模した訓練を定期的に行う<\/td><\/tr><\/table><\/div><h3>各柱の設計原則（よく問われるもの）<\/h3><div class=\"tw\"><table><tr><th>柱<\/th><th>設計原則<\/th><\/tr><tr><td>運用上の優秀性<\/td><td>ビジネスの成果を軸にチームを組織する／実用的な洞察のために可観測性を実装する／安全に自動化する（運用をコードで定義）／<b>小さく、頻繁に、元に戻せる変更<\/b>を行う／運用手順をこまめに見直す／障害を予測する／すべての運用上のイベントから学ぶ／マネージドサービスを使う<\/td><\/tr><tr><td>セキュリティ<\/td><td>強固なアイデンティティ基盤（最小権限、職務の分離、長期の静的な認証情報に頼らない）／<b>トレーサビリティ<\/b>（リアルタイムに監視・アラート・監査）／<b>すべての層<\/b>にセキュリティを適用（多層防御）／セキュリティのベストプラクティスを自動化／転送中と保存中のデータを保護／<b>人をデータから遠ざける<\/b>／セキュリティイベントに備える<\/td><\/tr><tr><td>信頼性<\/td><td>障害から自動で回復する／<b>復旧手順をテストする<\/b>／<b>水平方向にスケール<\/b>して全体の可用性を上げる（大きい1台を小さい複数台に）／容量の推測をやめる／変更を自動化で管理する<\/td><\/tr><tr><td>パフォーマンス効率<\/td><td><b>高度なテクノロジーの民主化<\/b>（NoSQL、機械学習などをサービスとして使う）／数分でグローバルに展開／サーバーレスを使う／より頻繁に実験する／メカニカルシンパシー（データのアクセスパターンに合う技術を選ぶ）<\/td><\/tr><tr><td>コスト最適化<\/td><td>クラウド財務管理を実装する／<b>消費モデルを採用する<\/b>（開発・テスト環境は使う時間だけ動かす）／全体的な効率を測定する／<b>差別化につながらない重労働にお金を使わない<\/b>（ラック・電源・OS 管理は AWS とマネージドサービスに任せる）／支出を分析して帰属させる（誰が使ったかを明らかに）<\/td><\/tr><tr><td>持続可能性<\/td><td>影響を理解する／持続可能性の目標を決める／<b>使用率を最大化する<\/b>／新しい効率のよいハードウェアとソフトウェアを取り入れる／マネージドサービスを使う／利用者側（下流）の影響を減らす<\/td><\/tr><\/table><\/div><div class=\"warn\">引っかけ注意：「マネージドサービスを使う」は運用上の優秀性と持続可能性の両方に出てくる。合図が「運用の負担」なら運用上の優秀性、「エネルギー・資源の共有」なら持続可能性。コストの柱では「差別化につながらない重労働」という言い方になる。<\/div><div class=\"mem\">柱を当てるコツ：消費・帰属・重労働＝コスト。水平・復旧テスト＝信頼性。民主化・メカニカルシンパシー＝パフォーマンス。トレーサビリティ・人をデータから遠ざける＝セキュリティ。小さく元に戻せる変更＝運用。使用率最大化＝持続可能性。<\/div>"}, {"s": 1, "t": "1.3 補足：AWS CAF の変革ドメイン・能力・4つのフェーズ", "h": "<p>AWS CAF は「基盤となる能力（capability）」が「変革」を支え、変革が「ビジネスの成果」を生む、という流れで説明される。<\/p><h3>4つの変革ドメイン（Transformation domains）<\/h3><div class=\"tw\"><table><tr><th>ドメイン<\/th><th>中身<\/th><\/tr><tr><td>テクノロジー（Technology）<\/td><td>古いインフラ・アプリ・データ基盤を移行してモダナイズする<\/td><\/tr><tr><td>プロセス（Process）<\/td><td>業務をデジタル化・自動化・最適化する（データ分析や機械学習の活用）<\/td><\/tr><tr><td>組織（Organization）<\/td><td>運営モデルを作り直す。製品と価値の流れに沿ってチームを組む<\/td><\/tr><tr><td>製品（Product）<\/td><td>ビジネスモデルを作り直す。新しい価値提案（製品・サービス）と収益モデル<\/td><\/tr><\/table><\/div><p>テクノロジーの変革がプロセスの変革を支え、それが組織、製品の変革を支える（価値の連鎖）。<\/p><p><b>主なビジネス成果<\/b>：ビジネスリスクの低減、ESG（環境・社会・ガバナンス）パフォーマンスの向上、収益の増加、運用効率の向上。<\/p><h3>6つの観点と能力の例<\/h3><div class=\"tw\"><table><tr><th>観点<\/th><th>能力（capability）の例<\/th><\/tr><tr><td>ビジネス<\/td><td>戦略管理、ポートフォリオ管理、イノベーション管理、製品管理、データの収益化<\/td><\/tr><tr><td>人材<\/td><td>文化の進化、変革型リーダーシップ、クラウドの習熟（研修）、組織設計<\/td><\/tr><tr><td>ガバナンス<\/td><td>プログラムとプロジェクト管理、ベネフィット管理、リスク管理、<b>クラウド財務管理<\/b>、データガバナンス<\/td><\/tr><tr><td>プラットフォーム<\/td><td>プラットフォームアーキテクチャ、データアーキテクチャ、モダンなアプリ開発、CI/CD<\/td><\/tr><tr><td>セキュリティ<\/td><td>アイデンティティとアクセス管理、脅威検出、脆弱性管理、データ保護、インシデント対応<\/td><\/tr><tr><td>運用<\/td><td>可観測性、イベント管理（AIOps）、インシデントと問題の管理、パッチ管理、可用性と継続性の管理<\/td><\/tr><\/table><\/div><h3>4つのフェーズ（繰り返し、少しずつ進める）<\/h3><div class=\"tw\"><table><tr><th>フェーズ<\/th><th>やること<\/th><th>合図<\/th><\/tr><tr><td>構想（Envision）<\/td><td>クラウドでどうビジネスの成果を早めるかを示す。変革の機会を見つけて優先順位をつける<\/td><td>機会の特定、関係者と測定できる成果をひも付ける<\/td><\/tr><tr><td>調整（Align）<\/td><td>6つの観点で能力のギャップを洗い出す。組織をまたぐ依存関係、関係者の懸念を明らかにする<\/td><td>ギャップ、依存関係、懸念、準備状況<\/td><\/tr><tr><td>立ち上げ（Launch）<\/td><td>パイロットを本番で動かし、少しずつビジネス価値を示す<\/td><td>パイロット、本番、段階的な価値<\/td><\/tr><tr><td>拡大（Scale）<\/td><td>パイロットを望む規模に広げ、得られた効果を持続させる<\/td><td>全社に拡大、効果を持続<\/td><\/tr><\/table><\/div><div class=\"mem\">エ・ア・ラ・ス（Envision、Align、Launch、Scale）。描く → そろえる → 試す → 広げる。<\/div><div class=\"warn\">引っかけ注意：CFO（最高財務責任者）はビジネス観点の関係者にも出てくるが、「クラウドの支出を計画・測定・最適化する」能力はガバナンス観点のクラウド財務管理。<\/div>"}, {"s": 1, "t": "1.3 補足：7R の使い分けと移行の支援（MAP）", "h": "<div class=\"tw\"><table><tr><th>戦略<\/th><th>典型的な理由（AWS Prescriptive Guidance より）<\/th><\/tr><tr><td>リタイア（Retire）<\/td><td>ビジネス価値がない。CPU とメモリの平均使用率が5％未満（ゾンビアプリ）。90日間、受信の接続がない。サポート切れ OS のリスクをなくしたい<\/td><\/tr><tr><td>リテイン（Retain）<\/td><td>データの所在地の要件。リスクが高く詳しい評価が必要。他のアプリを先に移す必要がある（依存関係）。最近アップグレードしたばかり。ベンダーの SaaS 版を待っている。クラウドにない専用ハードウェアに依存<\/td><\/tr><tr><td>リホスト（Rehost）<\/td><td>リフト＆シフト。変更せずに移す。移行中も利用者へのサービスは続く<\/td><\/tr><tr><td>リロケート（Relocate）<\/td><td>オンプレミスの基盤をクラウド版の同じ基盤へ大量のサーバーごと移す。新しいハードウェアの購入、アプリの書き直し、運用の変更が不要。最も速い方法<\/td><\/tr><tr><td>リパーチェス（Repurchase）<\/td><td>ドロップ＆ショップ。従来のライセンス製品や独自アプリを SaaS などに置き換える<\/td><\/tr><tr><td>リプラットフォーム（Replatform）<\/td><td>リフト・ティンカー＆シフト。マネージドやサーバーレスへ、少し最適化して移す<\/td><\/tr><tr><td>リファクタ（Refactor／Re-architect）<\/td><td>クラウドネイティブに作り直す。最も複雑でコストがかかる<\/td><\/tr><\/table><\/div><div class=\"warn\">引っかけ注意：<b>大規模な移行<\/b>では、リファクタは推奨されない。まずリホスト・リロケート・リプラットフォームで移し、移行が終わってからモダナイズする。<\/div><h3>AWS Migration Acceleration Program（MAP）<\/h3><p>多くの企業の移行経験にもとづく移行プログラム。ツール、トレーニング、AWS Professional Services とパートナーの専門知識、初期の移行コストを相殺する資金面の支援を組み合わせる。進め方は<b>評価（Assess）→ 準備（Mobilize）→ 移行とモダナイズ（Migrate and Modernize）<\/b>。評価では AWS CAF の観点でギャップを洗い出し、TCO を見積もる。<\/p><div class=\"mem\">MAP は「サービス」ではなく「プログラム（支援の枠組み）」。進み具合を追跡する道具の AWS Migration Hub と混同しない。<\/div>"}, {"s": 1, "t": "1.4 補足：ライセンスの選び方とデプロイモデル", "h": "<div class=\"tw\"><table><tr><th><\/th><th>ライセンス込み（License Included）<\/th><th>BYOL（Bring Your Own License）<\/th><\/tr><tr><td>ライセンスを用意するのは<\/td><td>AWS（EC2 や RDS の料金に含まれる）<\/td><td>お客様（手持ちのライセンスを使う）<\/td><\/tr><tr><td>向いている場合<\/td><td>手持ちのライセンスがない。前払いや長期の約束をしたくない<\/td><td>すでに買ったライセンスを活かしてコストを下げたい<\/td><\/tr><tr><td>関連<\/td><td>従量課金で使える<\/td><td>ライセンスの条件によっては Amazon EC2 Dedicated Hosts が必要。AWS License Manager で使用量を追跡<\/td><\/tr><\/table><\/div><p><b>AWS License Manager<\/b>：Microsoft、Oracle、SAP などのライセンスを、複数のリージョンとアカウントにわたって管理する。ルールで上限（ハード／ソフト）を決め、ライセンスの超過と違反を防ぐ。AWS Systems Manager と組み合わせるとオンプレミスのサーバーも対象にできる。<\/p><h3>デプロイモデル<\/h3><div class=\"tw\"><table><tr><th>モデル<\/th><th>意味<\/th><\/tr><tr><td>クラウド<\/td><td>アプリのすべての部分がクラウドで動く<\/td><\/tr><tr><td>ハイブリッド<\/td><td>クラウドと、クラウドにない既存の資源（主にオンプレミス）をつなぐ。オンプレミスを拡張して育てる<\/td><\/tr><tr><td>オンプレミス（プライベートクラウド）<\/td><td>自社で仮想化と管理ツールを使う。専用の資源が得られるが、クラウドの利点の多くは得られない<\/td><\/tr><\/table><\/div><h3>マネージドサービスで運用コストが下がる理由<\/h3><p>ラックへの設置、電源、OS とアプリの管理といった「差別化につながらない重労働」を AWS が引き受けるため、お客様は自社の顧客とビジネスに集中できる（コスト最適化の設計原則）。<\/p><div class=\"warn\">引っかけ注意：マネージドサービスでも、データ、アクセス権限、暗号化の設定などはお客様の責任のまま。「運用がすべて不要」は言い切りで×。<\/div>"}, {"s": 2, "t": "2.1 補足：責任共有モデルの具体例（継承・共有・お客様固有）", "h": "<p>AWS の責任共有モデルのページでは、コントロール（統制）を3つに分けている。<\/p><div class=\"tw\"><table><tr><th>種類<\/th><th>意味<\/th><th>公式の例<\/th><\/tr><tr><td><b>継承されるコントロール<\/b>（Inherited）<\/td><td>お客様が AWS から丸ごと引き継ぐもの<\/td><td>物理的・環境的なコントロール（データセンターの建物、電源、空調など）<\/td><\/tr><tr><td><b>共有コントロール<\/b>（Shared）<\/td><td>同じテーマを、AWS とお客様が<b>それぞれの範囲で<\/b>担う<\/td><td>パッチ管理（AWS は基盤、お客様はゲスト OS とアプリ）／設定管理（AWS は基盤の機器、お客様はゲスト OS・DB・アプリ）／意識向上とトレーニング（AWS は AWS の社員、お客様は自社の社員）<\/td><\/tr><tr><td><b>お客様固有のコントロール<\/b>（Customer Specific）<\/td><td>お客様だけが担う<\/td><td>特定のセキュリティ環境の中でデータをどこに置き、どう通すか（ゾーンのセキュリティ）<\/td><\/tr><\/table><\/div><p>サービスごとの分担（公式の説明と各サービスのセキュリティの章から）：<\/p><div class=\"tw\"><table><tr><th>サービス<\/th><th>AWS<\/th><th>お客様<\/th><\/tr><tr><td>Amazon EC2（IaaS）<\/td><td>ホスト、仮想化の層、物理<\/td><td>ゲスト OS の更新とパッチ、入れたアプリやツール、<b>インスタンスごとのセキュリティグループ（ファイアウォール）の設定<\/b><\/td><\/tr><tr><td>Amazon RDS<\/td><td>基盤、DB の運用（バックアップの作成やリードレプリカへの複製などの処理）<\/td><td>IAM で誰が DB インスタンスを作成・変更できるか、セキュリティグループでどこから接続を許すか、保存時の暗号化や SSL/TLS を使うか、DB の中のユーザー<\/td><\/tr><tr><td>AWS Lambda<\/td><td>マネージドランタイムのパッチを公開し、自動更新モードなら関数に適用<\/td><td>コード、権限、データ。<b>コンテナイメージで動かす場合は、最新のベースイメージから作り直して再デプロイするのはお客様<\/b><\/td><\/tr><tr><td>Amazon S3、Amazon DynamoDB（抽象化されたサービス）<\/td><td>インフラ、OS、プラットフォーム<\/td><td>データの管理（暗号化の選択を含む）、資産の分類、IAM で適切な権限を付けること<\/td><\/tr><\/table><\/div><div class=\"warn\">引っかけ注意：「物理的・環境的コントロール」は共有ではなく<b>継承<\/b>。「意識向上とトレーニング」は AWS だけの責任ではなく<b>共有<\/b>（自社の社員の教育はお客様）。<\/div><div class=\"mem\">継承＝建物ごと借りる、共有＝同じ仕事を2人で分ける、固有＝自分だけの仕事。<\/div>"}, {"s": 2, "t": "2.3 補足：ルートユーザーにしかできない作業", "h": "<p>IAM ユーザーガイドの公式の一覧（Tasks that require root user credentials）から、試験に出やすいもの：<\/p><ul><li>アカウント設定の変更（AWS Organizations に入っていない単独のアカウントの場合）：<b>ルートユーザーのメールアドレス、パスワード、ルートのアクセスキー<\/b>の変更<\/li><li>AWS アカウントの<b>閉鎖<\/b>（単独のアカウントの場合）、閉鎖後の期間中の<b>再開<\/b><\/li><li><b>IAM のアクセス許可の復元<\/b>：唯一の IAM 管理者が自分の権限を誤って外してしまったとき<\/li><li><b>請求情報とコスト管理のコンソールへの IAM アクセスを有効にする<\/b>、一部の請求の作業、一部の税の請求書の表示<\/li><li>リザーブドインスタンスマーケットプレイスに<b>販売者として登録<\/b><\/li><li>S3 バケットで <b>MFA Delete<\/b>（MFA による削除）を有効にする設定<\/li><li>すべてのプリンシパルを拒否してしまった<b>S3 バケットポリシー<\/b>や <b>SQS キューのポリシー<\/b>の編集・削除<\/li><li>AWS GovCloud (US) への申し込み<\/li><\/ul><div class=\"warn\">引っかけ注意：<b>アカウント名、連絡先情報、代替連絡先、支払い通貨の設定、リージョンの有効化<\/b>は、ルートユーザーでなくてもできる（公式に明記）。「IAM ユーザーの作成」「EC2 の起動」も権限があれば IAM でできる。<\/div><p>AWS Organizations を使う場合：管理アカウント（または IAM の委任管理者）から、メンバーアカウントのルートユーザーの認証情報を<b>一元的に削除<\/b>できる。新しく作ったメンバーアカウントには、初めからルートの認証情報がない。メンバーアカウントの閉鎖も管理アカウントからできる。<\/p><div class=\"mem\">ルートだけ＝「鍵そのもの（メール・パスワード・ルートのキー）」「店じまいと再開」「締め出しからの救出（IAM の権限、S3・SQS の全拒否ポリシー）」「お金の入口（請求コンソールへの IAM アクセス）」。<\/div>"}, {"s": 2, "t": "2.3 補足：ポリシーの種類と、権限を点検する道具", "h": "<div class=\"tw\"><table><tr><th>ポリシー<\/th><th>誰が作る・管理する<\/th><th>付け先<\/th><th>ポイント<\/th><\/tr><tr><td>AWS 管理ポリシー<\/td><td>AWS<\/td><td>多くのユーザー・グループ・ロール<\/td><td>お客様は中身を変更できない。新しいサービスが出ると AWS が更新することがある。全員向けなので最小権限とは限らない<\/td><\/tr><tr><td>カスタマー管理ポリシー<\/td><td>お客様<\/td><td>多くのユーザー・グループ・ロール<\/td><td>自分の用途に合わせて作り、何度でも直せる。直すと付けた全員に反映<\/td><\/tr><tr><td>インラインポリシー<\/td><td>お客様<\/td><td>1つのユーザー・グループ・ロールだけ（1対1）<\/td><td>その ID を削除するとポリシーも消える。複数に使うなら管理ポリシーのほうがよい<\/td><\/tr><tr><td>リソースベースのポリシー<\/td><td>お客様<\/td><td>リソース（S3 バケットポリシー、SQS キュー、KMS キーなど）<\/td><td>「誰が」このリソースに何をできるかを書く。インラインのみ<\/td><\/tr><tr><td>SCP（サービスコントロールポリシー）<\/td><td>Organizations の管理者<\/td><td>組織のルート、OU、アカウント<\/td><td>権限の<b>上限<\/b>を決めるだけで、権限を与えない。管理アカウントには効かない。メンバーアカウントのルートユーザーには効く<\/td><\/tr><\/table><\/div><p>ID ベースのポリシー（ユーザー・グループ・ロールに付ける）は AWS 管理・カスタマー管理・インラインの3種類。リソースベースのポリシーはリソースに付ける。<\/p><div class=\"tw\"><table><tr><th>知りたいこと<\/th><th>道具<\/th><\/tr><tr><td>全 IAM ユーザーのパスワード・アクセスキー・MFA の状態の一覧（CSV、4時間に1回まで作成）<\/td><td><b>認証情報レポート<\/b>（credential report）<\/td><\/tr><tr><td>ユーザー・グループ・ロール・ポリシーが、許可されたサービスを最後にいつ使ったか（使っていない権限を見つける）<\/td><td><b>最終アクセス情報<\/b>（last accessed information）<\/td><\/tr><tr><td>外部のアカウントや一般公開に共有されている S3 バケットや IAM ロールなどを見つける<\/td><td><b>IAM Access Analyzer<\/b>（外部アクセスの分析）<\/td><\/tr><tr><td>CloudTrail の記録から、実際に使った操作だけのポリシーを作る<\/td><td><b>IAM Access Analyzer<\/b>（ポリシーの生成）<\/td><\/tr><tr><td>ポリシーの文法やベストプラクティスの点検<\/td><td><b>IAM Access Analyzer<\/b>（ポリシーの検証）<\/td><\/tr><\/table><\/div><div class=\"warn\">引っかけ注意：IAM Access Analyzer の「未使用のアクセスの分析」「内部アクセスの分析」「カスタムポリシーチェック」は有料。認証情報レポートは「人の認証情報の状態」、最終アクセス情報は「権限の使われ方」。<\/div>"}, {"s": 2, "t": "2.3 補足：MFA・パスワードポリシー・一時的な認証情報・秘密の保管", "h": "<ul><li><b>MFA の種類<\/b>：パスキーとセキュリティキー（FIDO 準拠。フィッシングに強く、AWS が最も推奨）、仮想認証アプリ（TOTP、スマホのアプリ）、ハードウェア TOTP トークン。<b>SMS による MFA は、新しく有効にすることはもうできない<\/b>。ルートユーザーと IAM ユーザーは、どの種類でも<b>最大8台<\/b>まで登録でき、サインインには1台あればよい（なくしたときの予備になる）。<\/li><li><b>パスワードポリシー<\/b>：IAM ユーザーのパスワードの条件（最小の長さ、文字の種類、有効期限、再利用の禁止、自分で変更できるか）。<b>ルートユーザーのパスワードとアクセスキーには適用されない<\/b>。一定回数失敗で締め出す「ロックアウト」は作れない。既定のポリシーは8文字以上・3種類以上の文字・期限なし。<\/li><li><b>アクセスキー<\/b>：プログラムから使う長期の認証情報。可能なら使わず一時的な認証情報にする。どうしても必要なら（ロールを使えない外部のツールなど）必要なときに更新し、最終使用の情報を見て不要なキーを消す。ユーザーごとに2つまで持てるのは、ローテーションのため。<\/li><li><b>一時的な認証情報（AWS STS：AWS Security Token Service）<\/b>：数分から数時間で期限が切れる。ユーザーと一緒に保存されず、求められたときに作られる。アプリに長期の認証情報を埋め込まなくてよく、期限が来れば自動で使えなくなる。ロール、フェデレーション、クロスアカウントの基礎。<\/li><li><b>フェデレーション<\/b>：ID を AWS の外（社内の IdP など）で管理し、AWS には一時的な認証情報で入る。社員なら AWS IAM Identity Center（外部の IdP をつなぐか、Identity Center の中でユーザーを作る）。<\/li><li><b>秘密の保管<\/b>：DB の認証情報・API キー・OAuth トークンなどは <b>AWS Secrets Manager<\/b>（自動ローテーション、シークレットごと・API 呼び出しごとに課金）。AMI ID、エンドポイントの URL などの設定値は <b>AWS Systems Manager Parameter Store<\/b>（標準の階層は追加料金なし、ローテーションの機能はなし。SecureString なら KMS で暗号化）。<\/li><li><b>Amazon Cognito<\/b>：ユーザープール＝アプリの利用者の名簿とサインイン（認証、トークンを発行）。ID プール＝トークンを、権限を絞った<b>一時的な AWS の認証情報<\/b>に交換（ゲストにも発行できる）。<\/li><\/ul><div class=\"mem\">Secrets Manager＝金庫（自動で鍵を替える、有料）。Parameter Store＝設定の棚（無料の階層あり、替えるのは自分）。Cognito のユーザープール＝「あなたは誰」、ID プール＝「AWS で何ができる」。<\/div>"}, {"s": 2, "t": "2.2 補足：セキュリティサービスの使い分け（見つける・まとめる・調べる・防ぐ）", "h": "<div class=\"tw\"><table><tr><th>動詞<\/th><th>サービス<\/th><th>何を見るか<\/th><th>合図の言葉<\/th><\/tr><tr><td>脅威を見つける<\/td><td><b>Amazon GuardDuty<\/b><\/td><td>CloudTrail の管理イベント、VPC フローログ、DNS ログ（自分で有効にしなくてよい）<\/td><td>不審な API 呼び出し、悪意のある IP、暗号通貨の採掘<\/td><\/tr><tr><td>弱点を見つける<\/td><td><b>Amazon Inspector<\/b><\/td><td>EC2、ECR のコンテナイメージ、Lambda 関数の CVE とネットワーク到達性<\/td><td>既知の脆弱性、パッチ、自動スキャン<\/td><\/tr><tr><td>機密データを見つける<\/td><td><b>Amazon Macie<\/b><\/td><td>S3 のオブジェクトの中身、バケットの公開・暗号化<\/td><td>個人情報、クレジットカード番号、S3<\/td><\/tr><tr><td>まとめる<\/td><td><b>AWS Security Hub<\/b><\/td><td>GuardDuty・Inspector・Macie などの結果を集約、ベストプラクティスの自動チェック（AWS Foundational Security Best Practices、CIS、PCI DSS など）<\/td><td>一か所で、優先度、点数<\/td><\/tr><tr><td>調べる<\/td><td><b>Amazon Detective<\/b><\/td><td>CloudTrail、VPC フローログ、GuardDuty の結果から行動グラフ（最大1年分）<\/td><td>根本原因、調査、関係を図で<\/td><\/tr><tr><td>Web 攻撃を防ぐ<\/td><td><b>AWS WAF<\/b>（Web Application Firewall）<\/td><td>HTTP(S) リクエスト（第7層）。CloudFront、ALB、API Gateway などに付ける<\/td><td>SQL インジェクション、XSS、IP 制限、レート制限。ルールを一から作れない → <b>マネージドルールグループ<\/b>（AWS Managed Rules など）を Web ACL に追加<\/td><\/tr><tr><td>DDoS を防ぐ<\/td><td><b>AWS Shield<\/b><\/td><td>Standard は全員に自動・追加料金なし（第3・4層）。Advanced は有料で第7層の検出も、24時間の Shield Response Team、コスト保護<\/td><td>DDoS、大量のトラフィック<\/td><\/tr><tr><td>方針を一括で配る<\/td><td><b>AWS Firewall Manager<\/b><\/td><td>WAF、Shield Advanced、セキュリティグループ、Network Firewall などの方針を組織全体へ<\/td><td>多数のアカウント、新しいアカウントにも自動で<\/td><\/tr><\/table><\/div><div class=\"mem\">GuardDuty が「見つける」→ Security Hub が「まとめる」→ Detective が「調べる」。弱点は Inspector（検査官）、S3 の中身は Macie。<\/div><div class=\"warn\">引っかけ注意：GuardDuty は検出して報告するだけ。自動で止めたいなら EventBridge と Lambda などを組み合わせる。「常に自動で停止する」は×。<\/div>"}, {"s": 2, "t": "2.2 補足：記録と監査（CloudTrail・Config・CloudWatch）の細かいところ", "h": "<ul><li><b>CloudTrail のイベント履歴<\/b>：リージョンごとに<b>過去90日の管理イベント<\/b>を見られる。それより長く残すなら<b>証跡（トレイル）<\/b>で S3 バケットへ（CloudWatch Logs にも送れる）。<\/li><li><b>管理イベント<\/b>（コントロールプレーン）：IAM ポリシーの付け替え、サブネットの作成、コンソールへのサインインなど。証跡は既定で記録する。<\/li><li><b>データイベント<\/b>（データプレーン）：S3 の GetObject・PutObject、DynamoDB の項目の操作など。量が多いので<b>既定では記録しない<\/b>。必要なものを自分で有効にする。<\/li><li>コンソールで作る証跡は<b>マルチリージョン<\/b>（有効なすべてのリージョンの操作を1つの S3 バケットへ）。<\/li><li><b>AWS Config<\/b>：設定の履歴を記録し、<b>Config ルール<\/b>（理想の設定）に合っているかを評価する。AWS が用意した<b>マネージドルール<\/b>と、自分で作る<b>カスタムルール<\/b>がある。<\/li><li><b>コンフォーマンスパック<\/b>：Config ルールと修復アクションの集まりを、1つの単位としてアカウントや組織全体に展開する。<\/li><li><b>Amazon CloudWatch<\/b>：メトリクス（数値）、アラーム（しきい値で通知・自動アクション）、ダッシュボード、CloudWatch Logs（ログを集めて検索）。<\/li><li><b>IAM の認証情報レポート<\/b>：全 IAM ユーザーのパスワード・アクセスキー・MFA の状態を CSV で。監査に使う。<\/li><\/ul><div class=\"tw\"><table><tr><th>質問<\/th><th>答え<\/th><\/tr><tr><td>誰がやった？<\/td><td>CloudTrail<\/td><\/tr><tr><td>設定は何だった？ルールに合ってる？<\/td><td>Config<\/td><\/tr><tr><td>どのくらい？しきい値を超えた？<\/td><td>CloudWatch<\/td><\/tr><tr><td>全ユーザーの認証情報の状態は？<\/td><td>IAM の認証情報レポート<\/td><\/tr><\/table><\/div><div class=\"warn\">引っかけ注意：Config ルールは「評価して非準拠を知らせる」もの。変更そのものを止める仕組みではない（修復アクションは別に設定する）。<\/div>"}, {"s": 2, "t": "2.2 補足：暗号化の鍵と証明書（KMS・CloudHSM・ACM）", "h": "<div class=\"tw\"><table><tr><th>鍵の種類<\/th><th>誰が管理<\/th><th>お客様にできること<\/th><th>ローテーション<\/th><th>料金<\/th><\/tr><tr><td>カスタマーマネージドキー<\/td><td>お客様<\/td><td>キーポリシー、有効・無効、削除のスケジュールまで全部<\/td><td>任意（自分で設定）<\/td><td>鍵ごとの月額＋使用料<\/td><\/tr><tr><td>AWS マネージドキー（aws/サービス名）<\/td><td>AWS のサービス<\/td><td>見る・使用の監査（CloudTrail）だけ。変更・削除は不可<\/td><td>毎年自動（変更不可）<\/td><td>月額なし（使用料はかかる場合あり）<\/td><\/tr><tr><td>AWS 所有キー<\/td><td>AWS のサービス（AWS のアカウント）<\/td><td>見えない<\/td><td>サービスごと<\/td><td>無料<\/td><\/tr><\/table><\/div><ul><li><b>AWS CloudHSM<\/b>：自社専用（シングルテナント）の HSM。AWS はハードウェアとファームウェアを管理し、故障した HSM は自動で置き換えるが、<b>鍵にはアクセスできない<\/b>。認証情報をなくすと AWS も復旧できない。<\/li><li><b>AWS Certificate Manager（ACM）<\/b>：ACM で発行し、ELB・CloudFront・API Gateway などの統合サービスで使う証明書は無料で自動更新。<b>外部からインポートした証明書は自動更新されない<\/b>。<\/li><li>保存時の暗号化（at rest）＝KMS などの鍵。通信時の暗号化（in transit）＝TLS（証明書は ACM）。<\/li><\/ul><div class=\"mem\">鍵の自由度：カスタマーマネージド（全部自分）＞ AWS マネージド（見るだけ）＞ AWS 所有（見えない）。さらに「専用ハードウェア」なら CloudHSM。<\/div>"}, {"s": 2, "t": "2.4 補足：コンプライアンス・データの所在地・情報源", "h": "<ul><li><b>AWS Artifact<\/b> には2つの入口。<b>レポート<\/b>＝ISO 認証、SOC レポート、PCI など AWS が受けた監査の資料。<b>契約（Agreements）<\/b>＝事業提携契約（BAA）や秘密保持契約（NDA）を確認・受諾・管理。組織の管理アカウントは、全メンバーアカウントの分をまとめて受諾できる。<\/li><li>AWS のコンプライアンスプログラムには、<b>認証・証明<\/b>（ISO 27001、SOC 1・2・3、PCI DSS、日本の ISMAP など）と、<b>法律・規制<\/b>（HIPAA など）がある。HIPAA は認証ではなく、BAA を結び、<b>HIPAA の対象サービス<\/b>だけで医療情報を扱う。<\/li><li>対象となる認証は<b>サービスやリージョンによって違う<\/b>。AWS を使っても、お客様の準拠の責任は残る。<\/li><li><b>データの所在地<\/b>：保存するリージョンはお客様が選ぶ。AWS はお客様の同意なしに、選ばれたリージョンの外へデータを移動・複製しない。データの所有者はお客様。<\/li><li><b>情報源<\/b>（試験ガイドの例）：AWS ナレッジセンター（多い質問への AWS 公式の回答記事。今は AWS re:Post 上）、AWS セキュリティセンター、AWS セキュリティブログ。サードパーティのセキュリティ製品は <b>AWS Marketplace<\/b>。設定の問題の点検は <b>AWS Trusted Advisor<\/b>（ルートの MFA、公開スナップショット、開いたポート、漏れたアクセスキーなど）。<\/li><\/ul><div class=\"warn\">引っかけ注意：「AWS は HIPAA 認証を持つので、使えば自動で準拠」は×。AWS Audit Manager は試験の範囲内サービス一覧にないので、「AWS のコンプライアンスレポートの入手」の答えは Artifact。<\/div>"}, {"s": 3, "t": "3.3 補足：EC2 インスタンスファミリーの見分け方", "h": "<p>インスタンスタイプは CPU・メモリ・ストレージ・ネットワークの組み合わせ。用途ごとに「ファミリー」に分かれる。試験では<b>ワークロードの言葉からファミリーを選ぶ<\/b>。<\/p><div class=\"tw\"><table><tr><th>ファミリー<\/th><th>AWS の説明（要約）<\/th><th>例に出る用途（合図）<\/th><th>名前の頭文字の例<\/th><\/tr><tr><td>汎用<\/td><td>コンピューティング・メモリ・ネットワークのバランス<\/td><td>Web サーバー、コードのリポジトリ、小〜中規模の DB<\/td><td>M、T<\/td><\/tr><tr><td>コンピューティング最適化<\/td><td>高性能なプロセッサが効く、CPU で決まる処理<\/td><td>バッチ処理、動画の変換（トランスコード）、専用のゲームサーバー<\/td><td>C<\/td><\/tr><tr><td>メモリ最適化<\/td><td>大きなデータをメモリ上で速く処理<\/td><td>インメモリ DB、データ分析、基幹系アプリ<\/td><td>R、X、U<\/td><\/tr><tr><td>ストレージ最適化<\/td><td>ローカルストレージに対して、低遅延のランダム I/O を毎秒数百万回<\/td><td>高スループットの DB、データ処理、データストリーミング<\/td><td>I、D<\/td><\/tr><tr><td>高速化コンピューティング<\/td><td>ハードウェアアクセラレーター（GPU など）で計算を効率化<\/td><td>浮動小数点の計算、グラフィックス処理、データのパターン照合、機械学習<\/td><td>P、G、Inf、Trn<\/td><\/tr><\/table><\/div><p><b>Amazon Machine Image（AMI）<\/b>：インスタンスを起動するのに必要なソフトウェア（OS など）を入れたイメージ。起動時に必ず指定する。同じ AMI から同じ構成のインスタンスを何台でも起動できる。AMI は<b>リージョンごと<\/b>なので、別のリージョンで使うにはコピーする。AWS が用意したもの、共有されたもの、AWS Marketplace で買ったもの、自分で作ったものを使える。<\/p><div class=\"tw\"><table><tr><th>ロードバランサー<\/th><th>層<\/th><th>合図<\/th><\/tr><tr><td>Application Load Balancer（ALB）<\/td><td>レイヤー7（HTTP、HTTPS、gRPC）<\/td><td>URL のパスやヘッダーで振り分け、Web アプリ<\/td><\/tr><tr><td>Network Load Balancer（NLB）<\/td><td>レイヤー4（TCP、UDP、TLS）<\/td><td>固定の IP アドレス（Elastic IP）、高性能<\/td><\/tr><tr><td>Gateway Load Balancer（GWLB）<\/td><td>レイヤー3 のゲートウェイ＋レイヤー4 の負荷分散<\/td><td>ファイアウォールなどの仮想アプライアンスに通信を通す<\/td><\/tr><\/table><\/div><div class=\"warn\">引っかけ注意：「GPU」「機械学習の学習」は高速化コンピューティング。「大量のデータをメモリに」はメモリ最適化。「ディスクの I/O が多い」はストレージ最適化。「CPU を多く使うバッチや動画変換」はコンピューティング最適化。迷ったら汎用ではなく、問題文の一番強い要件で選ぶ。<\/div><div class=\"mem\">C＝Compute（CPU）、R＝RAM（メモリ）、I＝I/O（ストレージ）、G・P＝GPU。M＝Main（汎用）。<\/div>"}, {"s": 3, "t": "3.5 補足：Route 53 のルーティングポリシー", "h": "<p>Amazon Route 53 では、DNS レコードごとに<b>ルーティングポリシー<\/b>を選ぶ。どのポリシーかで、問い合わせにどう答えるかが決まる。<\/p><div class=\"tw\"><table><tr><th>ポリシー<\/th><th>使う場面<\/th><th>合図<\/th><\/tr><tr><td>シンプル<\/td><td>1つのリソース（Web サーバー1台など）<\/td><td>特別な条件なし<\/td><\/tr><tr><td>加重（Weighted）<\/td><td>複数のリソースに、指定した割合で振り分け<\/td><td>「新しい版に10％だけ」「割合」<\/td><\/tr><tr><td>レイテンシー<\/td><td>複数リージョンのうち、遅延が最も小さいリージョンへ<\/td><td>「最も速く応答」「遅延が小さい」<\/td><\/tr><tr><td>フェイルオーバー<\/td><td>アクティブ・パッシブ。正常でなくなったら待機側へ<\/td><td>「障害時に予備のサイトへ」<\/td><\/tr><tr><td>位置情報（Geolocation）<\/td><td>利用者の場所（国・大陸など）で振り分け<\/td><td>「国ごとに違う内容」「その国の利用者だけ」<\/td><\/tr><tr><td>地理的近接性（Geoproximity）<\/td><td>リソースの場所で振り分け、必要なら量を寄せる<\/td><td>（応用。CLF では名前だけ）<\/td><\/tr><tr><td>複数値回答（Multivalue answer）<\/td><td>正常なレコードを最大8個までランダムに返す<\/td><td>（応用）<\/td><\/tr><tr><td>IP ベース<\/td><td>送信元の IP アドレスで振り分け<\/td><td>（応用）<\/td><\/tr><\/table><\/div><p><b>ヘルスチェック<\/b>：Route 53 はリソースの正常性を監視し、正常でないリソースから正常なリソースへ通信を移せる（DNS フェイルオーバー）。<\/p><div class=\"warn\">引っかけ注意：「遅延」はレイテンシー、「場所（国）」は位置情報。利用者に近い場所が速いとは限らないので、「最も速い」ならレイテンシーを選ぶ。法令やライセンスで「その国の利用者に限る」なら位置情報。<\/div><div class=\"mem\">割合＝加重、速さ＝レイテンシー、予備＝フェイルオーバー、国＝位置情報。<\/div>"}, {"s": 3, "t": "3.5 補足：VPC の部品とつなぎ方", "h": "<div class=\"tw\"><table><tr><th>部品<\/th><th>役割<\/th><\/tr><tr><td>サブネット<\/td><td>VPC の中の IP アドレスの範囲。<b>1つの AZ の中だけ<\/b>にある（AZ をまたげない）<\/td><\/tr><tr><td>ルートテーブル<\/td><td>サブネットから出る通信の行き先を決める。すべてのサブネットに必ず1つ関連付く<\/td><\/tr><tr><td>インターネットゲートウェイ<\/td><td>VPC とインターネットの出入口。<b>ここへの直接のルートがあるサブネット＝パブリックサブネット<\/b><\/td><\/tr><tr><td>NAT ゲートウェイ<\/td><td>プライベートサブネットから外へ出るだけ。外から接続を始めることはできない。パブリック NAT ゲートウェイはパブリックサブネットに置く<\/td><\/tr><tr><td>ゲートウェイ型 VPC エンドポイント<\/td><td>Amazon S3 と DynamoDB に、インターネットゲートウェイや NAT なしで接続。<b>追加料金なし<\/b><\/td><\/tr><tr><td>インターフェイス型 VPC エンドポイント（AWS PrivateLink）<\/td><td>多くの AWS サービスや、他のアカウントのサービスへプライベート IP で接続<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>つなぎ方<\/th><th>特徴<\/th><\/tr><tr><td>VPC ピアリング<\/td><td>2つの VPC を1対1でつなぐ。別アカウント・別リージョンも可。作成は無料。<b>推移的なルーティングはできない<\/b>（A−B、A−C をつないでも B と C は通信できない）。CIDR の重複は不可<\/td><\/tr><tr><td>AWS Transit Gateway<\/td><td>多数の VPC とオンプレミス（VPN、Direct Connect）をハブでつなぐ。添付ごとの時間料金と処理したデータ量の料金<\/td><\/tr><tr><td>AWS Site-to-Site VPN<\/td><td>拠点のネットワークと VPC を IPsec で暗号化して接続。1つの接続に<b>トンネルが2本<\/b>（高可用性）<\/td><\/tr><tr><td>AWS Client VPN<\/td><td>社員の PC など<b>個々の端末<\/b>から接続。OpenVPN ベースのクライアントを使う。マネージド<\/td><\/tr><tr><td>AWS Direct Connect<\/td><td>自社と Direct Connect ロケーションを専用の回線で結ぶ。インターネットのプロバイダーを経由しない<\/td><\/tr><\/table><\/div><p>VPC のセキュリティ：セキュリティグループ（インスタンス単位、ステートフル、許可のみ、すべてのルールを評価）、ネットワーク ACL（サブネット単位、ステートレス、許可と拒否、番号の小さい順に評価し最初に一致したもの）。<b>デフォルトのネットワーク ACL はすべての通信を許可<\/b>。Amazon Inspector は EC2 へのポートがインターネットなどから到達できるか（ネットワーク到達性）も調べる。<\/p><div class=\"warn\">引っかけ注意：VPC が3つ以上で「全部を互いにつなぎたい」「オンプレミスも一緒に」なら Transit Gateway。2つだけなら VPC ピアリングで足りる。<\/div><div class=\"mem\">ピアリング＝1対1の握手（友達の友達は友達ではない）。Transit Gateway＝駅のハブ。<\/div>"}, {"s": 3, "t": "3.1・3.2 補足：AWS の使い方とリージョンの選び方", "h": "<div class=\"tw\"><table><tr><th>方法<\/th><th>向いている場面<\/th><\/tr><tr><td>AWS マネジメントコンソール<\/td><td>画面で操作。1回だけの作業、状況の確認、学習<\/td><\/tr><tr><td>AWS CLI<\/td><td>コマンドで操作。スクリプトにして繰り返す<\/td><\/tr><tr><td>AWS SDK<\/td><td>自分のアプリのコード（Python、Java など）から AWS を呼ぶ。署名や再試行を SDK が面倒を見る<\/td><\/tr><tr><td>API<\/td><td>HTTPS で直接呼ぶ。上の方法はすべて最終的に API を呼んでいる<\/td><\/tr><tr><td>Infrastructure as Code（AWS CloudFormation）<\/td><td>テンプレート（テキスト）でリソースを定義し、同じ環境を何度でも、複数のリージョンにも作れる。変更をバージョン管理できる<\/td><\/tr><\/table><\/div><p>参考：AWS CloudShell はコンソールから開けるブラウザのシェル。AWS CLI が入っていて、ログイン中の認証情報をそのまま使える（追加料金なし）。試験の範囲内サービス一覧には載っていないので、背景知識として。<\/p><p><b>リージョンの選び方<\/b>（AWS が挙げる4つ）：<b>コンプライアンス<\/b>（データの所在の法令があれば最優先）、<b>遅延<\/b>（利用者に近い）、<b>コスト<\/b>（リージョンで料金が違う）、<b>サービスと機能<\/b>（新しいサービスは順にリージョンへ広がる）。2019年3月20日より後にできたリージョンは、使う前に有効化（オプトイン）が必要。<\/p><p><b>AZ<\/b>：それぞれ電源・冷却・物理セキュリティが独立し、何キロも離れているが、互いに100 km 以内。冗長な低遅延の回線でつながり、同期レプリケーションができる。各リージョンに3つ以上。<\/p><p>背景知識：<b>AWS Local Zones<\/b>（大都市の近くにコンピューティングなどを置き、遅延を小さくする。親リージョンの延長）、<b>AWS Wavelength<\/b>（通信事業者の 5G などのネットワークの端に置き、モバイル端末への遅延を小さくする）、<b>AWS Outposts<\/b>（自社のデータセンターに置く）。<\/p><div class=\"warn\">引っかけ注意：「どのリージョンでも全サービスが使える」「料金はどのリージョンも同じ」は誤り。<\/div>"}, {"s": 3, "t": "3.6 補足：S3 のストレージクラスの数字と主な機能", "h": "<p>耐久性は、どのクラスも <b>99.999999999%（イレブンナイン）<\/b>。違うのは「AZ の数」「最小保存期間」「取り出しの速さ」「取り出し料金」。<\/p><div class=\"tw\"><table><tr><th>クラス<\/th><th>AZ<\/th><th>最小保存期間<\/th><th>取り出し<\/th><th>目安<\/th><\/tr><tr><td>S3 Standard<\/td><td>3以上<\/td><td>なし<\/td><td>ミリ秒<\/td><td>月1回より多く使う（既定のクラス）<\/td><\/tr><tr><td>S3 Intelligent-Tiering<\/td><td>3以上<\/td><td>なし<\/td><td>ミリ秒（任意のアーカイブ層は数分〜数時間）<\/td><td>パターン不明。取り出し料金なし、監視料金あり<\/td><\/tr><tr><td>S3 Express One Zone<\/td><td>1（自分で選ぶ）<\/td><td>―<\/td><td>一貫した1桁ミリ秒<\/td><td>最も低レイテンシ。ディレクトリバケットに保存<\/td><\/tr><tr><td>S3 Standard-IA<\/td><td>3以上<\/td><td>30日<\/td><td>ミリ秒<\/td><td>月1回程度。再作成できない唯一のコピーにも<\/td><\/tr><tr><td>S3 One Zone-IA<\/td><td>1<\/td><td>30日<\/td><td>ミリ秒<\/td><td>再作成できるデータ。AZ が失われると消える<\/td><\/tr><tr><td>S3 Glacier Instant Retrieval<\/td><td>3以上<\/td><td>90日<\/td><td>ミリ秒<\/td><td>四半期に1回程度<\/td><\/tr><tr><td>S3 Glacier Flexible Retrieval<\/td><td>3以上<\/td><td>90日<\/td><td>数分〜数時間（復元が必要）<\/td><td>年1回程度。バックアップ、災害対策<\/td><\/tr><tr><td>S3 Glacier Deep Archive<\/td><td>3以上<\/td><td>180日<\/td><td>数時間（復元が必要）<\/td><td>年1回未満。長期保管、コンプライアンス<\/td><\/tr><\/table><\/div><h3>Glacier の取り出しオプション（復元の速さ）<\/h3><div class=\"tw\"><table><tr><th>クラス<\/th><th>迅速（Expedited）<\/th><th>標準（Standard）<\/th><th>大容量（Bulk）<\/th><\/tr><tr><td>Glacier Flexible Retrieval<\/td><td>1〜5分<\/td><td>3〜5時間<\/td><td>5〜12時間（無料）<\/td><\/tr><tr><td>Glacier Deep Archive<\/td><td>なし<\/td><td>12時間以内<\/td><td>48時間以内<\/td><\/tr><\/table><\/div><h3>S3 の主な機能<\/h3><ul><li><b>バージョニング<\/b>：誤った削除・上書きから戻せる。削除すると「削除マーカー」が付くだけ。一度有効にしたら「なし」には戻せない（停止はできる）。各バージョンに料金がかかる。<\/li><li><b>レプリケーション<\/b>：別リージョンへ（CRR）、同じリージョンへ（SRR）自動でコピー。<b>送信元と送信先の両方でバージョニングが必要<\/b>。設定前からあるオブジェクトは自動ではコピーされない（S3 Batch Replication を使う）。<\/li><li><b>ライフサイクル<\/b>：日数で安いクラスへ移す・削除する。<\/li><li><b>S3 ブロックパブリックアクセス<\/b>：組織・アカウント・バケット・アクセスポイントの単位で、公開を止める。バケットポリシーや ACL の公開設定より優先。オブジェクト単位では設定できない。新しいバケットは既定で公開されない。<\/li><li><b>静的ウェブサイトホスティング<\/b>：HTML・画像など静的なものだけ。ウェブサイトエンドポイントは <b>HTTPS 非対応<\/b>。HTTPS なら CloudFront（または AWS Amplify Hosting）を前に置く。<\/li><\/ul><div class=\"warn\">引っかけ注意：「One Zone」は2つある。S3 One Zone-IA（安い、たまに使う）と S3 Express One Zone（最速、頻繁に使う）。どちらも1つの AZ なので、AZ が失われるとデータを失う可能性がある。Glacier Flexible Retrieval と Deep Archive は、すぐには読めない（先に復元）。Glacier Instant Retrieval だけはミリ秒。<\/div><div class=\"mem\">最小保存期間は「IA は30、Glacier は90、Deep は180」。取り出しは「Instant＝ミリ秒、Flexible＝分〜時間、Deep＝半日〜2日」。<\/div>"}, {"s": 3, "t": "3.6 補足：ディスク・ファイル・ハイブリッド・バックアップの選び方", "h": "<h3>EBS とインスタンスストア<\/h3><ul><li><b>EBS のボリュームタイプ<\/b>：SSD の汎用（gp3・gp2）＝起動ボリューム、一般的な用途。SSD のプロビジョンド IOPS（io2 Block Express・io1）＝1ミリ秒未満の安定した性能が必要な重要 DB。HDD のスループット最適化（st1）＝ビッグデータ・ログ処理。HDD のコールド（sc1）＝あまり使わない、最安。<b>HDD は起動ボリュームにできない<\/b>。<\/li><li><b>EBS スナップショット<\/b>：増分のバックアップ。S3 に保存される（S3 のコンソールからは見えない）。リージョン内の全 AZ に複製されるので、別の AZ にもボリュームを復元できる。<b>AWS は EBS を自動ではバックアップしない<\/b>（Amazon Data Lifecycle Manager や AWS Backup で自動化）。<\/li><li><b>インスタンスストア<\/b>：ホストに直付けの一時ストレージ。追加料金なし。再起動ではデータが残るが、<b>停止・休止・終了で消える<\/b>。キャッシュ、バッファ、一時データ向け。<\/li><\/ul><h3>ファイルストレージ<\/h3><div class=\"tw\"><table><tr><th>サービス<\/th><th>合図<\/th><\/tr><tr><td>Amazon EFS（リージョン）<\/td><td>Linux の共有ファイル。複数 AZ に保存<\/td><\/tr><tr><td>Amazon EFS（One Zone）<\/td><td>1つの AZ。安い。開発・テスト、再作成できるデータ<\/td><\/tr><tr><td>EFS のストレージクラス<\/td><td>Standard ／ Infrequent Access（IA）／ Archive。ライフサイクル管理で自動移動<\/td><\/tr><tr><td>FSx for Windows File Server<\/td><td>Windows、SMB、Active Directory<\/td><\/tr><tr><td>FSx for Lustre<\/td><td>HPC、機械学習、動画処理。S3 とつなげてファイルとして見せる。Linux<\/td><\/tr><tr><td>FSx for NetApp ONTAP<\/td><td>オンプレミスの NetApp からそのまま移行。NFS・SMB・iSCSI のマルチプロトコル<\/td><\/tr><tr><td>FSx for OpenZFS<\/td><td>OpenZFS ベースの共有ファイル<\/td><\/tr><\/table><\/div><h3>AWS Storage Gateway（オンプレミスに置く仮想アプライアンス）<\/h3><div class=\"tw\"><table><tr><th>種類<\/th><th>オンプレから見えるもの<\/th><th>保存先<\/th><\/tr><tr><td>S3 File Gateway<\/td><td>ファイル共有（NFS・SMB）<\/td><td>S3 のオブジェクト（手元にキャッシュ）<\/td><\/tr><tr><td>Volume Gateway<\/td><td>ブロック（iSCSI）。キャッシュ型・保管型<\/td><td>AWS（EBS スナップショットで保護）<\/td><\/tr><tr><td>Tape Gateway<\/td><td>仮想テープライブラリ（VTL）。今のバックアップソフトのまま<\/td><td>S3、取り出したテープは S3 Glacier ／ Deep Archive へ<\/td><\/tr><tr><td>FSx File Gateway<\/td><td colspan=\"2\">新規のお客様は利用できなくなった（既存のお客様のみ）<\/td><\/tr><\/table><\/div><h3>AWS Backup と AWS Elastic Disaster Recovery<\/h3><ul><li><b>AWS Backup<\/b>：EC2・EBS・RDS・Aurora・DynamoDB・EFS・FSx・S3 などのバックアップを<b>バックアッププラン（ポリシー）で一元管理<\/b>。別リージョン・別アカウントへのコピー、Backup Vault Lock（WORM：消せない・保持期間を変えられない）。<\/li><li><b>AWS Elastic Disaster Recovery<\/b>：オンプレミスやクラウドのサーバーを、AWS の低コストのステージング領域へ<b>継続的に複製<\/b>。数分で復旧インスタンスを起動（公式の製品ページでは RPO は秒、RTO は分）。フェイルバックもできる。<\/li><\/ul><div class=\"warn\">引っかけ注意：「バックアップを一元管理・ポリシー」→ AWS Backup。「サーバーを継続複製し、数分で切り替え」→ Elastic Disaster Recovery。「移行（引っ越し）」は AWS Application Migration Service。<\/div><div class=\"mem\">Storage Gateway は「見え方」で選ぶ：ファイル＝S3 File、ディスク＝Volume、テープ＝Tape。<\/div>"}, {"s": 3, "t": "3.4 補足：マルチ AZ とリードレプリカ、Aurora、DynamoDB", "h": "<div class=\"tw\"><table><tr><th><\/th><th>マルチ AZ（スタンバイ1つ）<\/th><th>リードレプリカ<\/th><\/tr><tr><td>目的<\/td><td>高可用性（止まりにくく）<\/td><td>読み込みの負荷分散（速く）<\/td><\/tr><tr><td>複製<\/td><td>同期<\/td><td>非同期<\/td><\/tr><tr><td>読み込み<\/td><td>スタンバイは読めない（待機だけ）<\/td><td>読み込み専用で使える<\/td><\/tr><tr><td>障害時<\/td><td>自動でフェイルオーバー<\/td><td>手動で昇格（独立した DB にする）。災害対策にも使える<\/td><\/tr><tr><td>場所<\/td><td>同じリージョンの別 AZ<\/td><td>同じリージョン、または別リージョン<\/td><\/tr><\/table><\/div><p>補足：RDS には「読み込みもできるスタンバイを2つ持つマルチ AZ DB クラスター」という形もある。試験では基本の「スタンバイは読めない」で考える。<\/p><h3>Amazon Aurora<\/h3><ul><li>MySQL 互換と PostgreSQL 互換。クラスターボリューム（ストレージ）は<b>複数の AZ にまたがり、各 AZ にコピー<\/b>。<\/li><li>Aurora レプリカ（読み込み専用）は最大15。障害時は Aurora レプリカへ自動でフェイルオーバー。<\/li><li><b>Aurora Serverless<\/b>：負荷に合わせて容量（ACU）を自動で増減。予測できない負荷、新しいアプリ、開発・テスト向け。<\/li><\/ul><h3>Amazon DynamoDB<\/h3><ul><li><b>オンデマンドモード<\/b>：リクエストごとに払う。容量の計画がいらない。<b>既定で、多くの場合に推奨<\/b>。<\/li><li><b>プロビジョンドモード<\/b>：1秒あたりの読み書きの量を指定。安定して予測できる負荷で、コストを予測しやすい。<\/li><li><b>グローバルテーブル<\/b>：複数リージョンに自動で複製。<b>どのリージョンのレプリカでも読み書きできる<\/b>（マルチアクティブ）。<\/li><\/ul><h3>その他<\/h3><ul><li>RDS のエンジン：PostgreSQL、MySQL、MariaDB、SQL Server、Oracle、Db2（と Aurora）。<\/li><li>ElastiCache：Valkey、Memcached、Redis OSS 互換。マイクロ秒の応答。キャッシュ、セッションの保存。<\/li><li>DocumentDB：MongoDB の API・ドライバと互換。Neptune：グラフ DB（不正検出、ナレッジグラフ）。Redshift：ペタバイト規模のデータウェアハウス。Redshift Serverless はアイドル時に料金がかからない。<\/li><\/ul><div class=\"warn\">引っかけ注意：「読み込みを速く」でマルチ AZ を選ばない。「AZ 障害に自動で備える」でリードレプリカを選ばない。RDS のリードレプリカは自動では増減しない。<\/div><div class=\"mem\">マルチ AZ＝保険（待機）、リードレプリカ＝分身（読み込み係）。<\/div>"}, {"s": 3, "t": "3.7 補足：Amazon Q と Amazon Quick、データの流れ", "h": "<h3>生成 AI のアシスタント（2026年の状況）<\/h3><div class=\"tw\"><table><tr><th>名前<\/th><th>何をするか<\/th><th>2026年の注意<\/th><\/tr><tr><td>Amazon Q Developer<\/td><td>開発者向け。IDE でのコード補完・生成、セキュリティの脆弱性スキャン、コードのアップグレード。コンソールで AWS について質問<\/td><td>IDE プラグインは 2027-04-30 にサポート終了予定（後継として Kiro を案内）<\/td><\/tr><tr><td>Amazon Q Business<\/td><td>社内データ（S3、SharePoint など）を使い、権限に応じて答える業務向けアシスタント<\/td><td>新規のお客様は利用できない。似た機能は Amazon Quick<\/td><\/tr><tr><td>Amazon Quick<\/td><td>業務向けの AI。Quick Sight（BI・ダッシュボード）、Quick Flows、Quick Automate、Quick Index、Quick Research<\/td><td>Amazon QuickSight から発展。QuickSight は Amazon Quick Sight として Quick の機能の1つに<\/td><\/tr><\/table><\/div><h3>分析のデータの流れ（例）<\/h3><div class=\"tw\"><table><tr><th>段階<\/th><th>サービス<\/th><th>合図<\/th><\/tr><tr><td>集める（リアルタイム）<\/td><td>Kinesis Data Streams<\/td><td>自分で処理アプリを作る。複数のアプリが同じストリームを読む。1秒未満<\/td><\/tr><tr><td>届ける（リアルタイム）<\/td><td>Amazon Data Firehose（旧 Kinesis Data Firehose）<\/td><td>アプリを書かずに S3・Redshift・OpenSearch Service などへ配信。変換もできる<\/td><\/tr><tr><td>整理・変換<\/td><td>AWS Glue<\/td><td>サーバーレスの ETL。クローラーがスキーマを見つけ、Data Catalog に登録<\/td><\/tr><tr><td>問い合わせ<\/td><td>Amazon Athena<\/td><td>S3 に標準 SQL。サーバーレス、実行したクエリ分だけ<\/td><\/tr><tr><td>大規模処理<\/td><td>Amazon EMR<\/td><td>Hadoop・Spark のマネージドクラスター<\/td><\/tr><tr><td>DWH<\/td><td>Amazon Redshift<\/td><td>ペタバイト規模。BI ツールから SQL<\/td><\/tr><tr><td>検索・ログ分析<\/td><td>Amazon OpenSearch Service<\/td><td>全文検索、ログ分析、リアルタイムのアプリ監視、OpenSearch Dashboards<\/td><\/tr><tr><td>見せる<\/td><td>Amazon Quick（Quick Sight）<\/td><td>ダッシュボード、可視化<\/td><\/tr><\/table><\/div><h3>AI サービスの細かい合図<\/h3><ul><li>Amazon Comprehend：エンティティ、キーフレーズ、言語、感情、<b>個人情報（PII）の検出<\/b>、トピックモデリング。<\/li><li>Amazon Rekognition：物体・シーン、顔の比較、<b>不適切なコンテンツの検出<\/b>、画像の中の文字、保護具（PPE）の検出。<\/li><li>Amazon Lex：音声とテキストの会話（チャットボット）。Amazon Connect と組み合わせて電話の自動応答にも。<\/li><li>Amazon SageMaker AI（2024-12-03 に Amazon SageMaker から改名）：ML モデルの構築・学習・デプロイ。今の「Amazon SageMaker」は、データ・分析・AI をまとめた統合プラットフォームの名前。<\/li><\/ul><div class=\"warn\">引っかけ注意：S3 の中の個人情報を探すのは Macie。文章の中の個人情報を見つけるのは Comprehend。画像の中の文字を拾うのは Rekognition でもできるが、書類の表やフォームの項目なら Textract。<\/div><div class=\"mem\">Streams＝川（自分で汲む）、Firehose＝消防ホース（決めた先へ自動で放水）。<\/div>"}, {"s": 3, "t": "3.8 補足：メッセージとイベントのサービスの選び方", "h": "<p>アプリの部品どうしを「疎結合」（直接つながず、間に何かを挟む）にするサービスは4つ。問題文の動詞で選ぶ。<\/p><div class=\"tw\"><table><tr><th>サービス<\/th><th>ひとことで<\/th><th>問題文の合図<\/th><\/tr><tr><td>Amazon SQS<\/td><td>メッセージを溜めるキュー。受け手が自分のペースで取りに行く<\/td><td>溜める、バッファ、注文を失わない、疎結合<\/td><\/tr><tr><td>Amazon SNS<\/td><td>トピックに発行すると、購読者全員に複製して配る（Pub/Sub、ファンアウト）<\/td><td>同時に複数へ、通知、メール・SMS・プッシュ<\/td><\/tr><tr><td>Amazon EventBridge<\/td><td>イベントを受け取り、ルールに合うものを宛先へ届けるサーバーレスのイベントルーター。EventBridge Scheduler で時刻起動も<\/td><td>イベントが起きたら、AWS のサービスやサードパーティからのイベント、毎日○時に<\/td><\/tr><tr><td>AWS Step Functions<\/td><td>処理の手順（ワークフロー）を組む。分岐・並列・再試行・人の承認待ち<\/td><td>手順、順番に、失敗したら再試行、承認を待つ、流れを図で確認<\/td><\/tr><\/table><\/div><h3>SQS の標準キューと FIFO キュー<\/h3><div class=\"tw\"><table><tr><th><\/th><th>標準キュー<\/th><th>FIFO キュー<\/th><\/tr><tr><td>スループット<\/td><td>ほぼ無制限<\/td><td>高い（バッチで1秒あたり最大3,000メッセージ。高スループットモードあり）<\/td><\/tr><tr><td>配信<\/td><td>少なくとも1回（まれに重複して届く）<\/td><td>1回だけの処理（重複排除）<\/td><\/tr><tr><td>順序<\/td><td>ベストエフォート（保証しない）<\/td><td>メッセージグループの中で送った順<\/td><\/tr><tr><td>向く用途<\/td><td>大量の処理を速く、重い処理を裏に回す<\/td><td>価格の変更、操作の順番が大事なもの<\/td><\/tr><\/table><\/div><h3>可視性タイムアウト（Visibility timeout）<\/h3><ul><li>受け取ったメッセージはキューに残ったまま、一定時間ほかの受信者から見えなくなる。<\/li><li>その間に処理して削除しなければ、時間切れで再び見えるようになり、別の受信者が処理できる（だから失われない）。<\/li><li>既定は30秒。処理時間に合わせて変える。何度も失敗するメッセージはデッドレターキュー（DLQ）に移せる。<\/li><\/ul><div class=\"warn\">引っかけ注意：1つの SQS キューを複数のシステムで共有しても、1つのメッセージを全員が受け取るわけではない。全員に配るなら SNS で配って、それぞれの SQS キューで溜める（ファンアウト）。<\/div><div class=\"mem\">溜める SQS、配る SNS、つなぐ EventBridge、組む Step Functions。<\/div>"}, {"s": 3, "t": "3.8 補足：管理とガバナンスのサービスの地図", "h": "<p>「管理とガバナンス」は名前が似たサービスが多い。<b>何を相手にするか<\/b>（アカウント、リソース、サーバーの中、費用、上限）で分けて覚える。<\/p><div class=\"tw\"><table><tr><th>相手<\/th><th>サービス<\/th><th>覚えること<\/th><\/tr><tr><td rowspan=\"3\">複数のアカウント<\/td><td>AWS Organizations<\/td><td>アカウントを組織単位（OU）にまとめる（入れ子可）。SCP で権限の上限。一括請求（請求1枚、使用量を合算して割引を共有、追加料金なし）。Organizations 自体も追加料金なし<\/td><\/tr><tr><td>AWS Control Tower<\/td><td>ベストプラクティスに沿った複数アカウントの環境（ランディングゾーン）を1時間かからずに用意。Account Factory で新しいアカウントを決まった設定で払い出し。コントロール（旧称ガードレール）で統制<\/td><\/tr><tr><td>AWS RAM<\/td><td>サブネットなどのリソースを1回作って、組織・OU・アカウントに共有。追加料金なし<\/td><\/tr><tr><td rowspan=\"3\">リソースの作り方<\/td><td>AWS CloudFormation<\/td><td>テンプレート（JSON・YAML）からスタックを作る。スタックを消せば中のリソースもまとめて消える。ドリフト検出で、テンプレートの外で変えられたリソースを見つける<\/td><\/tr><tr><td>AWS Service Catalog<\/td><td>管理者が承認済みの製品をポートフォリオにまとめ、制約をつけて配る。利用者は幅広い権限なしで自分で起動できる<\/td><\/tr><tr><td>AWS License Manager<\/td><td>Microsoft・Oracle などのライセンス（BYOL）の使用数を追跡。ハード・ソフトの上限で超過を防ぐ<\/td><\/tr><tr><td>サーバーの中<\/td><td>AWS Systems Manager<\/td><td>SSM Agent が入ったマネージドノード（EC2、オンプレミス）を管理。Session Manager（ポートを開けずに接続）、Run Command（一斉にコマンド）、Patch Manager（パッチ）、Parameter Store（設定値）<\/td><\/tr><tr><td rowspan=\"4\">点検・推奨<\/td><td>AWS Trusted Advisor<\/td><td>アカウントを自動で点検（コスト、性能、セキュリティ、耐障害性、上限など）。Basic では上限のチェック全部と、セキュリティ・耐障害性の一部だけ<\/td><\/tr><tr><td>AWS Compute Optimizer<\/td><td>CloudWatch の過去14日分（既定）などを分析し、EC2・EBS・Lambda などの適正サイズを推奨。オプトインが必要<\/td><\/tr><tr><td>AWS Well-Architected Tool<\/td><td>6つの柱の質問に答えてワークロードを見直し、優先順位つきの改善計画。追加料金なし<\/td><\/tr><tr><td>AWS Health Dashboard<\/td><td>AWS 側の障害と予定されたメンテナンス。Service health（誰でも見られる全体の状況）と Your account health（自分のアカウントへの影響）。全員が追加料金なしで使える<\/td><\/tr><tr><td>上限<\/td><td>Service Quotas<\/td><td>AWS のサービスの上限の確認と引き上げ申請（審査あり。承認・却下・一部承認）<\/td><\/tr><\/table><\/div><h3>SCP の3つの決まり<\/h3><ul><li>SCP は<b>権限を与えない<\/b>。上限（天井）を決めるだけ。実際の許可は IAM のポリシーで。<\/li><li>SCP は<b>管理アカウントには効かない<\/b>。メンバーアカウントだけ（メンバーアカウントのルートユーザーにも効く）。<\/li><li>SCP は組織の「すべての機能」を有効にしたときだけ使える。一括請求だけの機能セットでは使えない。<\/li><\/ul><h3>Control Tower のコントロールの3種類<\/h3><div class=\"tw\"><table><tr><th>種類<\/th><th>何をする<\/th><th>中身<\/th><\/tr><tr><td>予防的（preventive）<\/td><td>違反する操作をさせない<\/td><td>SCP、RCP<\/td><\/tr><tr><td>発見的（detective）<\/td><td>違反しているリソースを見つける<\/td><td>AWS Config のルール<\/td><\/tr><tr><td>事前的（proactive）<\/td><td>作る前に検査して、違反なら作らせない<\/td><td>CloudFormation フック<\/td><\/tr><\/table><\/div><p>必須（mandatory）のコントロールは常にかかり、変えられない。「強く推奨」と「任意（elective）」は選べる。<\/p><div class=\"mem\">Organizations ＝ 部品、Control Tower ＝ 部品を組んだ完成品。Service Catalog ＝ 社内の承認済みメニュー、Marketplace ＝ 社外の店。<\/div>"}, {"s": 4, "t": "4.1 補足：Savings Plans とリザーブドインスタンスの種類", "h": "<p>Savings Plans も リザーブドインスタンス（RI）も「1年か3年の約束で割引」。違いは<b>何を約束するか<\/b>と<b>どこまで融通がきくか<\/b>。<\/p><div class=\"tw\"><table><tr><th>Savings Plans の種類<\/th><th>割引が効く範囲<\/th><th>最大の割引<\/th><\/tr><tr><td>Compute Savings Plans<\/td><td>EC2・AWS Lambda・AWS Fargate。インスタンスファミリー、サイズ、AZ、リージョン、OS、テナンシーを問わない<\/td><td>最大66%<\/td><\/tr><tr><td>EC2 Instance Savings Plans<\/td><td>選んだ<b>リージョンの、選んだインスタンスファミリー<\/b>の EC2。サイズ、AZ、OS、テナンシーは問わない<\/td><td>最大72%（Savings Plans で最も安い）<\/td><\/tr><tr><td>SageMaker AI 向け（公式名 Amazon SageMaker Savings Plans）<\/td><td>SageMaker AI の機械学習インスタンス（ノートブック、処理、学習、推論など）。ファミリー、サイズ、リージョンを問わない<\/td><td>最大64%<\/td><\/tr><tr><td>Database Savings Plans<\/td><td>Aurora、RDS、DynamoDB、ElastiCache、DocumentDB、Neptune など。1年・前払いなしのみ<\/td><td>最大35%<\/td><\/tr><\/table><\/div><p>支払い方法は全額前払い（All Upfront）・一部前払い（Partial Upfront）・前払いなし（No Upfront）。<\/p><div class=\"tw\"><table><tr><th>RI の区分<\/th><th>特徴<\/th><\/tr><tr><td>スタンダード RI<\/td><td>割引が大きい（最大72%）。<b>交換できない<\/b>。<b>RI マーケットプレイスで売買できる<\/b><\/td><\/tr><tr><td>コンバーティブル RI<\/td><td>割引はやや小さい（最大66%）。期間中に<b>別のファミリー・OS などのコンバーティブル RI に交換できる<\/b>。RI マーケットプレイスでは売買できない<\/td><\/tr><tr><td>リージョナル RI（範囲＝リージョン）<\/td><td><b>容量は予約しない<\/b>。リージョン内のどの AZ でも割引。Linux かつ共有テナンシーなら同じファミリーのサイズ違いにも割引<\/td><\/tr><tr><td>ゾーナル RI（範囲＝AZ）<\/td><td>指定した AZ で<b>容量を予約する<\/b>。割引はその AZ、そのサイズだけ<\/td><\/tr><\/table><\/div><p>リージョナルとゾーナルで<b>価格は同じ<\/b>。RI と Savings Plans の割引は、AWS Organizations の一括請求の中で他のアカウントと共有できる（管理アカウントがアカウントごとに共有を止めることもできる）。<\/p><h3>その他の買い方の細部<\/h3><ul><li><b>スポットインスタンス<\/b>：最大90%引き。中断の<b>2分前<\/b>に中断通知（Amazon EventBridge のイベントとインスタンスメタデータ）。休止（hibernate）を選んだ場合は2分前の予告はない。<\/li><li><b>Dedicated Hosts<\/b>：ホスト単位の課金。ソケット・物理コアが見える。ホストアフィニティ。BYOL を広くサポート。<\/li><li><b>Dedicated Instances<\/b>：インスタンス単位の課金。ソケットやコアは見えない。ハードウェアを1つのお客様アカウントで専有。<\/li><li><b>オンデマンドキャパシティ予約<\/b>：特定の AZ の容量を確保（すぐ使う予約なら期間の約束なし）。<b>それ自体には割引がない<\/b>。Savings Plans かリージョナル RI と組み合わせると割引が効く（ゾーナル RI の割引は効かない）。<\/li><\/ul><div class=\"mem\">迷ったら：何でも使う＝Compute、同じファミリーでとにかく安く＝EC2 Instance、構成を途中で変える RI＝コンバーティブル、売れる RI＝スタンダード、容量の確保＝ゾーナル RI かキャパシティ予約。<\/div><div class=\"warn\">引っかけ注意：Compute Savings Plans は SageMaker AI には効かない（SageMaker AI 用の Savings Plans が別にある）。「リージョナル RI は容量を予約する」も誤り。<\/div>"}, {"s": 4, "t": "4.2 補足：Budgets の種類とアクション、コスト配分タグ、Data Exports", "h": "<h3>AWS Budgets の予算の種類<\/h3><div class=\"tw\"><table><tr><th>種類<\/th><th>知らせる条件<\/th><\/tr><tr><td>コスト予算<\/td><td>費用がしきい値に近づく・超える（実績と予測の両方で通知できる）<\/td><\/tr><tr><td>使用量予算<\/td><td>使用量がしきい値に近づく・超える<\/td><\/tr><tr><td>RI 使用率予算・RI カバレッジ予算<\/td><td>RI の使用率や、RI でカバーされた割合が下回る<\/td><\/tr><tr><td>Savings Plans 使用率予算・カバレッジ予算<\/td><td>Savings Plans の使用率やカバー率が下回る<\/td><\/tr><\/table><\/div><p>通知先はメールか Amazon SNS トピック。データの更新は1日に最大3回なので、通知には遅れがある。<\/p><p><b>予算アクション<\/b>：しきい値に達したら、自動で、または承認のあとで、IAM ポリシーの適用、SCP（サービスコントロールポリシー）の適用、特定の EC2・RDS インスタンスを対象にした操作を行える。<\/p><h3>コスト配分タグ<\/h3><ul><li>2種類：<b>AWS 生成タグ<\/b>（aws: で始まる。例 createdBy）と<b>ユーザー定義タグ<\/b>（user: で始まる）。<\/li><li>どちらも<b>Billing and Cost Management コンソールで有効化<\/b>しないと、Cost Explorer やコスト配分レポートに出てこない。反映には最大24時間。<\/li><li>組織では、コスト配分タグを管理できるのは<b>管理アカウント<\/b>（と、組織に入っていない単独アカウント）。<\/li><\/ul><h3>AWS Data Exports と CUR 2.0<\/h3><ul><li>AWS Data Exports：請求・コストのデータを、列を選んだり SQL で絞り込んだりして、定期的に S3 に出力する。<\/li><li>出力の種類：Cost and Usage Report 2.0（CUR 2.0、詳細なコストと使用量の推奨の形式）、Cost Optimization Hub の推奨、FOCUS 形式、炭素排出量など。従来の CUR は「レガシー」扱い。<\/li><li>Amazon Quick（旧 QuickSight）と連携した、出来合いのコストのダッシュボードも作れる。<\/li><\/ul><h3>AWS Cost Explorer の数字<\/h3><ul><li>過去<b>13か月<\/b>分を見られ、今後<b>18か月<\/b>を予測。画面（UI）の利用は無料、API は1リクエストごとに料金。<\/li><\/ul><div class=\"mem\">Budgets は「見張って、知らせて、止める（アクション）」。タグは「付けただけでは出ない、有効化して出る」。<\/div>"}, {"s": 4, "t": "4.3 補足：無料利用枠（AWS Free Tier）の今の仕組み", "h": "<p>AWS のアカウントを作るとき、<b>無料アカウントプラン（Free account plan）<\/b>か<b>有料アカウントプラン（Paid account plan）<\/b>を選ぶ。<\/p><div class=\"tw\"><table><tr><th><\/th><th>無料アカウントプラン<\/th><th>有料アカウントプラン<\/th><\/tr><tr><td>向いている用途<\/td><td>試す、概念実証（PoC）<\/td><td>本番、クレジットを超える利用<\/td><\/tr><tr><td>クレジット<\/td><td colspan=\"2\">新規のお客様は作成時に100ドル。決められた活動をすると最大100ドル追加（合計最大200ドル）<\/td><\/tr><tr><td>請求<\/td><td>有料プランにアップグレードしない限り請求されない<\/td><td>クレジットを超えた分、クレジットが効かないサービスは通常の従量課金<\/td><\/tr><tr><td>期間<\/td><td><b>6か月<\/b>か<b>クレジットを使い切る<\/b>か、早いほうで終わる<\/td><td>—<\/td><\/tr><tr><td>使えるサービス<\/td><td>一部のサービスだけ（クレジットをすぐ使い切るサービスやハードウェアの購入は不可）<\/td><td>すべて<\/td><\/tr><tr><td>無料の枠<\/td><td>Always Free（常に無料）<\/td><td>Always Free と短期の無料トライアル<\/td><\/tr><\/table><\/div><p><b>Always Free<\/b>：30以上のサービスに、毎月の無料の利用枠がある（例：AWS Lambda は月100万リクエストと40万 GB 秒）。<\/p><p>無料プランが終わると、アカウントは停止され、リソースとデータに触れなくなる。AWS はデータを<b>90日<\/b>保持し、その間に有料プランへアップグレードすれば戻せる。しなければ消去される。<\/p><div class=\"warn\">引っかけ注意：「無料プランが終わると自動で有料プランに切り替わって課金される」は誤り。自分でアップグレードしない限り請求はない。古い本の「12か月無料」の説明は、この新しい仕組みより前のもの。<\/div>"}, {"s": 4, "t": "4.3 補足：サポートプランの細部と Health API・Trusted Advisor", "h": "<div class=\"tw\"><table><tr><th>聞かれること<\/th><th>答え<\/th><\/tr><tr><td>Basic で使えるもの<\/td><td>請求・アカウントの質問への1対1の回答、サービスクォータの引き上げ、フォーラム（re:Post）、ドキュメント、AWS Health Dashboard、Trusted Advisor の一部のチェック<\/td><\/tr><tr><td>Basic の Trusted Advisor<\/td><td>サービスの上限（Service Limits）カテゴリのすべてのチェックと、セキュリティ・耐障害性カテゴリの一部のチェック。自動更新はない<\/td><\/tr><tr><td>Trusted Advisor のすべてのチェックと Trusted Advisor API<\/td><td>Business Support+ 以上<\/td><\/tr><tr><td>AWS Health API<\/td><td>Business Support+ 以上（それ以外から呼ぶとエラー）<\/td><\/tr><tr><td>Business Support+ の料金<\/td><td><b>アカウントごと<\/b>に、月29ドルか利用額の割合（9%から段階的に下がる）の高いほう<\/td><\/tr><tr><td>Enterprise Support<\/td><td>月5,000ドル〜。専任の TAM、本番の重大な障害に15分以内、<b>AWS Security Incident Response を追加料金なしで利用可<\/b>、戦略的なビジネスレビュー、AWS Countdown<\/td><\/tr><tr><td>Unified Operations<\/td><td>月50,000ドル〜。TAM に加えてドメインスペシャリストエンジニア（DSE）、インシデント管理エンジニアによる5分以内の対応、AWS Countdown Premium、重要ワークロードのレビュー<\/td><\/tr><tr><td>旧プランの扱い<\/td><td>Developer と Business は2027年1月1日で終了（それまでに Business Support+ へ）。Enterprise On-Ramp は2026年中に順に Enterprise Support へ自動で移行し、2027年1月1日で終了<\/td><\/tr><\/table><\/div><div class=\"mem\">API で取りたい（Health API、Trusted Advisor API、Support API）→ 最低 Business Support+。TAM → Enterprise Support。専門分野のエンジニアと最速の対応 → Unified Operations。<\/div>"}, {"s": 0, "t": "最新：2026年の試験ガイドの変更点", "h": "<p>CLF-C02 の試験ガイドは 2026年に作り直され、改訂履歴（Revisions）のページには次の4つの版が載っている。<\/p><div class=\"tw\"><table><tr><th>版<\/th><th>公開日<\/th><\/tr><tr><td>1.0<\/td><td>2026-06-24<\/td><\/tr><tr><td>1.1<\/td><td>2026-08-28<\/td><\/tr><tr><td>1.2<\/td><td>2026-09-24<\/td><\/tr><tr><td>1.3<\/td><td>2026-10-29<\/td><\/tr><\/table><\/div><p>改訂履歴のページは「版と公開日」だけを載せており、版ごとに何を変えたかの説明はない。はっきり書かれている変更は、<b>範囲外サービス一覧から外されたサービス<\/b>（Amazon Elastic Transcoder、AWS Elemental MediaStore、Amazon Lookout for Metrics、Amazon Lumberyard、Amazon Monitron、AWS Panorama、AWS RoboMaker、Amazon WorkDocs）だけ。これらは範囲内に入ったのではなく、一覧から消えただけ（多くは提供終了したサービス）。<\/p><p>また、公式は「試験ガイドの更新は、試験に反映される<b>約1か月前<\/b>に公開する」と書いている。改訂1.3（10月29日）の内容は11月下旬ごろから試験に反映される計算なので、11月16日の受験では1.2と1.3のどちらの内容でも答えられるように、旧名と新名の両方を知っておくのが安全。<\/p><p><b>今の試験ガイド（1.3）で押さえる点<\/b><\/p><ul><li>試験の形：採点される問題50問＋採点されない問題15問＝65問。単一選択（正解1つ＋誤答3つ）と複数選択（5つ以上から2つ以上）。未回答は不正解で、推測の減点なし。100〜1000点で700点以上が合格。分野ごとの合格点はなく、全体で合否が決まる（補償型）。<\/li><li>配点：D1 クラウドの概念 24%、D2 セキュリティとコンプライアンス 30%、D3 クラウドのテクノロジーとサービス 34%、D4 請求・料金・サポート 12%。<\/li><li>サービス名が新しい名前で書かれている：<b>Amazon Quick<\/b>（旧 QuickSight）、<b>Amazon SageMaker AI<\/b>、<b>Amazon WorkSpaces Secure Browser<\/b>、<b>AWS Health Dashboard<\/b>、<b>AWS IAM Identity Center<\/b>。<\/li><li>D4 のサポートプランの例が <b>Basic Support、AWS Business Support+、AWS Enterprise Support、AWS Unified Operations<\/b> になった。Developer Support と Business Support（旧）と Enterprise On-Ramp は 2027-01-01 に終了（AWS GovCloud (US) では継続）。<\/li><li>D4 4.3 に「AWS Trust and Safety チームへの不正利用の報告」「AWS Health API」「AWS Marketplace が提供する主な機能（コスト管理、ガバナンス、権利の管理）」「AWS Professional Services、AWS ソリューションアーキテクト」などが並ぶ。<\/li><li>D3 3.7 の例は Amazon SageMaker AI、Amazon Lex、Amazon Athena、Amazon Kinesis、AWS Glue、Amazon Quick。範囲内の機械学習には <b>Amazon Q<\/b> も入っている。<\/li><li>D3 3.8 に、エンドユーザーコンピューティング（Amazon AppStream 2.0、Amazon WorkSpaces、Amazon WorkSpaces Secure Browser）、AWS Amplify、AWS IoT Core、Amazon Connect、Amazon SES、AWS CodeBuild、AWS CodePipeline、AWS X-Ray が明記されている。<\/li><\/ul><div class=\"warn\">引っかけ注意：範囲外の一覧には AWS CodeDeploy、AWS CloudShell、Amazon Personalize、Amazon Fraud Detector、AWS Wavelength、AWS Network Firewall、Amazon FSx for Lustre、AWS Transfer Family などがある。これらは正解になりにくい。逆に Amazon Bedrock は範囲内一覧に名前がない（Amazon Q は範囲内）。<\/div><div class=\"warn\">補足：Amazon WorkSpaces Secure Browser は 2026-10-29 から新規のお客様の受け付けを止めた（既存のお客様は使い続けられる）。試験ガイドにはまだ範囲内として載っているので、「Web ブラウザだけを安全に配信するサービス」として覚えておく。また Amazon AppStream 2.0 は、AWS の製品ページで Amazon WorkSpaces Applications（旧 AppStream 2.0）と書かれるようになった。試験ガイドは AppStream 2.0 の名前のまま。<\/div><div class=\"mem\">覚え方：試験ガイドは「名前は新しく、中身はほぼ同じ」。旧名で覚えた知識は、新名に置き換えればそのまま使える。<\/div>"}, {"s": 0, "t": "公式の無料・有料の学習リソース", "h": "<p>AWS 公式の CLF-C02 の対策は、AWS Skill Builder の「Exam Prep Plan（4ステップの対策プラン）」にまとまっている。無料と有料（サブスクリプション）を区別して使う。問題の中身は公式のものなので、このツールには写していない。各自で解くこと。<\/p><div class=\"tw\"><table><tr><th>名前<\/th><th>中身<\/th><th>無料／有料<\/th><th>公式 URL<\/th><\/tr><tr><td>試験ガイド（CLF-C02）<\/td><td>配点、分野と課題、範囲内・範囲外のサービス一覧、改訂履歴<\/td><td>無料<\/td><td>https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html<\/td><\/tr><tr><td>認定試験のページ<\/td><td>試験の料金（100 USD）、90分、65問、日本語を含む対応言語、Pearson VUE のテストセンターかオンライン監督<\/td><td>無料<\/td><td>https://aws.amazon.com/certification/certified-cloud-practitioner/<\/td><\/tr><tr><td>Exam Prep Plan（AWS Skill Builder）<\/td><td>公式の4ステップ（試験を知る→知識を補う→復習と練習→準備度の確認）の入口<\/td><td>無料のものと有料のものが混在<\/td><td>https://skillbuilder.aws/category/exam-prep/cloud-practitioner-foundational-CLF-C02<\/td><\/tr><tr><td>AWS Certification Official Practice Question Set<\/td><td>AWS が作った20問の問題セット。本番の形式に慣れる。解説とおすすめ教材つき<\/td><td>無料<\/td><td>上の Skill Builder から<\/td><\/tr><tr><td>AWS Certification Official Pretest<\/td><td>弱点を見つけるための事前テスト<\/td><td>公式ページに料金の記載なし（Skill Builder で確認）<\/td><td>上の Skill Builder から<\/td><\/tr><tr><td>Exam Prep コース（無料版）<\/td><td>約2時間のデジタルコース。分野ごとの要点と、サンプル問題の解説<\/td><td>無料<\/td><td>上の Skill Builder から<\/td><\/tr><tr><td>Exam Prep コース（強化版）<\/td><td>6〜8時間の動画、ハンズオンラボ、追加の練習問題、Official Practice Exam を含む<\/td><td>有料（サブスクリプション）<\/td><td>上の Skill Builder から<\/td><\/tr><tr><td>AWS Certification Official Practice Exam<\/td><td>本番と同じ形式と難しさの模擬試験。合否の判定と、選択肢ごとの解説<\/td><td>有料（サブスクリプション）<\/td><td>上の Skill Builder から<\/td><\/tr><tr><td>AWS Cloud Quest<\/td><td>ゲーム形式で、実際の課題をクラウドで解きながら学ぶ。基本の役割は無料、Solutions Architect などの追加の役割は有料<\/td><td>一部無料<\/td><td>https://aws.amazon.com/training/digital/aws-cloud-quest/<\/td><\/tr><tr><td>AWS Builder Labs、AWS Jam、AWS SimuLearn、AWS Escape Room<\/td><td>手を動かす練習<\/td><td>主に有料（サブスクリプション）<\/td><td>https://aws.amazon.com/certification/certification-prep/<\/td><\/tr><tr><td>AWS Training Live on Twitch<\/td><td>ライブとオンデマンドの講座<\/td><td>無料<\/td><td>https://twitch.tv/awstraininglive<\/td><\/tr><tr><td>サンプル問題 PDF<\/td><td>AWS が公開しているサンプル問題。ただし表紙は旧試験 CLF-C01 のもの。サービス名やサポートプランが古い可能性がある<\/td><td>無料<\/td><td>https://d1.awsstatic.com/training-and-certification/docs-cloud-practitioner/AWS-Certified-Cloud-Practitioner_Sample-Questions.pdf<\/td><\/tr><\/table><\/div><p>AWS Skill Builder の個人向けサブスクリプションは月 29 USD から（公式の試験対策ページの記載）。<\/p><div class=\"warn\">注意：サンプル問題 PDF は CLF-C01 用。サポートプラン（Developer、Business、Enterprise On-Ramp）やサービス名（QuickSight など）が今の試験と違うことがあるので、答えを覚えるのではなく考え方だけを使う。<\/div><div class=\"mem\">おすすめの順番：無料の Practice Question Set で形式を知る → このツールで弱点を補う → 余裕があれば有料の Official Practice Exam で最終確認。<\/div>"}]);
READ.push(...[{"s": 2, "t": "2.x 補足：よく出るセキュリティの略語10個", "h": "<p>セキュリティの問題でよく出る略語を10個にしぼった。正式名を日本語に直すと、中身がわかるものが多い。わからない略語が出たら、まずこの表と「用語集」タブを見る。<\/p><div class=\"tw\"><table><tr><th>略語<\/th><th>正式名（日本語）<\/th><th>ひとことで<\/th><th>問題文の合図<\/th><\/tr><tr><td><b>IAM<\/b><\/td><td>Identity and Access Management<br>（ID とアクセスの管理）<\/td><td>誰が何をしてよいかを決める（ユーザー・ロール・ポリシー）<\/td><td>「権限」「アクセス」<\/td><\/tr><tr><td><b>MFA<\/b><\/td><td>Multi-Factor Authentication<br>（多要素認証）<\/td><td>パスワードに加えて、スマホのコードなどでも本人確認する<\/td><td>「サインインを強く」<\/td><\/tr><tr><td><b>SCP<\/b><\/td><td>Service Control Policy<br>（サービスコントロールポリシー（サービスの利用を制御する方針））<\/td><td>会社全体（Organizations）で「ここまでしか使えない」と上限を決める。権限は与えない<\/td><td>「全アカウントで禁止」<\/td><\/tr><tr><td><b>KMS<\/b><\/td><td>Key Management Service<br>（鍵の管理サービス）<\/td><td>データにかける鍵を作って、しまっておく<\/td><td>「暗号化の鍵」<\/td><\/tr><tr><td><b>HSM<\/b><\/td><td>Hardware Security Module<br>（ハードウェアのセキュリティ装置）<\/td><td>鍵を守る専用の機械（CloudHSM）<\/td><td>「専用ハードウェア」<\/td><\/tr><tr><td><b>ACM<\/b><\/td><td>AWS Certificate Manager<br>（証明書の管理人）<\/td><td>Web サイトの証明書（https の鍵マーク）を無料で発行し、自動で更新する<\/td><td>「証明書」「HTTPS」<\/td><\/tr><tr><td><b>TLS<\/b><\/td><td>Transport Layer Security<br>（通信の層のセキュリティ）<\/td><td>通信を暗号化するしくみ（昔の名前は SSL）。https はこれを使う<\/td><td>「通信中の暗号化」<\/td><\/tr><tr><td><b>WAF<\/b><\/td><td>Web Application Firewall<br>（Web アプリの防火壁）<\/td><td>Web アプリへの攻撃（SQL インジェクションなど）を止める<\/td><td>「SQL インジェクション」<\/td><\/tr><tr><td><b>DDoS<\/b><\/td><td>Distributed Denial of Service<br>（分散型サービス妨害）<\/td><td>大量の通信でサイトを落とす攻撃。守るのは AWS Shield<\/td><td>「大量の通信」「サイトが落ちる」<\/td><\/tr><tr><td><b>PII<\/b><\/td><td>Personally Identifiable Information<br>（個人を特定できる情報）<\/td><td>個人を特定できる情報（氏名・カード番号など）。S3 の中から見つけるのは Macie<\/td><td>「個人情報」<\/td><\/tr><\/table><\/div><p>まぎらわしい組：KMS＝鍵、ACM＝証明書。WAF＝Web アプリへの攻撃、DDoS は Shield。<\/p>"}]);
QS.push(...[{"s": 1, "q": "ある会社の開発環境とテスト環境は、平日の業務時間（1日8時間）しか使われていないのに、24時間動き続けている。AWS Well-Architected フレームワークのコスト最適化の柱で、この無駄をなくす考え方に最もよく当てはまる設計原則はどれか。", "o": ["支出を分析して帰属させる", "消費モデルを採用する", "全体的な効率を測定する", "クラウド財務管理を実装する"], "a": [1], "e": "<b>正解：消費モデルを採用する<\/b>。合図は「使う時間だけ」。使った分だけ払い、使わないときは止める。AWS の例では、週40時間だけ動かせば168時間のうち約75％を節約できる。<br>×支出を分析して帰属させる：誰がどれだけ使ったかを明らかにする原則。止めることではない。<br>×全体的な効率を測定する：ビジネスの成果とコストの関係を測る原則。<br>×クラウド財務管理を実装する：組織として財務管理の能力を育てる原則。<div class=\"mem\">「使うときだけ動かす」＝消費モデル。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/design-principles.html"}, {"s": 1, "q": "ある会社では、複数の製品チームが1つの AWS 環境を使っており、どのチームがどれだけ費用を使っているか分からない。各チームのコストを明らかにし、投資利益率（ROI）を測れるようにしたい。AWS Well-Architected フレームワークのどの設計原則に最もよく当てはまるか。", "o": ["消費モデルを採用する", "差別化につながらない重労働にお金を使わない", "支出を分析して帰属させる", "容量の推測をやめる"], "a": [2], "e": "<b>正解：支出を分析して帰属させる<\/b>（コスト最適化の柱）。合図は「どのチームが」「ROI」。コストと使用量を正確に把握し、ワークロードの所有者や収益源にひも付ける。<br>注意：消費モデル・重労働・支出の帰属の3つは<b>どれもコスト最適化の柱の設計原則</b>。柱を当てても決まらず、「どの原則か」を合図で選ぶ問題。<br>×消費モデルを採用する：コスト最適化の原則だが、中身は「使う時間・量だけ払う」（例：開発環境を業務時間だけ動かす）。誰が使ったかを分ける話ではない。<br>×差別化につながらない重労働：同じくコスト最適化の原則。データセンターや OS の管理を AWS に任せる話。<br>×容量の推測をやめる：柱ではなく一般的な設計原則。容量を自動で増減する話。<br>覚え方：「誰が・どのチームが・ROI」→帰属、「使う時間だけ・止める」→消費モデル。", "trap": "", "src": "https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/design-principles.html"}, {"s": 1, "q": "ある会社は、大きなサーバー1台でアプリケーションを動かしており、そのサーバーが故障するとサービス全体が止まる。AWS Well-Architected フレームワークの信頼性の柱にもとづく改善として、最も適切なものはどれか。", "o": ["より大きなインスタンスタイプに変更して、処理能力に余裕を持たせる", "大きいリソース1台を小さいリソース複数台に置き換え、リクエストを分散する", "サーバーの CPU 使用率を毎日手作業で確認する", "サーバーを停止して、使うときだけ起動する"], "a": [1], "e": "<b>正解：小さいリソース複数台に置き換えて分散する<\/b>。信頼性の設計原則「水平方向にスケールして、ワークロード全体の可用性を上げる」。1台の故障の影響を小さくし、共通の障害点をなくす。<br>×大きなインスタンスに変更：1台のままなので、故障すれば止まる（垂直方向のスケール）。<br>×手作業で確認：自動化（障害から自動で回復する）の考え方に反する。<br>×使うときだけ起動：コストの話で、故障への強さは上がらない。", "trap": "TRAP 03", "src": "https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html"}, {"s": 1, "q": "ある小売企業は、需要予測に機械学習を使いたいが、社内に機械学習の専門家がいない。インフラの準備や管理ではなく製品開発に集中したい。AWS Well-Architected フレームワークのパフォーマンス効率の柱で、この考え方に最もよく当てはまる設計原則はどれか。", "o": ["高度なテクノロジーの民主化", "メカニカルシンパシーを考慮する", "すべての層にセキュリティを適用する", "変更を自動化で管理する"], "a": [0], "e": "<b>正解：高度なテクノロジーの民主化<\/b>。合図は「専門家がいない」「サービスとして使う」。NoSQL、メディアの変換、機械学習のように専門知識が必要な技術を、クラウドのサービスとして使う。<br>×メカニカルシンパシー：データのアクセスパターンなど、目的に合う技術を選ぶ原則。<br>×すべての層にセキュリティ：セキュリティの柱。<br>×変更を自動化で管理：信頼性の柱。", "trap": "", "src": "https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/design-principles.html"}, {"s": 1, "q": "ある医療機関では、担当者が患者データを直接開いて手作業で集計しており、誤操作や漏えいが心配されている。AWS Well-Architected フレームワークのセキュリティの柱にもとづく対策として、最も適切なものはどれか。", "o": ["担当者全員に管理者権限を与えて、作業を速くする", "データへの直接アクセスと手作業の処理を減らす仕組みやツールを使う", "データを暗号化すれば、誰が直接アクセスしてもよいとする", "集計作業をすべてオンプレミスに戻す"], "a": [1], "e": "<b>正解：直接アクセスと手作業を減らす仕組みを使う<\/b>。セキュリティの設計原則「人をデータから遠ざける（Keep people away from data）」。取り扱いの誤り、改ざん、人為的ミスのリスクを下げる。<br>×全員に管理者権限：最小権限の原則に反する。<br>×暗号化すれば誰でもよい：暗号化は大切だが、アクセスの管理の代わりにはならない（半分だけ正しい）。<br>×オンプレミスに戻す：手作業のリスクは解決しない。", "trap": "", "src": "https://docs.aws.amazon.com/wellarchitected/latest/framework/sec-design.html"}, {"s": 1, "q": "ある開発チームは、数か月分の変更を年に数回まとめてリリースしている。リリースで障害が起きると影響が大きく、元に戻すのにも時間がかかる。AWS Well-Architected フレームワークの運用上の優秀性の柱にもとづく改善として、最も適切なものはどれか。", "o": ["リリースの回数をさらに減らし、1回のテストを長くする", "小さく、頻繁に、元に戻せる変更を自動でデプロイする", "本番環境の変更は、すべて手作業で慎重に行う", "障害が起きたときだけ手順書を見直す"], "a": [1], "e": "<b>正解：小さく、頻繁に、元に戻せる変更<\/b>。小さな変更を自動でデプロイすると、障害の影響範囲（ブラストラジアス）が小さくなり、すぐに元に戻せる。<br>×回数を減らす：1回の変更が大きくなり、逆効果。<br>×すべて手作業：運用上の優秀性は「安全に自動化する」。<br>×障害のときだけ見直す：手順はこまめに見直し、すべての運用上のイベントから学ぶ。", "trap": "", "src": "https://docs.aws.amazon.com/wellarchitected/latest/framework/oe-design-principles.html"}, {"s": 1, "q": "AWS Well-Architected フレームワークの一般的な設計原則（General design principles）に含まれるものはどれか。", "o": ["本番と同じ規模でテストする", "ゲームデーで改善する", "最初に決めた設計は、システムの寿命まで変えない", "容量は、予想される最大の需要に合わせて事前に購入する", "障害の訓練は本番に影響するので行わない"], "a": [0, 1], "e": "<b>正解：本番と同じ規模でテストする、ゲームデーで改善する<\/b>。クラウドなら本番規模のテスト環境を必要なときだけ作り、動かした分だけ払う。ゲームデーで本番の出来事を模した訓練を定期的に行う。<br>×設計を変えない：逆。「進化するアーキテクチャを考える」が原則。<br>×最大の需要に合わせて事前購入：逆。「容量の推測をやめる」が原則。<br>×訓練は行わない：逆。ゲームデーで訓練する。<div class=\"mem\">一般的な設計原則は6つ：容量の推測をやめる／本番規模でテスト／実験を前提に自動化／進化するアーキテクチャ／データで設計／ゲームデー。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/wellarchitected/latest/framework/general-design-principles.html"}, {"s": 1, "q": "ある会社は、AWS Well-Architected フレームワークの持続可能性の柱にもとづいて、ワークロードの環境への影響を減らしたい。この柱の考え方に合う対策はどれか。", "o": ["サーバーレスのコンテナに AWS Fargate などのマネージドサービスを使う", "めったに使わないデータを S3 ライフサイクル設定で自動的にコールドストレージへ移す", "急な需要に備えて、使っていないサーバーを常に起動しておく", "新しいサービスを使うために、利用者に端末の買い替えを求める", "処理に余裕を持たせるため、常に最も大きいインスタンスタイプを選ぶ"], "a": [0, 1], "e": "<b>正解：マネージドサービスを使う、S3 ライフサイクルでコールドストレージへ<\/b>。どちらも、持続可能性の設計原則「マネージドサービスを使う」の例として AWS が挙げているもの。<br>○Fargate などのマネージドサービス：多くの利用者で同じインフラを共有するので、機械が遊ばずに済む（＝使用率が上がる）。<br>○S3 ライフサイクルでコールドストレージへ：めったに使わないデータを、エネルギー効率のよい保管先へ自動で移す。<br>×使っていないサーバーを常に起動：遊んでいるサーバーが電気を使い続ける。原則「使用率を最大化する」に反する。<br>×端末の買い替えを求める：原則「利用者側（下流）の影響を減らす」に反する（買い替えは資源を増やす）。<br>×常に最も大きいインスタンス：余った能力が遊ぶ。原則「使用率を最大化する」に反する。「常に」の言い切りも×の合図。<div class=\"warn\">「使用率を最大化する」は選択肢ではなく、×の選択肢を落とすための物差し。この問題では、遊ぶ資源を増やす選択肢（常時起動、常に最大）がそれに反する。<\/div><div class=\"mem\">持続可能性の6原則：影響を理解する／目標を決める／使用率を最大化する／新しい効率のよいものを取り入れる／マネージドサービスを使う／下流の影響を減らす。30％で動く2台より、60％で動く1台のほうがエネルギー効率がよい（AWS の例）。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/wellarchitected/latest/sustainability-pillar/design-principles-for-sustainability-in-the-cloud.html"}, {"s": 1, "q": "AWS Well-Architected フレームワークのセキュリティの柱の設計原則として、正しいものはどれか。", "o": ["ネットワークの端だけでなく、すべての層にセキュリティを適用する", "インシデント対応の手順を用意し、シミュレーションで訓練してセキュリティイベントに備える", "管理を簡単にするため、長期間使える固定の認証情報を中心にする", "保存中のデータだけを保護し、転送中のデータは保護しない", "セキュリティの設定は、自動化せず担当者が都度手作業で行う"], "a": [0, 1], "e": "<b>正解：すべての層に適用、セキュリティイベントに備える<\/b>。<br>×長期間使える固定の認証情報：逆。強固なアイデンティティ基盤では、長期の静的な認証情報に頼らないことを目指す。<br>×保存中だけ：転送中と保存中の両方を保護する。<br>×手作業：セキュリティのベストプラクティスを自動化する。<div class=\"mem\">セキュリティの7原則：アイデンティティ基盤／トレーサビリティ／すべての層／自動化／転送中と保存中のデータ保護／人をデータから遠ざける／イベントに備える。<\/div>", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/wellarchitected/latest/framework/sec-design.html"}, {"s": 1, "q": "ある会社は AWS クラウド導入フレームワーク（AWS CAF）にそって移行を進めている。いくつかの優先度の高い取り組みを本番環境でパイロットとして動かし、段階的にビジネス価値を示している段階である。どのフェーズか。", "o": ["構想（Envision）", "調整（Align）", "立ち上げ（Launch）", "拡大（Scale）"], "a": [2], "e": "<b>正解：立ち上げ（Launch）<\/b>。合図は「パイロット」「本番で」「段階的な価値」。パイロットから学び、全面展開の前にやり方を調整する。<br>×構想：機会を見つけて優先順位をつける最初の段階。<br>×調整：6つの観点で能力のギャップや懸念を洗い出す段階。<br>×拡大：パイロットを望む規模まで広げ、効果を持続させる段階。<div class=\"mem\">エ・ア・ラ・ス：描く → そろえる → 試す → 広げる。<\/div>", "trap": "", "src": "https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/your-cloud-transformation-journey.html"}, {"s": 1, "q": "ある会社は、AWS CAF の6つの観点にわたって、クラウドを使うための能力のギャップと、部門をまたぐ依存関係を洗い出している。関係者の懸念も集め、クラウドへの準備状況を高める計画を作ろうとしている。AWS CAF のどのフェーズか。", "o": ["拡大（Scale）", "立ち上げ（Launch）", "構想（Envision）", "調整（Align）"], "a": [3], "e": "<b>正解：調整（Align）<\/b>。合図は「能力のギャップ」「依存関係」「関係者の懸念」。<br>×構想：クラウドでビジネスの成果をどう早めるかを示し、変革の機会に優先順位をつける。<br>×立ち上げ：パイロットを本番で動かす。<br>×拡大：本番のパイロットを広げ、効果を持続させる。", "trap": "", "src": "https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/your-cloud-transformation-journey.html"}, {"s": 1, "q": "ある出版社は、クラウドを使って紙の本の販売とは別に、定額制の新しいデジタルサービスと収益モデルを作り、新しい顧客層に届けたい。AWS CAF の4つの変革ドメインのうち、これに最もよく当てはまるものはどれか。", "o": ["テクノロジー（Technology）", "プロセス（Process）", "組織（Organization）", "製品（Product）"], "a": [3], "e": "<b>正解：製品（Product）<\/b>。ビジネスモデルを作り直し、新しい価値提案（製品・サービス）と収益モデルを作る。<br>×テクノロジー：古いインフラやアプリを移行・モダナイズする。<br>×プロセス：業務をデジタル化・自動化・最適化する。<br>×組織：運営モデルを作り直し、製品や価値の流れに沿ってチームを組む。<br>合図：「新しいサービス」「収益モデル」「新しい顧客層」＝お客様に売るものが新しくなる＝製品。プロセスは「今ある社内の業務」を速く・自動にする話（例：受注の手作業をなくす）。<div class=\"warn\">「デジタル」という言葉だけでプロセスを選ばない。誰のための変化かを見る。社内の作業が変わる＝プロセス、お客様に届けるものが変わる＝製品。<\/div><div class=\"mem\">テクノロジー → プロセス → 組織 → 製品 の順に、前の変革が次を支える（価値の連鎖）。製品＝「何を売るか」、プロセス＝「どう働くか」。<\/div>", "trap": "", "src": "https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/accelerating-business-outcomes.html"}, {"s": 1, "q": "ある会社の最高財務責任者（CFO）は、クラウドの支出を計画・測定・最適化し、タグやコスト配分でチームごとの費用を見える化する取り組みを進めたい。この能力（クラウド財務管理）を含む AWS CAF の観点はどれか。", "o": ["ビジネス（Business）", "ガバナンス（Governance）", "運用（Operations）", "プラットフォーム（Platform）"], "a": [1], "e": "<b>正解：ガバナンス（Governance）<\/b>。クラウド財務管理（Cloud financial management）はガバナンス観点の能力。ほかにリスク管理、ベネフィット管理、プログラムとプロジェクト管理、データガバナンスなどがある。<br>×ビジネス：CFO は関係者に入るが、能力は戦略管理、ポートフォリオ管理、イノベーション管理など。<br>×運用：可観測性、インシデント管理、パッチ管理など。<br>×プラットフォーム：アーキテクチャ、CI/CD など。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/governance-perspective.html"}, {"s": 1, "q": "AWS CAF のセキュリティ観点（Security perspective）に含まれる能力（capability）はどれか。", "o": ["脅威検出（Threat detection）", "脆弱性管理（Vulnerability management）", "クラウド財務管理（Cloud financial management）", "可観測性（Observability）", "文化の進化（Culture evolution）"], "a": [0, 1], "e": "<b>正解：脅威検出、脆弱性管理<\/b>。セキュリティ観点にはほかに、セキュリティガバナンス、セキュリティ保証、アイデンティティとアクセス管理、インフラの保護、データ保護、アプリケーションセキュリティ、インシデント対応がある。<br>×クラウド財務管理：ガバナンス観点。<br>×可観測性：運用観点。<br>×文化の進化：人材観点。", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/whitepapers/latest/overview-aws-cloud-adoption-framework/security-perspective.html"}, {"s": 1, "q": "CLF-C02 の試験ガイドが、AWS CAF によって得られるものとして挙げているビジネス成果はどれか。", "o": ["ビジネスリスクの低減", "環境・社会・ガバナンス（ESG）パフォーマンスの向上", "すべてのセキュリティの責任を AWS に移すこと", "ソフトウェアのライセンス費用が必ずゼロになること", "すべてのアプリケーションをリファクタすること"], "a": [0, 1], "e": "<b>正解：ビジネスリスクの低減、ESG パフォーマンスの向上<\/b>。残りの2つは「収益の増加」と「運用効率の向上」。<br>×セキュリティの責任をすべて AWS に：責任共有モデル。お客様の責任は残る。<br>×ライセンス費用が必ずゼロ：言い切り。<br>×すべてリファクタ：移行戦略は 7R から選ぶ。成果ではない。<div class=\"mem\">成果は「リスク↓、ESG↑、収益↑、効率↑」。<\/div>", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html"}, {"s": 1, "q": "ある会社は移行の対象を整理している。ある業務アプリケーションは、法律でデータを国内の自社施設に置く必要があり、さらに先月大きなアップグレードをしたばかりである。このアプリケーションに最も適した移行戦略はどれか。", "o": ["リタイア（Retire）", "リテイン（Retain）", "リホスト（Rehost）", "リパーチェス（Repurchase）"], "a": [1], "e": "<b>正解：リテイン（Retain）<\/b>。今は元の環境に残す。データの所在地の要件や、最近アップグレードに投資したことは、AWS Prescriptive Guidance が挙げるリテインの典型的な理由。将来移すこともある。<br>×リタイア：ビジネス価値がなく、廃止する場合。<br>×リホスト：そのまま AWS に移す。要件に合わない。<br>×リパーチェス：SaaS などに買い替える。先月アップグレードに投資したばかりなのに、買い替えるのはもったいない。それに、SaaS ではデータを自社施設に置けない。<br>合図：「自社施設に置く必要」「最近アップグレードした」＝今は動かさない＝リテイン。<div class=\"mem\">Retain＝保つ（リテイナー＝歯並びを保つ器具）。Repurchase＝買い直す（purchase＝買う）。Retire＝引退（廃止）。</div>", "trap": "TRAP 04", "src": "https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"}, {"s": 1, "q": "ある会社の移行前の調査で、CPU とメモリの平均使用率が5％未満で、過去90日間どこからも接続がないサーバー群が見つかった。業務上の価値もないことが確認された。最も適切な移行戦略はどれか。", "o": ["リテイン（Retain）", "リロケート（Relocate）", "リタイア（Retire）", "リプラットフォーム（Replatform）"], "a": [2], "e": "<b>正解：リタイア（Retire）<\/b>。廃止・アーカイブする。使用率が極端に低いアプリ（ゾンビアプリ）や、90日間接続がないアプリはリタイアの候補。維持費とセキュリティのリスクもなくせる。<br>×リテイン：まだ移す準備ができていないなどで残す場合。価値がないなら残す理由がない。<br>×リロケート：仮想化基盤（VMware など）ごと、まとめて AWS へ引っ越す。使っていないものを引っ越すのはコストの無駄。<br>×リプラットフォーム：少し手を入れて移す（例：DB を RDS へ）。これも移す前提。<br>合図：「使用率5％未満」「90日間接続なし」「業務上の価値なし」＝誰も使っていない＝捨てる＝リタイア。<div class=\"mem\">リタイア＝引退（会社を辞める）。リロケート＝引っ越し（location＝場所を変える）。引退する人は引っ越しさせない。<\/div>", "trap": "TRAP 01", "src": "https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"}, {"s": 1, "q": "ある会社は、社内で独自に開発した顧客管理システムを使っているが、保守できる人が減っている。作り直すのではなく、同じ機能を持つ SaaS の製品に切り替えて、インフラの保守もやめたい。この移行戦略はどれか。", "o": ["リファクタ（Refactor）", "リパーチェス（Repurchase）", "リホスト（Rehost）", "リテイン（Retain）"], "a": [1], "e": "<b>正解：リパーチェス（Repurchase）<\/b>。「ドロップ＆ショップ」とも呼ばれる。独自アプリや従来のライセンス製品を SaaS などに置き換え、保守・インフラ・ライセンスの費用を減らす。<br>×リファクタ：自分でクラウドネイティブに作り直す。「作り直すのではなく」に反する。<br>×リホスト：同じアプリをそのまま移すだけで、保守は残る。<br>×リテイン：移さず残す。", "trap": "", "src": "https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"}, {"s": 1, "q": "ある会社は、オンプレミスの仮想化基盤で動く数百台のサーバーを、同じ基盤のクラウド版へまとめて移したい。新しいハードウェアの購入、アプリケーションの書き直し、今の運用方法の変更はしたくない。最も適切な移行戦略はどれか。", "o": ["リロケート（Relocate）", "リファクタ（Refactor）", "リパーチェス（Repurchase）", "リタイア（Retire）"], "a": [0], "e": "<b>正解：リロケート（Relocate）<\/b>。オンプレミスの基盤からクラウド版の基盤へ、大量のサーバーを一度に移す。アーキテクチャに影響しないので、移して動かすまでが最も速い。<br>×リファクタ：作り直すので書き直しが必要。<br>×リパーチェス：別の製品に買い替える。<br>×リタイア：廃止する。<div class=\"mem\">リホスト＝サーバーを1台ずつ「そのまま」EC2 へ。リロケート＝仮想化基盤ごと「引っ越し」。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"}, {"s": 1, "q": "ある大企業は、数百のアプリケーションをオンプレミスから AWS へ移したい。実績のある方法論、トレーニング、AWS Professional Services やパートナーの専門知識、初期の移行コストを相殺する資金面の支援をまとめて受けたい。最も適切なものはどれか。", "o": ["AWS Migration Hub", "AWS Migration Acceleration Program（MAP）", "AWS Well-Architected Tool", "AWS Marketplace"], "a": [1], "e": "<b>正解：AWS Migration Acceleration Program（MAP）<\/b>。評価（Assess）→ 準備（Mobilize）→ 移行とモダナイズ（Migrate and Modernize）の進め方で、ツール、トレーニング、専門家、資金面の支援を組み合わせる移行プログラム。<br>×Migration Hub：移行の進み具合を一か所で追跡する道具。資金やトレーニングの支援ではない。<br>×Well-Architected Tool：6つの柱で設計を点検するツール。<br>×Marketplace：サードパーティのソフトウェアを買う場所。", "trap": "TRAP 11", "src": "https://aws.amazon.com/migration-acceleration-program/"}, {"s": 1, "q": "ある会社は、1年以内に数百のアプリケーションを AWS に移す大規模な移行を計画している。AWS Prescriptive Guidance の推奨に合う進め方はどれか。", "o": ["変更せずに移すリホストを中心にし、移行が終わってからモダナイズする", "仮想化基盤ごと移すリロケートを使う", "移行と同時に、すべてのアプリケーションをクラウドネイティブにリファクタする", "すべてのアプリケーションをリテインし、移行を先送りする", "移行の前に、すべてのアプリケーションをマイクロサービスに分割する"], "a": [0, 1], "e": "<b>正解：リホスト中心で移行後にモダナイズ、リロケートを使う<\/b>。大規模な移行でよく使うのは、リホスト、リプラットフォーム、リロケート、リタイア。<br>×すべてリファクタ：最も複雑でコストがかかるため、大規模な移行では推奨されない。<br>×すべてリテイン：移行が進まない。言い切り。<br>×先にマイクロサービスへ分割：移行中のモダナイズ（リファクタ）にあたり、推奨されない。", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"}, {"s": 1, "q": "ある会社は、すでに購入済みの Microsoft と Oracle のライセンスを AWS で使い（BYOL）、ライセンスの使用数を複数のアカウントで追跡したい。契約の上限を超えるデプロイは、事前に止めたい。最も適切なサービスはどれか。", "o": ["AWS License Manager", "AWS Marketplace", "AWS Artifact", "AWS Budgets"], "a": [0], "e": "<b>正解：AWS License Manager<\/b>。ソフトウェアのライセンスを複数のリージョンとアカウントで管理し、ルールでハード／ソフトの上限を決めて、違反するサーバーの利用を事前に止める。<br>×Marketplace：ソフトウェアを買う場所。手持ちのライセンスの使用数の追跡ではない。<br>×Artifact：AWS のコンプライアンスレポートの入手。<br>×Budgets：金額の予算を超えそうなときに通知する。ライセンスの本数ではない。", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/license-manager/latest/userguide/license-manager.html"}, {"s": 1, "q": "あるスタートアップは、Windows Server のライセンスを持っていない。前払いや長期の契約をせず、使った分だけ払う形で Windows Server を Amazon EC2 で動かしたい。最も適切なライセンスの選び方はどれか。", "o": ["ライセンス込み（License Included）の EC2 インスタンスを使う", "BYOL のために Amazon EC2 Dedicated Hosts を購入する", "AWS License Manager でライセンスを無料で発行してもらう", "Windows Server はクラウドではライセンスが不要なので、何もしなくてよい"], "a": [0], "e": "<b>正解：ライセンス込みの EC2 インスタンス<\/b>。AWS がライセンスを用意し、インスタンスの料金に含まれる。前払いも長期の約束もいらない従量課金。<br>×Dedicated Hosts で BYOL：手持ちのライセンスがある場合の選択肢。持っていないので合わない。<br>×License Manager で無料発行：License Manager はライセンスの管理と追跡のサービス。発行はしない。<br>×ライセンスが不要：ライセンスは必要。料金に含まれているだけ。", "trap": "TRAP 12", "src": "https://aws.amazon.com/windows/resources/licensing/"}, {"s": 1, "q": "ある製造業の会社は、工場の機器とつながる生産管理システムをオンプレミスに残したまま、新しい分析の仕組みを AWS に作り、両者をつないで使いたい。このデプロイモデルはどれか。", "o": ["クラウド（すべてクラウドで動かす）", "ハイブリッド", "オンプレミス（プライベートクラウド）", "サーバーレス"], "a": [1], "e": "<b>正解：ハイブリッド<\/b>。クラウドの資源と、クラウドにない既存の資源（主にオンプレミス）をつなぐ。オンプレミスを拡張してクラウドへ広げる最も一般的な形。<br>×クラウド：アプリのすべての部分がクラウドで動く。<br>×オンプレミス（プライベートクラウド）：自社の仮想化だけで、AWS を使わない。<br>×サーバーレス：デプロイモデルではなく、サーバーを管理しない作り方。", "trap": "", "src": "https://docs.aws.amazon.com/whitepapers/latest/aws-overview/types-of-cloud-computing.html"}, {"s": 1, "q": "ある会社のデータベース管理者は、データベースサーバーのラック設置、OS とデータベースのパッチ当て、バックアップの作業に多くの時間を取られ、新しい機能の開発が進まない。AWS のクラウドの経済性の考え方として、最も適切な対応はどれか。", "o": ["Amazon RDS などのマネージドサービスに移し、差別化につながらない重労働を AWS に任せる", "より高性能な物理サーバーを購入して、作業の回数を減らす", "マネージドサービスに移せば、データとアクセス権限の管理も不要になる", "データベース管理者を増やして、作業を分担する"], "a": [0], "e": "<b>正解：マネージドサービスに移す<\/b>。コスト最適化の設計原則「差別化につながらない重労働にお金を使わない」と、6つの利点の「データセンターの運用と保守にお金をかけない」に当たる。人は顧客とビジネスに集中できる。<br>×物理サーバーを買う：固定費が増え、作業もなくならない。<br>×データと権限も不要：言い切り。責任共有モデルで、データとアクセスはお客様の責任。<br>×人を増やす：運用コストが増えるだけ。", "trap": "TRAP 02", "src": "https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/design-principles.html"}, {"s": 2, "q": "ある会社は、顧客の注文データを Amazon S3 と Amazon DynamoDB に保存している。AWS 責任共有モデルで、この会社（お客様）の責任に含まれるものはどれか。", "o": ["保存するデータの暗号化の方法を選び、管理すること", "IAM を使って、データにアクセスできる人に適切な権限を付けること", "S3 と DynamoDB を動かすサーバーの OS にパッチを当てること", "DynamoDB のプラットフォーム（DB ソフトウェア）を運用すること", "S3 のデータを保管する施設の入退室を管理すること"], "a": [0, 1], "e": "<b>正解：暗号化の方法を選んで管理する、IAM で適切な権限を付ける<\/b>。合図は「S3」「DynamoDB」（抽象化されたサービス）。<br>×サーバーの OS のパッチ：S3 や DynamoDB では、インフラ・OS・プラットフォームは AWS が運用する。<br>×DynamoDB のプラットフォームの運用：同じく AWS。<br>×施設の入退室：物理的なセキュリティは常に AWS。<div class=\"mem\">抽象化されたサービスでも、データ（暗号化・分類）と権限（IAM）は必ずお客様に残る。<\/div>", "trap": "TRAP 05", "src": "https://aws.amazon.com/compliance/shared-responsibility-model/"}, {"s": 2, "q": "AWS 責任共有モデルで、AWS とお客様がそれぞれの範囲で責任を持つ「共有コントロール」の例として、最も適切なものはどれか。", "o": ["意識向上とトレーニング（AWS は AWS の社員を、お客様は自社の社員を教育する）", "データセンターの物理的・環境的なコントロール", "特定のセキュリティ環境の中でのデータの経路や置き場所の管理", "AWS のハードウェアの廃棄"], "a": [0], "e": "<b>正解：意識向上とトレーニング<\/b>。公式の共有コントロールの例は、パッチ管理、設定管理、意識向上とトレーニングの3つ。<br>×物理的・環境的なコントロール：お客様が AWS から丸ごと引き継ぐ「継承されるコントロール」。<br>×データの経路や置き場所（ゾーンのセキュリティ）：お客様だけが担う「お客様固有のコントロール」。自分のデータをどこに置き、どこを通すかは、お客様が自分で決めること。「特定の」は「お客様ごとに違う」の合図。<br>×ハードウェアの廃棄：AWS だけの責任。<br>3つの分け方：<b>継承</b>＝AWS がやって、お客様はそのまま受け取る（物理・環境）。<b>共有</b>＝同じテーマを両方がそれぞれの範囲でやる（パッチ、設定、教育）。<b>お客様固有</b>＝お客様だけ（データの経路・置き場所）。<div class=\"mem\">共有＝同じテーマを2人で分ける。教育は、それぞれが自分の社員を教える。<\/div>", "trap": "TRAP 05", "src": "https://aws.amazon.com/compliance/shared-responsibility-model/"}, {"s": 2, "q": "ある会社の監査担当者が、「データセンターの建物や電源・空調などの統制は、AWS のものをそのまま引き継ぐ」と説明している。AWS 責任共有モデルで、このようなコントロールを何と呼ぶか。", "o": ["継承されるコントロール（Inherited Controls）", "共有コントロール（Shared Controls）", "お客様固有のコントロール（Customer Specific Controls）", "予防的コントロール（Preventive Controls）"], "a": [0], "e": "<b>正解：継承されるコントロール<\/b>。合図は「そのまま引き継ぐ」。公式の例は物理的・環境的なコントロール。<br>×共有コントロール：パッチ管理のように、両者がそれぞれの範囲で担うもの。<br>×お客様固有のコントロール：お客様だけが担うもの。<br>×予防的コントロール：問題を起こさせないための統制の分類で、責任共有モデルの3分類ではない。", "trap": "TRAP 05", "src": "https://aws.amazon.com/compliance/shared-responsibility-model/"}, {"s": 2, "q": "ある会社は、Amazon EC2 インスタンスに自分で MySQL を入れて運用している。これを Amazon RDS for MySQL に移す。移行後に、お客様の作業から AWS の作業に移るものはどれか。", "o": ["DB エンジン（MySQL）へのパッチの適用", "DB が動く OS へのパッチの適用", "DB に接続できる IP アドレスやインスタンスを決めるセキュリティグループの設定", "DB の中のユーザーと、その権限の管理", "保存時の暗号化を使うかどうかの判断"], "a": [0, 1], "e": "<b>正解：DB エンジンのパッチ、OS のパッチ<\/b>。RDS はマネージドなので、OS と DB エンジンの面倒は AWS が見る。<br>×セキュリティグループの設定：RDS でもどこから接続を許すかを決めるのはお客様。<br>×DB の中のユーザーと権限：DB エンジンのセキュリティ機能を使って、お客様が管理する。<br>×保存時の暗号化を使うか：RDS が暗号化の機能を提供し、使うかどうかはお客様が決める。<div class=\"mem\">EC2 から RDS へ＝「下の階（OS・エンジン）」だけ AWS に渡る。「入口（接続の許可）」「中身（データ・DB ユーザー）」は自分のまま。<\/div>", "trap": "TRAP 05", "src": "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.html"}, {"s": 2, "q": "ある会社は、AWS Lambda 関数を、マネージドランタイムではなくコンテナイメージとしてデプロイしている。ランタイムに新しいセキュリティパッチが出たとき、お客様の責任として最も適切なものはどれか。", "o": ["最新のベースイメージから関数のコンテナイメージを作り直し、再デプロイする", "何もしなくてよい。Lambda がすべての関数のコンテナイメージを自動で作り直す", "Lambda が動く物理サーバーのファームウェアを更新する", "パッチが出るたびに AWS サポートに連絡して適用を依頼する"], "a": [0], "e": "<b>正解：最新のベースイメージから作り直して再デプロイする<\/b>。Lambda はパッチを含む新しいベースイメージを公開するところまで。<br>×何もしなくてよい：自動で適用されるのは、マネージドランタイムで自動更新（Auto）モードの関数。コンテナイメージは対象外。<br>×物理サーバーのファームウェア：AWS の責任。<br>×サポートに依頼：そういう仕組みではない。<div class=\"mem\">同じ Lambda でも、コンテナイメージを選ぶとお客様の担当が増える。「サービスの使い方で責任が動く」の例。<\/div>", "trap": "TRAP 05", "src": "https://docs.aws.amazon.com/lambda/latest/dg/runtime-management-shared.html"}, {"s": 2, "q": "セキュリティの点検で、ある Amazon EC2 インスタンスのセキュリティグループが、SSH（ポート22）をインターネット全体（0.0.0.0/0）に開いていることが分かった。AWS 責任共有モデルで、これを直す責任は誰にあるか。", "o": ["お客様。インスタンスごとのセキュリティグループの設定はお客様が行う", "AWS。ネットワークの基盤は AWS の責任だから", "AWS とお客様が半分ずつ", "AWS Marketplace で SSH のソフトを買った場合だけ、その販売者"], "a": [0], "e": "<b>正解：お客様<\/b>。公式に、EC2 ではインスタンスごとのセキュリティグループ（ファイアウォール）の設定をお客様が行うと書かれている。<br>×AWS：AWS が守るのは、データセンターのネットワーク基盤まで。どのポートを開けるかを決めるのはお客様。<br>×半分ずつ：設定そのものはお客様の作業。<br>×販売者：無関係。", "trap": "TRAP 05", "src": "https://aws.amazon.com/compliance/shared-responsibility-model/"}, {"s": 2, "q": "AWS 責任共有モデルで、使うサービスが Amazon EC2、Amazon RDS、AWS Lambda のどれであっても、お客様の責任として残るものはどれか。", "o": ["保存するデータの管理と分類", "IAM で誰に何を許すかの設定", "ゲスト OS へのパッチの適用", "仮想化の層（ハイパーバイザー）の保護", "DB エンジンのバージョンアップ"], "a": [0, 1], "e": "<b>正解：データの管理と分類、IAM の設定<\/b>。どのサービスでも、データと権限はお客様。<br>×ゲスト OS のパッチ：EC2 ではお客様だが、RDS と Lambda では AWS。「どれであっても」に合わない。<br>×ハイパーバイザー：常に AWS。<br>×DB エンジン：RDS では AWS がパッチを当てる。EC2 に自分で入れた場合だけお客様。<div class=\"mem\">「どのサービスでも」と聞かれたら、データと IAM。<\/div>", "trap": "TRAP 08", "src": "https://aws.amazon.com/compliance/shared-responsibility-model/"}, {"s": 2, "q": "ある会社では、IAM の管理者権限を持つ IAM ユーザーが1人しかいない。その管理者が、誤って自分のポリシーを外してしまい、IAM の操作が何もできなくなった。最も適切な対応はどれか。", "o": ["ルートユーザーでサインインし、ポリシーを編集して権限を戻す", "AWS Support に連絡し、AWS の担当者に IAM のポリシーを直してもらう", "AWS Config のルールで、外したポリシーを自動で戻す", "新しい AWS アカウントを作り、すべてのリソースを移す"], "a": [0], "e": "<b>正解：ルートユーザーでサインインして権限を戻す<\/b>。「唯一の IAM 管理者が自分の権限を誤って外したときの復元」は、公式のルートユーザーにしかできない作業の一覧に入っている。<br>×AWS Support に直してもらう：AWS がお客様の IAM の設定を代わりに変えることはない（IAM はお客様の責任）。<br>×AWS Config：設定の記録と評価。権限がないユーザーを救う手段ではない。<br>×新しいアカウント：大げさで、不要。<div class=\"mem\">ルートユーザーは「締め出されたときの非常口」。だから普段は使わず、MFA で厳重に守る。<\/div>", "trap": "TRAP 05", "src": "https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-tasks.html"}, {"s": 2, "q": "ルートユーザーの認証情報でサインインしないと行えない作業はどれか。", "o": ["すべてのプリンシパルを拒否してしまった Amazon S3 バケットポリシーの編集や削除", "リザーブドインスタンスマーケットプレイスへの販売者としての登録", "AWS アカウントの名前や連絡先情報の変更", "IAM ユーザーとアクセスキーの作成", "AWS Cost Explorer でのコストの確認"], "a": [0, 1], "e": "<b>正解：全プリンシパルを拒否した S3 バケットポリシーの編集・削除、リザーブドインスタンスマーケットプレイスへの販売者登録<\/b>。どちらも公式の一覧に入っている。<br>×アカウント名や連絡先情報：公式に「ルートユーザーの認証情報は不要」と明記されている。ルートが必要なのは、ルートのメールアドレス・パスワード・ルートのアクセスキーの変更（単独のアカウントの場合）。<br>×IAM ユーザーとアクセスキーの作成：権限のある IAM ユーザーでできる。<br>×Cost Explorer：権限があれば IAM でできる。", "trap": "TRAP 08", "src": "https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-tasks.html"}, {"s": 2, "q": "経理担当の IAM ユーザーに、請求情報を見るための IAM ポリシーを付けた。しかし、そのユーザーは請求情報とコスト管理のコンソールを開けない。この AWS アカウントでは、まだ一度も請求の設定を変えていない。最も可能性の高い原因と対応はどれか。", "o": ["請求情報とコスト管理のコンソールへの IAM アクセスが有効になっていないので、ルートユーザーで有効にする", "IAM ポリシーは請求には使えないので、経理担当にルートユーザーのパスワードを教える", "請求情報は AWS Artifact からしか見られないので、Artifact の権限を付ける", "経理担当の IAM ユーザーに MFA を設定すれば、自動で見られるようになる"], "a": [0], "e": "<b>正解：ルートユーザーで、請求コンソールへの IAM アクセスを有効にする<\/b>。これはルートユーザーにしかできない作業の1つ。有効にしたうえで、IAM ポリシーで誰に見せるかを決める。<br>×ルートのパスワードを教える：最悪。ルートの認証情報は共有しない。<br>×Artifact：AWS のコンプライアンスレポートの置き場。請求の画面ではない。<br>×MFA を付ければ見られる：MFA は認証を強くするもので、権限を与えるものではない。", "trap": "", "src": "https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-tasks.html"}, {"s": 2, "q": "ある会社は、管理者のサインインを、フィッシング（偽のサイトでの盗み取り）に強い方法で守りたい。AWS が最も推奨する MFA の種類はどれか。", "o": ["パスキーやセキュリティキー（FIDO 準拠の認証器）", "携帯電話の SMS で受け取るコード", "スマートフォンの仮想認証アプリが出す6桁のコード", "パスワードポリシーで最小の長さを20文字にすること"], "a": [0], "e": "<b>正解：パスキーやセキュリティキー<\/b>。合図は「フィッシングに強い」。公開鍵暗号を使う FIDO 準拠の方式で、AWS は可能な限りこれを推奨している。<br>×SMS：AWS は SMS による MFA を新しく有効にするサポートを終了している。<br>×仮想認証アプリ（TOTP）：使えるが、公式はパスキーやセキュリティキーがそろうまでのつなぎとして位置づけている。<br>×パスワードを長くする：MFA ではない（2つ目の要素にならない）。<div class=\"mem\">FIDO＝「本物のサイトにしか答えない鍵」。だからフィッシングに強い。<\/div>", "trap": "TRAP 11", "src": "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html"}, {"s": 2, "q": "IAM のアカウントのパスワードポリシーについて、正しいものはどれか。", "o": ["ルートユーザーのパスワードや、IAM ユーザーのアクセスキーには適用されない", "一定回数サインインに失敗したユーザーを自動で締め出す（ロックアウトする）設定ができる", "最小の長さを変えると、条件に合わない既存のパスワードはすぐに使えなくなる", "設定しない場合、IAM ユーザーのパスワードには何の条件もない"], "a": [0], "e": "<b>正解：ルートユーザーのパスワードとアクセスキーには適用されない<\/b>。対象は IAM ユーザーのパスワード。<br>×ロックアウト：公式に「作れない」とある。強いパスワードポリシーと MFA を組み合わせる。<br>×すぐに使えなくなる：最小の長さや文字の種類は、次にパスワードを変えるときから効く（有効期限の設定はすぐに効く）。<br>×何の条件もない：既定のポリシー（8文字以上、3種類以上の文字など）が適用される。", "trap": "TRAP 07", "src": "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_passwords_account-policy.html"}, {"s": 2, "q": "ある会社は、AWS の外で動くサードパーティのツールから AWS の API を呼ぶ必要がある。このツールは IAM ロールにも IAM Identity Center にも対応しておらず、IAM ユーザーのアクセスキーを使うしかない。アクセスキーの扱いとして最も適切なものはどれか。", "o": ["必要な権限だけを持つ IAM ユーザーのキーを使い、必要に応じて更新し、最終使用の情報を見て使っていないキーは削除する", "ルートユーザーのアクセスキーを作って使う。全権限があるのでエラーが出ない",
