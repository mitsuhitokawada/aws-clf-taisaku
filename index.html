<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS CLF対策</title>
<style>
/* 色はCSS変数で管理（ライト／ダーク両対応） */
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#5b6474;--line:#dde1e8;--soft:#eef1f5;
  --d1:#2f6fd6;--d2:#d9771c;--d3:#1f9d55;--d4:#8a4fd1;--d0:#e0601b;
  --ok:#1f9d55;--ng:#d23c3c;--warn-bg:#fff6e5;--warn-line:#f0b44c;--acc:#ff9900;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--sub:#a3abb9;--line:#2e3542;--soft:#232a35;
    --d1:#6aa1ff;--d2:#f2a154;--d3:#4fcf86;--d4:#b88cf5;--d0:#ff8a4c;
    --ok:#4fcf86;--ng:#ff6b6b;--warn-bg:#332713;--warn-line:#a87a2a;--acc:#ffad33;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b;--card:#1b2029;--ink:#e6e9ef;--sub:#a3abb9;--line:#2e3542;--soft:#232a35;
  --d1:#6aa1ff;--d2:#f2a154;--d3:#4fcf86;--d4:#b88cf5;--d0:#ff8a4c;
  --ok:#4fcf86;--ng:#ff6b6b;--warn-bg:#332713;--warn-line:#a87a2a;--acc:#ffad33;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* スマホの上の帯（ノッチの部分）をヘッダーと同じ色で塗る */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7;font-size:15px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.hd h1{font-size:17px;margin:0}
.cd{font-size:13px;background:var(--acc);color:#111;border-radius:999px;padding:2px 10px;font-weight:700}
.hd .sp{flex:1}
.hd button{font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:0 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:thin}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:none}.tab.on{display:block}
h2{font-size:19px;margin:8px 0 12px}
h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-left:5px solid var(--warn-line);border-radius:8px;padding:8px 12px;margin:8px 0}
.mem{background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0}
.mem::before{content:"覚え方　";font-weight:700;color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.tw{overflow-x:auto}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--d1);border-color:var(--d1);color:#fff}
button:disabled{opacity:.5;cursor:default}
input[type=search],select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;color:#fff;margin-right:4px;vertical-align:1px}
.p1{background:var(--d1)}.p2{background:var(--d2)}.p3{background:var(--d3)}.p4{background:var(--d4)}.p0{background:var(--d0)}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:0 14px}
details[open]{padding-bottom:12px}
summary{cursor:pointer;padding:10px 0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.pc b{font-size:15px}
.pc .f{color:var(--sub);font-size:12px}
.pc .v{color:var(--sub);font-size:13px;margin-top:4px}
.star{color:var(--acc)}
.flip{min-height:120px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.flip .bk{display:none;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.flip.open .bk{display:block}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair>div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px}
.judge{margin-top:8px;font-size:14px}
.judge::before{content:"見分け方　";font-weight:700;color:var(--acc)}
/* クイズ */
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px}
.qopt.sel{border-color:var(--d1);box-shadow:0 0 0 2px var(--d1) inset}
.qopt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.qopt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 15%,var(--card))}
.res{border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--soft)}
.res .h{font-weight:700;font-size:16px}
.res .h.ok{color:var(--ok)}.res .h.ng{color:var(--ng)}
.meta{color:var(--sub);font-size:13px}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.mbtn{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.mbtn button{text-align:left;padding:10px 12px}
.mbtn small{display:block;color:var(--sub)}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
.ql{font-size:14px;border-top:1px solid var(--line);padding:8px 0}
.small{font-size:13px;color:var(--sub)}
.ab{font-size:.85em;color:var(--sub)}
.res a,.card a{overflow-wrap:anywhere;word-break:break-all}
@media (max-width:600px){
  body{font-size:14px}
  main{padding-block:12px}
  .pair{grid-template-columns:1fr}
  th,td{padding:5px 6px}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>AWS Cloud Practitioner 対策</h1>
    <span class="cd" id="cd"></span>
    <span class="sp"></span>
    <button id="themeBtn" title="表示の明るさを切り替え">明るさ</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
/* =========================================================
   AWS Certified Cloud Practitioner（CLF-C02）対策ツール
   ・Gen AI Leader 対策ツールの型（地図→精読→クイズ→解剖→印→再挑戦）で作成
   ・出題範囲は公式の試験ガイド（改訂 1.3、2026-10-29）にそろえた
   ・問題はすべてオリジナル（本番問題・ダンプは使わない）
   ・保存キーは aws_ で始める（他のツールと混ざらないように）
   ========================================================= */

// 受験日は、利用者が全体マップで入力する（公開ページに個人の予定を書かないため）
const K = {wrong:'aws_wrong', hist:'aws_hist', resume:'aws_resume', flag:'aws_flag', theme:'aws_theme', exam:'aws_exam'};

/* ---------- 保存（localStorage は失敗しても動くようにする） ---------- */
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- セクション（＝試験のドメイン） ---------- */
const SECTIONS = [
  {n:0, name:'総仕上げ（本番形式・ドメイン横断）', w:null, c:'p0'},
  {n:1, name:'ドメイン1：クラウドの概念', en:'Cloud Concepts', w:24, c:'p1'},
  {n:2, name:'ドメイン2：セキュリティとコンプライアンス', en:'Security and Compliance', w:30, c:'p2'},
  {n:3, name:'ドメイン3：クラウドのテクノロジーとサービス', en:'Cloud Technology and Services', w:34, c:'p3'},
  {n:4, name:'ドメイン4：請求、料金、サポート', en:'Billing, Pricing, and Support', w:12, c:'p4'},
];
function pill(s){const x=SECTIONS[s];return `<span class="pill ${x.c}">${s===0?'総仕上げ':'D'+s}</span>`}

/* ---------- 11日間の計画（受験日から逆算。[何日前, やること]） ---------- */
const PLAN = [
  [11,'全体マップを読む。D1 精読 → D1 クイズ'],
  [10,'D2 精読（責任共有モデル・IAM）→ D2 クイズ'],
  [9,'D2 の残り（セキュリティサービス）→ 似た者ペア（セキュリティ系）'],
  [8,'D3 精読（グローバルインフラ・コンピューティング・データベース）'],
  [7,'D3 精読（ネットワーク・ストレージ・その他）→ D3 クイズ'],
  [6,'D4 精読 → D4 クイズ。サービス早見表の★を一周'],
  [5,'総合模試（20問）× 2。間違いを見直して印をつける'],
  [4,'間違えた問題だけ・印つき。罠の型カード'],
  [3,'本番形式（65問・90分）を1回。公式の模擬試験があれば解く'],
  [2,'弱いドメインの精読と、間違い・印つきの総ざらい'],
  [1,'軽めに。早見表の★、似た者ペア、つまずき総ざらい。早く寝る'],
  [0,'受験。テストセンターなら15分前に到着'],
];
const WD='日月火水木金土';
// 保存した受験日（YYYY-MM-DD）を日付にする。なければ null
function examDay(){const v=load(K.exam,'');const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);return m?new Date(+m[1],+m[2]-1,+m[3]):null}

/* ---------- 精読（ドメインごと） ---------- */
const READ = [
 {s:1, t:'1.1 AWS クラウドの利点', h:`
<p>クラウドの価値は「必要なときに、必要なだけ、すぐ使えて、使った分だけ払う」こと。</p>
<div class="tw"><table><tr><th>用語</th><th>意味</th><th>問題文の合図</th></tr>
<tr><td>伸縮性（Elasticity）</td><td>需要に合わせて、自動で増やしたり減らしたりできる</td><td>需要が変動、ピーク時だけ、予測できない</td></tr>
<tr><td>拡張性（Scalability）</td><td>大きくしていける能力</td><td>成長に合わせて</td></tr>
<tr><td>高可用性（High Availability）</td><td>止まりにくい。複数のアベイラビリティーゾーンに分ける</td><td>停止時間を最小、障害でも動き続ける</td></tr>
<tr><td>俊敏性（Agility）</td><td>新しいことを速く、安く試せる</td><td>実験、市場投入までの時間、イノベーション</td></tr>
<tr><td>グローバル展開</td><td>数分で世界中のリージョンに展開できる</td><td>世界中のユーザー、海外進出</td></tr></table></div>
<h3>クラウドの6つの利点（AWS の公式の言い方）</h3>
<ol><li>固定費（先行投資）を変動費に置き換える</li><li>規模の経済の恩恵を受ける</li><li>容量の予測が不要になる</li><li>速度と俊敏性が上がる</li><li>データセンターの運用と保守にお金をかけなくてよい</li><li>数分でグローバルに展開できる</li></ol>
<div class="warn">引っかけ注意：「クラウドならすべての障害を必ず防げる」「コストが常にゼロ」などの言い切りは×。</div>`},
 {s:1, t:'1.2 設計の原則（Well-Architected フレームワーク）', h:`
<p>AWS Well-Architected フレームワークは、良い設計を6つの柱で点検する考え方。</p>
<div class="tw"><table><tr><th>柱</th><th>ひとことで</th><th>合図</th></tr>
<tr><td>運用上の優秀性（Operational Excellence）</td><td>運用を自動化し、小さく頻繁に変更し、失敗から学ぶ</td><td>運用手順のコード化、継続的改善</td></tr>
<tr><td>セキュリティ（Security）</td><td>最小権限、全層で防御、追跡可能に</td><td>アクセス管理、暗号化、監査</td></tr>
<tr><td>信頼性（Reliability）</td><td>障害から自動で回復、需要の変化に対応</td><td>自動復旧、障害に強い</td></tr>
<tr><td>パフォーマンス効率（Performance Efficiency）</td><td>要件に合った資源を効率よく使う</td><td>適切なインスタンスタイプ、サーバーレス</td></tr>
<tr><td>コスト最適化（Cost Optimization）</td><td>無駄をなくし、使った分だけ払う</td><td>未使用リソースの削除、適正サイズ</td></tr>
<tr><td>持続可能性（Sustainability）</td><td>環境への影響を減らす</td><td>エネルギー消費、環境負荷</td></tr></table></div>
<div class="mem">「運・セ・信・パ・コ・持」＝ うんせい（運勢）しんぱい、こもち。</div>
<p>AWS Well-Architected Tool は、この6つの柱で自分の環境を点検する無料のツール。</p>`},
 {s:1, t:'1.3 移行の利点と戦略（AWS CAF と 7R）', h:`
<p><b>AWS クラウド導入フレームワーク（AWS Cloud Adoption Framework、略して AWS CAF）</b>は、クラウド移行を組織として進めるための手引き。</p>
<div class="tw"><table><tr><th>6つの観点（Perspective）</th><th>担当のイメージ</th></tr>
<tr><td>ビジネス（Business）</td><td>経営層。投資がビジネスの成果につながるか</td></tr>
<tr><td>人材（People）</td><td>人事。研修、スキル、組織の変化</td></tr>
<tr><td>ガバナンス（Governance）</td><td>リスク管理、ポートフォリオ、予算</td></tr>
<tr><td>プラットフォーム（Platform）</td><td>技術の設計。アーキテクチャ</td></tr>
<tr><td>セキュリティ（Security）</td><td>機密性・完全性・可用性</td></tr>
<tr><td>運用（Operations）</td><td>日々の運用、監視</td></tr></table></div>
<div class="mem">前の3つ（ビジネス・人材・ガバナンス）は「人と組織」、後ろの3つ（プラットフォーム・セキュリティ・運用）は「技術」。</div>
<p>AWS CAF で得られる効果：ビジネスリスクの低減、ESG（環境・社会・ガバナンス）の改善、収益の増加、運用効率の向上。</p>
<h3>移行戦略（7つの R）</h3>
<div class="tw"><table><tr><th>戦略</th><th>意味</th></tr>
<tr><td>リホスト（Rehost）</td><td>そのまま移す（リフト＆シフト）。AWS Application Migration Service</td></tr>
<tr><td>リプラットフォーム（Replatform）</td><td>少しだけ最適化して移す（例：DB をマネージドの RDS へ）</td></tr>
<tr><td>リファクタ（Refactor）</td><td>クラウド向けに作り直す（例：サーバーレス化）</td></tr>
<tr><td>リパーチェス（Repurchase）</td><td>SaaS 製品に買い替える</td></tr>
<tr><td>リロケート（Relocate）</td><td>仮想化基盤ごと移す（VMware など）</td></tr>
<tr><td>リテイン（Retain）</td><td>今は移さず残す</td></tr>
<tr><td>リタイア（Retire）</td><td>使っていないので廃止する</td></tr></table></div>
<div class="mem">カタカナだと全部「リ○○」で同じに見えるので、英語の意味で覚える。host＝サーバー（を替える）／platform＝土台（を乗り換える）／factor＝作り（を直す）／purchase＝買う（SaaS を買い直す）／locate＝場所（基盤ごと引っ越す）／retain＝保つ（残す）／retire＝引退（廃止）。</div>
<p>移行の道具：AWS Application Discovery Service（今あるサーバーの調査）、Migration Evaluator（費用の試算・ビジネスケース）、AWS Migration Hub（移行の進み具合を一か所で追跡）、AWS Database Migration Service（略して AWS DMS。停止時間を最小にした DB 移行・レプリケーション）、AWS Schema Conversion Tool（略して AWS SCT。違う種類の DB へスキーマを変換）。</p>`},
 {s:1, t:'1.4 クラウドの経済性', h:`
<ul><li><b>固定費 → 変動費</b>：データセンターやサーバーを買う（設備投資、CapEx）代わりに、使った分だけ払う（運用費、OpEx）。</li>
<li><b>オンプレミスの費用</b>：サーバー代だけでなく、電気、冷却、建物、人件費、保守もかかる。</li>
<li><b>ライセンス</b>：BYOL（Bring Your Own License、手持ちのライセンスを持ち込む）と、料金にライセンスが含まれる（License Included）。</li>
<li><b>適正サイズ（Rightsizing）</b>：使っていない分を小さくする。AWS Compute Optimizer が推奨を出す。</li>
<li><b>自動化の利点</b>：手作業の時間とミスが減る（AWS CloudFormation など）。</li>
<li><b>規模の経済</b>：AWS が大量に買うので、単価が下がり、値下げとして返ってくる。</li></ul>`},

 {s:2, t:'2.1 責任共有モデル（最重要）', h:`
<p><b>AWS は「クラウドの」セキュリティ（Security OF the cloud）</b>、<b>お客様は「クラウドの中の」セキュリティ（Security IN the cloud）</b>。</p>
<div class="tw"><table><tr><th></th><th>AWS の責任</th><th>お客様の責任</th></tr>
<tr><td>共通</td><td>データセンターの物理セキュリティ、ハードウェア、ネットワーク基盤、仮想化の層（ハイパーバイザー）</td><td>データ、IAM（誰に何を許すか）、暗号化の設定、セキュリティグループの設定</td></tr>
<tr><td>Amazon EC2（仮想サーバー）</td><td>ホストの OS まで</td><td><b>ゲスト OS のパッチ</b>、ミドルウェア、アプリ、ファイアウォール設定</td></tr>
<tr><td>Amazon RDS（マネージド DB）</td><td>DB エンジンと OS のパッチ、バックアップの仕組み</td><td>DB のユーザーと権限、データ、ネットワークの許可設定</td></tr>
<tr><td>AWS Lambda（サーバーレス）</td><td>OS、実行環境（ランタイム）、サーバー</td><td>関数のコード、IAM の権限、データ</td></tr></table></div>
<div class="mem">マネージドになるほど、AWS の担当が増える。EC2 は「部屋を借りる」（中の家具は自分）、Lambda は「ホテル」（荷物＝コードとデータだけ自分）。</div>
<div class="warn">引っかけ注意：「共有される責任」もある。パッチ管理（AWS は基盤、お客様はゲスト OS とアプリ）、設定管理、教育・意識向上（AWS は社員、お客様は自社の社員）。</div>`},
 {s:2, t:'2.2 セキュリティ・ガバナンス・コンプライアンス', h:`
<div class="tw"><table><tr><th>やりたいこと</th><th>サービス</th></tr>
<tr><td>AWS のコンプライアンスレポート（SOC、PCI DSS、ISO など）を入手</td><td><b>AWS Artifact</b></td></tr>
<tr><td>誰が・いつ・どの API を呼んだか（操作の記録、監査）</td><td><b>AWS CloudTrail</b></td></tr>
<tr><td>性能の数値（CPU 使用率など）とアラーム、ログ</td><td><b>Amazon CloudWatch</b></td></tr>
<tr><td>リソースの設定の履歴、ルールに合っているか</td><td><b>AWS Config</b></td></tr>
<tr><td>脅威の検出（ログを機械学習で分析）</td><td><b>Amazon GuardDuty</b></td></tr>
<tr><td>脆弱性スキャン（EC2、コンテナイメージ、Lambda）</td><td><b>Amazon Inspector</b></td></tr>
<tr><td>S3 の中の個人情報などの機密データを発見</td><td><b>Amazon Macie</b></td></tr>
<tr><td>セキュリティの結果を一か所に集約・点数化</td><td><b>AWS Security Hub</b></td></tr>
<tr><td>見つかった問題の根本原因を調べる</td><td><b>Amazon Detective</b></td></tr></table></div>
<p><b>暗号化</b>：保存時（at rest）は AWS KMS の鍵などで、通信時（in transit）は TLS（証明書は AWS Certificate Manager）で。</p>
<div class="warn">コンプライアンスは、サービス・リージョン・業界によって違う。「AWS を使えば自動的にすべての規制に準拠」は×（お客様側の責任も残る）。</div>`},
 {s:2, t:'2.3 アクセス管理（IAM）', h:`
<p><b>AWS Identity and Access Management（略して IAM）</b>：誰が（ユーザー・グループ・ロール）、何を（ポリシー）できるかを決める。無料。</p>
<ul><li><b>ルートユーザー</b>：アカウントを作ったメールアドレスのユーザー。全権限。<b>MFA（多要素認証）を有効にし、日常の作業には使わない。アクセスキーを作らない。</b></li>
<li>ルートユーザーにしかできない作業の例：AWS アカウントの解約（閉鎖）、請求コンソールへの IAM アクセスの有効化、ルートユーザーのメールアドレス・パスワード・アクセスキーの変更、IAM ユーザーの権限の復旧。アカウント名や連絡先の変更は、権限のある IAM でもできる（公式の一覧は IAM のドキュメントの「ルートユーザーの認証情報が必要なタスク」）。</li>
<li><b>最小権限の原則</b>：必要な権限だけを与える。</li>
<li><b>IAM ユーザー</b>：人やアプリ用の長期の認証情報。<b>IAM グループ</b>：ユーザーをまとめて権限付与（グループの中にグループは入れられない）。</li>
<li><b>IAM ロール</b>：一時的な認証情報。EC2 から S3 を使うとき、別アカウントへのアクセス（クロスアカウント）、フェデレーション（外部 ID でログイン）。</li>
<li><b>ポリシー</b>：AWS 管理ポリシー（AWS が用意）、カスタマー管理ポリシー（自分で作る）。</li>
<li><b>AWS IAM Identity Center</b>（旧 AWS Single Sign-On）：複数アカウントや業務アプリへのシングルサインオン。</li>
<li>認証情報の保管：<b>AWS Secrets Manager</b>（自動ローテーションあり。DB のパスワードなど）、AWS Systems Manager の Parameter Store（設定値や秘密の保管）。</li></ul>
<div class="mem">ロール＝「役の衣装」。着ている間だけその権限。EC2 にアクセスキーを書き込まず、衣装（ロール）を着せる。</div>`},
 {s:2, t:'2.4 セキュリティの部品と情報源', h:`
<div class="tw"><table><tr><th>サービス</th><th>守るもの</th></tr>
<tr><td>AWS WAF（Web Application Firewall、Web アプリ用のファイアウォール）</td><td>Web アプリ（第7層）への攻撃。SQL インジェクション、クロスサイトスクリプティング、IP 制限。守り方のルールは <b>Web ACL</b>（ACL＝Access Control List、許可と拒否のルールの一覧）にまとめる。ルールを一から作れないときは、AWS（AWS Managed Rules）や AWS Marketplace の販売者が用意した<b>マネージドルールグループ</b>をそのまま追加できる。同じ IP からの大量のリクエストは<b>レートベースのルール</b>で制限</td></tr>
<tr><td>AWS Shield</td><td>DDoS 攻撃。Standard は全員に自動で無料。Advanced は有料で、24時間の対応チームと費用の保護</td></tr>
<tr><td>AWS Firewall Manager</td><td>複数アカウントの WAF・Shield・セキュリティグループのルールを一括管理</td></tr>
<tr><td>Amazon GuardDuty</td><td>脅威の検出</td></tr>
<tr><td>AWS Marketplace</td><td>サードパーティのセキュリティ製品を購入</td></tr>
<tr><td>AWS Trusted Advisor</td><td>セキュリティの問題（公開された S3、MFA なしのルートなど）を点検</td></tr></table></div>
<p>情報源：AWS ナレッジセンター（Knowledge Center）、AWS セキュリティセンター、AWS セキュリティブログ。</p>`},

 {s:3, t:'3.1 デプロイと運用の方法', h:`
<ul><li>操作方法：AWS マネジメントコンソール（画面）、AWS CLI（コマンド）、SDK（プログラムから）、API。</li>
<li><b>Infrastructure as Code（略して IaC、インフラをコードで管理）</b>：AWS CloudFormation。テンプレートで同じ環境を何度でも作れる（繰り返しの作業に向く）。</li>
<li>1回だけの作業はコンソール、繰り返す作業は IaC や CLI のスクリプト。</li>
<li>デプロイモデル：クラウド、ハイブリッド（オンプレミスとクラウドの組み合わせ）、オンプレミス（AWS Outposts は AWS の機器を自社に置く）。</li></ul>`},
 {s:3, t:'3.2 グローバルインフラ', h:`
<div class="tw"><table><tr><th>単位</th><th>意味</th></tr>
<tr><td>リージョン（Region）</td><td>地理的な場所（例：東京、大阪）。複数のアベイラビリティーゾーンからなる</td></tr>
<tr><td>アベイラビリティーゾーン（Availability Zone、略して AZ）</td><td>1つ以上のデータセンターの集まり。電源・ネットワークが独立し、単一障害点を共有しない</td></tr>
<tr><td>エッジロケーション</td><td>ユーザーの近くの拠点。Amazon CloudFront（キャッシュ配信）と Amazon Route 53（DNS）が使う</td></tr></table></div>
<p><b>高可用性 → 複数の AZ</b>（マルチ AZ）。<b>複数リージョン → 災害対策、事業継続、世界中のユーザーへの低遅延、データ主権（データを国内に置く義務）</b>。</p>
<p>リージョンを選ぶ基準：法令・データ主権、ユーザーへの近さ（遅延）、使いたいサービスがあるか、料金。</p>`},
 {s:3, t:'3.3 コンピューティング', h:`
<div class="tw"><table><tr><th>サービス</th><th>ひとこと</th></tr>
<tr><td>Amazon EC2</td><td>仮想サーバー。OS から自分で管理。インスタンスタイプ：汎用、コンピューティング最適化、メモリ最適化、ストレージ最適化、高速化（GPU）</td></tr>
<tr><td>AWS Lambda</td><td>サーバーレス。イベントでコードを実行。実行時間の分だけ払う（最大15分）</td></tr>
<tr><td>Amazon ECS / Amazon EKS</td><td>コンテナを動かす。EKS は Kubernetes</td></tr>
<tr><td>AWS Fargate</td><td>コンテナ用のサーバーレス。サーバーの管理なしで ECS・EKS を動かす</td></tr>
<tr><td>Amazon EC2 Auto Scaling / AWS Auto Scaling</td><td>需要に合わせて台数を自動で増減（伸縮性）</td></tr>
<tr><td>Elastic Load Balancing（ELB）</td><td>アクセスを複数のサーバーに振り分ける。正常なものだけに送る</td></tr>
<tr><td>AWS Elastic Beanstalk</td><td>コードを上げるだけで、実行環境を自動で用意（PaaS）</td></tr>
<tr><td>Amazon Lightsail</td><td>簡単な仮想サーバー。月額固定に近い料金。小さな Web サイト向け</td></tr>
<tr><td>AWS Batch</td><td>大量のバッチ処理を自動で実行</td></tr>
<tr><td>AWS Outposts</td><td>AWS の機器を自社のデータセンターに置く</td></tr></table></div>`},
 {s:3, t:'3.4 データベース', h:`
<div class="tw"><table><tr><th>種類</th><th>サービス</th><th>合図</th></tr>
<tr><td>リレーショナル（SQL）</td><td>Amazon RDS（MySQL、PostgreSQL、Oracle、SQL Server など）</td><td>表、トランザクション、既存の DB をマネージドに</td></tr>
<tr><td>リレーショナル（高性能）</td><td>Amazon Aurora（MySQL・PostgreSQL 互換。AWS 独自）</td><td>高性能、高可用、MySQL 互換</td></tr>
<tr><td>NoSQL（キーと値）</td><td>Amazon DynamoDB（サーバーレス）</td><td>1桁ミリ秒、大規模、スキーマが柔軟</td></tr>
<tr><td>インメモリ（キャッシュ）</td><td>Amazon ElastiCache</td><td>読み込みを速く、キャッシュ、セッション</td></tr>
<tr><td>ドキュメント</td><td>Amazon DocumentDB</td><td>MongoDB 互換</td></tr>
<tr><td>グラフ</td><td>Amazon Neptune</td><td>つながり、SNS の友達関係、不正検出</td></tr>
<tr><td>データウェアハウス</td><td>Amazon Redshift</td><td>大量データの分析、BI</td></tr></table></div>
<p><b>EC2 に自分で DB を入れる</b>：OS・DB のパッチもバックアップも自分。<b>マネージド（RDS など）</b>：AWS が面倒を見る。運用負荷が低い。</p>`},
 {s:3, t:'3.5 ネットワーク', h:`
<ul><li><b>Amazon VPC</b>：AWS の中の自分専用のネットワーク。<b>サブネット</b>（パブリック／プライベート）、<b>インターネットゲートウェイ</b>（インターネットとの出入口）、<b>NAT ゲートウェイ</b>（プライベートサブネットから外へ出るだけ）。</li>
<li><b>セキュリティグループ</b>：インスタンス単位。ステートフル（戻りの通信は自動で許可）。許可ルールだけ。</li>
<li><b>ネットワーク ACL</b>：サブネット単位。ステートレス（行きと帰りの両方を書く）。許可と拒否の両方。</li>
<li><b>Amazon Route 53</b>：DNS（名前解決）、ドメイン登録、ヘルスチェック、ルーティング。</li>
<li><b>AWS Direct Connect</b>：オンプレミスと AWS を<b>専用線</b>で結ぶ（安定、インターネットを通らない）。</li>
<li><b>AWS Site-to-Site VPN</b>：インターネット経由の<b>暗号化</b>トンネル（すぐ・安く始められる）。AWS Client VPN は個人の PC から。</li>
<li>AWS Transit Gateway：多数の VPC とオンプレミスをハブで集約。AWS PrivateLink：インターネットを通らずにサービスへ非公開接続。</li>
<li>Amazon CloudFront：コンテンツをエッジでキャッシュ配信（CDN）。AWS Global Accelerator：AWS の基幹網で通信を速く・安定に（キャッシュはしない）。Amazon API Gateway：API の入口を作る。</li></ul>
<div class="mem">セキュリティグループ＝部屋（インスタンス）の鍵。ネットワーク ACL＝建物の階（サブネット）の警備員。警備員は行きも帰りもチェック（ステートレス）。</div>`},
 {s:3, t:'3.6 ストレージ', h:`
<div class="tw"><table><tr><th>種類</th><th>サービス</th><th>ひとこと</th></tr>
<tr><td>オブジェクト</td><td>Amazon S3</td><td>容量無制限、高い耐久性（イレブンナイン：99.999999999%）。Web の静的ファイル、バックアップ、データレイク</td></tr>
<tr><td>ブロック</td><td>Amazon EBS</td><td>EC2 のディスク。同じ AZ の中で使う。止めてもデータが残る</td></tr>
<tr><td>ブロック（一時）</td><td>インスタンスストア</td><td>EC2 のホストに直付け。止めると消える</td></tr>
<tr><td>ファイル（Linux）</td><td>Amazon EFS</td><td>複数の EC2 から同時に使える共有ファイル</td></tr>
<tr><td>ファイル（Windows など）</td><td>Amazon FSx</td><td>Windows File Server、Lustre（高性能計算）など</td></tr>
<tr><td>ハイブリッド</td><td>AWS Storage Gateway</td><td>オンプレミスから AWS のストレージを使う。手元にキャッシュ</td></tr>
<tr><td>バックアップ</td><td>AWS Backup</td><td>複数サービスのバックアップを一元管理</td></tr>
<tr><td>災害対策</td><td>AWS Elastic Disaster Recovery</td><td>サーバーを AWS に複製し、すぐ復旧</td></tr></table></div>
<h3>S3 のストレージクラス</h3>
<div class="tw"><table><tr><th>クラス</th><th>使いどころ</th></tr>
<tr><td>S3 Standard</td><td>よく使うデータ</td></tr>
<tr><td>S3 Intelligent-Tiering</td><td>アクセスのパターンが分からない・変わる → 自動で移動</td></tr>
<tr><td>S3 Standard-IA（低頻度アクセス）</td><td>たまにしか使わないが、すぐ取り出したい</td></tr>
<tr><td>S3 One Zone-IA</td><td>1つの AZ だけ。再作成できるデータ。より安い</td></tr>
<tr><td>S3 Glacier Instant Retrieval</td><td>アーカイブだが、ミリ秒で取り出せる</td></tr>
<tr><td>S3 Glacier Flexible Retrieval</td><td>アーカイブ。数分〜数時間で取り出し</td></tr>
<tr><td>S3 Glacier Deep Archive</td><td>最も安い。取り出しは最大12時間程度。何年も保管する法定記録</td></tr></table></div>
<p><b>ライフサイクルポリシー</b>：日数に応じて、安いクラスへ自動で移す・削除する。</p>`},
 {s:3, t:'3.7 AI・機械学習と分析', h:`
<div class="tw"><table><tr><th>サービス</th><th>やること</th></tr>
<tr><td>Amazon SageMaker AI</td><td>機械学習モデルを作る・学習・デプロイ</td></tr>
<tr><td>Amazon Lex</td><td>チャットボット（会話）</td></tr>
<tr><td>Amazon Polly</td><td>テキスト → 音声（読み上げ）</td></tr>
<tr><td>Amazon Transcribe</td><td>音声 → テキスト（文字起こし）</td></tr>
<tr><td>Amazon Translate</td><td>翻訳</td></tr>
<tr><td>Amazon Comprehend</td><td>文章の分析（感情、キーフレーズ）</td></tr>
<tr><td>Amazon Rekognition</td><td>画像・動画の分析（顔、物体）</td></tr>
<tr><td>Amazon Textract</td><td>書類から文字・表・フォームを抽出</td></tr>
<tr><td>Amazon Q</td><td>生成 AI のアシスタント（業務・開発）</td></tr>
<tr><td>Amazon Athena</td><td>S3 のデータに SQL で直接問い合わせ（サーバーレス）</td></tr>
<tr><td>Amazon Kinesis</td><td>リアルタイムのストリーミングデータ</td></tr>
<tr><td>AWS Glue</td><td>ETL（データの抽出・変換・読み込み）とデータカタログ</td></tr>
<tr><td>Amazon Quick（旧 Amazon QuickSight を含む）</td><td>BI、ダッシュボード、可視化</td></tr>
<tr><td>Amazon EMR</td><td>Hadoop・Spark でビッグデータ処理</td></tr>
<tr><td>Amazon OpenSearch Service</td><td>検索、ログの分析</td></tr></table></div>
<div class="mem">Polly＝おしゃべりオウム（話す）、Transcribe＝書き起こし、Rekognition＝認識（目）、Textract＝テキスト抜き出し、Comprehend＝理解（気持ち）、Lex＝会話。</div>`},
 {s:3, t:'3.8 その他のカテゴリ', h:`
<div class="tw"><table><tr><th>カテゴリ</th><th>サービス</th></tr>
<tr><td>メッセージ・連携</td><td>Amazon SQS（キュー、疎結合）、Amazon SNS（通知、Pub/Sub、1対多）、Amazon EventBridge（イベントで処理をつなぐ）、AWS Step Functions（処理の流れを組む）</td></tr>
<tr><td>業務アプリ</td><td>Amazon Connect（クラウドのコールセンター）、Amazon SES（メール送信）</td></tr>
<tr><td>開発者ツール</td><td>AWS CodeBuild（ビルドとテスト）、AWS CodePipeline（CI/CD の流れ）、AWS X-Ray（アプリの処理の追跡・ボトルネック分析）</td></tr>
<tr><td>エンドユーザーコンピューティング</td><td>Amazon WorkSpaces（仮想デスクトップ）、Amazon AppStream 2.0（アプリだけをブラウザに配信）、Amazon WorkSpaces Secure Browser（安全なブラウザ）</td></tr>
<tr><td>Web・モバイル</td><td>AWS Amplify（フロントエンドの開発とホスティング）</td></tr>
<tr><td>IoT</td><td>AWS IoT Core（機器を AWS につなぐ）</td></tr>
<tr><td>管理</td><td>AWS Organizations（複数アカウント）、AWS Control Tower（複数アカウントの環境を、ルールつきで自動で用意）、AWS Systems Manager（運用管理、パッチ）、AWS Service Catalog（承認済みの製品カタログ）、Service Quotas（上限の確認）、AWS License Manager（ライセンス管理）、AWS RAM（リソースをアカウント間で共有）</td></tr></table></div>`},

 {s:4, t:'4.1 料金モデル（EC2 の買い方）', h:`
<div class="tw"><table><tr><th>買い方</th><th>特徴</th><th>合図</th></tr>
<tr><td>オンデマンド</td><td>秒・時間単位。約束なし。最も柔軟</td><td>短期、予測できない、中断できない、初めて試す</td></tr>
<tr><td>リザーブドインスタンス（RI）</td><td>1年か3年の約束で大幅割引（最大72%程度）</td><td>安定して動き続ける、予測できる</td></tr>
<tr><td>Savings Plans</td><td>1年か3年、1時間あたりの利用額を約束。Compute Savings Plans はインスタンスファミリー・リージョンをまたげ、Fargate・Lambda にも効く</td><td>柔軟に割引、構成が変わりそう</td></tr>
<tr><td>スポットインスタンス</td><td>余った容量。最大90%程度引き。<b>中断されることがある</b></td><td>中断してもよい、バッチ、最もコストが安い</td></tr>
<tr><td>Dedicated Hosts</td><td>物理サーバー1台を専有。ソケット・コアが見える</td><td>サーバー単位のライセンス（BYOL）、規制</td></tr>
<tr><td>Dedicated Instances</td><td>他のお客様とハードウェアを共有しない（ホストは選べない）</td><td>ハードウェアの分離だけが必要</td></tr>
<tr><td>オンデマンドキャパシティ予約</td><td>特定の AZ で容量を確保。期間の約束なし</td><td>特定の時期に確実に起動したい</td></tr></table></div>
<p>RI は AWS Organizations の一括請求で、他のアカウントと割引を共有できる。</p>
<h3>データ転送の料金</h3>
<ul><li>インターネットから AWS へ（受信）：基本的に無料</li><li>AWS からインターネットへ（送信）：有料</li><li>AZ 間・リージョン間の転送：有料</li></ul>
<div class="mem">「入るのはタダ、出るのは有料」。</div>`},
 {s:4, t:'4.2 請求とコスト管理', h:`
<div class="tw"><table><tr><th>ツール</th><th>時間</th><th>やること</th></tr>
<tr><td>AWS Pricing Calculator</td><td>使う前</td><td>費用の見積もり</td></tr>
<tr><td>AWS Budgets</td><td>今〜未来</td><td>予算を決めて、超えそう・超えたら通知</td></tr>
<tr><td>AWS Cost Explorer</td><td>過去〜予測</td><td>コストをグラフで分析。傾向、予測</td></tr>
<tr><td>AWS Cost and Usage Report（CUR）</td><td>過去（最も細かい）</td><td>最も詳細な請求データを S3 へ出力</td></tr>
<tr><td>コスト配分タグ</td><td>—</td><td>部署・プロジェクト別にコストを分ける</td></tr>

 '<b>正解：プラットフォーム、セキュリティ</b>（もう1つの技術寄りは運用）。<br>×ビジネス：投資がビジネスの成果につながるか（経営層）。<br>×人材：研修、スキル、組織の文化（人事）。<br>×ガバナンス：リスク管理、予算、ポートフォリオ、プログラムの管理（管理職）。ルールや管理という言葉から技術に見えやすいが、扱うのはお金とリスクと進め方。<div class="mem">CAF の6観点は3つずつに分かれる。人と組織＝ビジネス・人材・ガバナンス（会議室で決める）。技術＝プラットフォーム・セキュリティ・運用（システムを作って守って回す）。</div>');
Q(1,'会社は、オンプレミスのアプリケーションを、変更せずにできるだけ早く AWS に移したい。この移行戦略はどれか。',
 ['リホスト（Rehost）','リファクタ（Refactor）','リパーチェス（Repurchase）','リタイア（Retire）'],[0],
 '<b>正解：リホスト</b>（リフト＆シフト）。合図は「変更せず」「早く」。道具は AWS Application Migration Service。<br>×リファクタ：クラウド向けに作り直す（時間がかかる）。<br>×リパーチェス：SaaS に買い替える。<br>×リタイア：廃止する。<div class="mem">英語の意味で覚える。Rehost＝host（サーバー）を替えるだけ。Repurchase＝purchase（買う）し直す＝SaaS を買う。「変更せず・早く」なら、何も買わずにそのまま運ぶリホスト。</div>');
Q(1,'会社は、オンプレミスの DB を Amazon RDS に移す。アプリのコードはほとんど変えないが、DB の運用は AWS に任せたい。この移行戦略はどれか。',
 ['リプラットフォーム（Replatform）','リホスト（Rehost）','リテイン（Retain）','リファクタ（Refactor）'],[0],
 '<b>正解：リプラットフォーム</b>。「少しだけ最適化して移す」（マネージドに乗せ換える）。<br>×リホスト：そのまま EC2 に移す場合。<br>×リテイン：移さず残す。<br>×リファクタ：作り直す。<br>合図：「Amazon RDS に移す」「運用は AWS に任せたい」＝土台（自分で管理する DB → マネージドの DB）が変わる＝リプラットフォーム。「コードはほとんど変えない」はリホストとリプラットフォームの両方に当てはまるので、決め手にならない。<div class="mem">リホスト＝サーバー（host）を引っ越すだけ。中身も管理も今のまま（EC2 へ）。リプラットフォーム＝土台（platform）を乗り換える。コードはほぼそのまま、運用は AWS に（RDS、Elastic Beanstalk へ）。</div>');
Q(1,'EC2 インスタンスの CPU 使用率が、1か月を通じて10％未満だった。コストを下げるために最も適切な対応はどれか。',
 ['より小さいインスタンスタイプに変更する（適正サイズ）','インスタンスの台数を増やす','より大きいインスタンスタイプに変更する','別のリージョンに移す'],[0],
 '<b>正解：小さいインスタンスタイプに変更する</b>（Rightsizing、適正サイズ）。推奨は AWS Compute Optimizer が出す。<br>×台数を増やす・大きくする：コストが上がる。<br>×別のリージョン：使い方の無駄は解決しない。');
Q(1,'クラウドの「俊敏性（Agility）」の説明として、最も適切なものはどれか。',
 ['新しいアイデアを、低コストかつ短時間で試せる','データを11個の9の耐久性で保存できる','障害が起きても、サービスが止まらない','世界中のユーザーに低遅延で配信できる'],[0],
 '<b>正解：新しいアイデアを低コスト・短時間で試せる</b>。合図は「実験」「市場投入までの時間」。<br>×耐久性：S3 の話。<br>×止まらない：高可用性。<br>×低遅延の配信：グローバル展開・CloudFront。<div class="warn">「俊敏＝速い」で、通信の速さ（低遅延）を選ばない。俊敏性の速さは、会社が新しいことを始めるまでの速さ（市場投入までの時間）。通信が速い・近いはグローバル展開。</div><div class="mem">俊敏性＝思いついたらすぐ試せる（サーバーを数分で用意し、失敗したら捨てる）。速いのは「会社の動き」で、「データの届き方」ではない。</div>');
Q(1,'オンプレミスと比べた AWS クラウドの利点として、正しいものはどれか。',
 ['数分で世界中のリージョンにアプリを展開できる','容量を事前に予測して購入する必要がなくなる','すべてのセキュリティの責任が AWS に移る','ハードウェアの保守を自社で行う必要がある','どの規制にも自動的に準拠する'],[0,1],
 '<b>正解：数分でグローバル展開、容量の予測が不要</b>（6つの利点に含まれる）。<br>×すべてのセキュリティが AWS：責任共有モデル。お客様の責任は残る。<br>×ハードウェアの保守を自社で：逆。AWS が行う。<br>×自動的にすべての規制に準拠：言い切り。','TRAP 07');
Q(1,'オンプレミスの総保有コスト（TCO）を AWS と比べるとき、サーバーの購入費以外に含めるべきものはどれか。',
 ['データセンターの電気代と冷却費','サーバーを管理する人の人件費','AWS の無料利用枠の金額','AWS Marketplace の製品の数','AWS のリージョンの数'],[0,1],
 '<b>正解：電気・冷却、管理の人件費</b>。オンプレミスは機器以外の費用（建物、電気、冷却、人、保守）も大きい。<br>×他の3つ：オンプレミスの費用ではない。');
Q(1,'AWS が大量の利用者の需要をまとめることで単価を下げ、その結果を値下げとしてお客様に返すこと。これを表す言葉はどれか。',
 ['規模の経済','伸縮性','俊敏性','高可用性'],[0],
 '<b>正解：規模の経済（Economies of scale）</b>。合図は「大量」「単価が下がる」「値下げ」。');
Q(1,'オンプレミスの Oracle DB を、停止時間を最小限にして Amazon Aurora PostgreSQL 互換に移したい。使うサービスの組み合わせとして最も適切なものはどれか。',
 ['AWS Schema Conversion Tool（SCT）と AWS Database Migration Service（DMS）','AWS Storage Gateway と AWS Backup','AWS Application Discovery Service と Amazon S3','AWS Direct Connect と AWS Config'],[0],
 '<b>正解：AWS SCT と AWS DMS</b>。違う種類の DB（Oracle → PostgreSQL 互換）なので、スキーマを SCT で変換し、データは DMS で停止時間を最小に移す。<br>×Storage Gateway と Backup：ストレージの話。<br>×Application Discovery Service：サーバーの調査だけ。<br>×Direct Connect と Config：接続と設定の記録。<br>合図：「DB を移す」→ DMS。「Oracle → PostgreSQL のように種類が変わる」→ SCT も足す。「停止時間を最小」→ DMS（移している間も元の DB は動き続け、変更を流し続ける）。<div class=\"mem\">SCT＝設計図（スキーマ）の翻訳係、DMS＝中身（データ）の引っ越し業者。同じ種類（Oracle → Oracle）なら引っ越し業者（DMS）だけでよい。</div>');
Q(1,'移行を始める前に、オンプレミスのサーバーの構成や使用状況、依存関係の情報を集めたい。最も適切なサービスはどれか。',
 ['AWS Application Discovery Service','AWS Migration Hub','AWS Application Migration Service','AWS Elastic Disaster Recovery'],[0],
 '<b>正解：AWS Application Discovery Service</b>（調査）。<br>×Migration Hub：移行の進み具合の追跡。<br>×Application Migration Service：実際に移す（リホスト）。<br>×Elastic Disaster Recovery：災害対策。<br>合図：「移行を始める前に」「構成・使用状況・依存関係」＝まだ何も移していない＝調査の段階。Migration Hub は移行が始まってからの「進み具合」。<div class="mem">調べる（Discovery）→ 見積もる（Migration Evaluator）→ 移す（Application Migration Service）→ 追う（Migration Hub）。</div><div class="warn">名前の注意：Application Discovery Service と Migration Hub は新規受付を終了したが、試験ガイドには載っているので出る。Application Migration Service は公式ドキュメントでは AWS Transform MGN。</div>');

/* ---- ドメイン2：セキュリティとコンプライアンス ---- */
Q(2,'AWS 責任共有モデルで、Amazon EC2 インスタンスのゲスト OS のセキュリティパッチを適用する責任は誰にあるか。',
 ['お客様','AWS','AWS とお客様が半分ずつ','AWS Marketplace の販売者'],[0],
 '<b>正解：お客様</b>。EC2 は IaaS。ゲスト OS から上はお客様の担当。<br>×AWS：ホストの OS と仮想化の層まで。<br><div class="mem">EC2 は「部屋を借りる」。中の家具（OS、アプリ）は自分。</div>','TRAP 05');
Q(2,'AWS 責任共有モデルで、AWS の責任に含まれるものはどれか。',
 ['データセンターの物理的なセキュリティ','IAM ユーザーの権限の設定','セキュリティグループのルールの設定','S3 バケットに保存するデータの分類'],[0],
 '<b>正解：データセンターの物理的なセキュリティ</b>。物理は常に AWS。<br>×IAM、セキュリティグループ、データ：常にお客様。','TRAP 05');
Q(2,'Amazon RDS を使う場合に、AWS が責任を持つものはどれか。',
 ['DB エンジンのパッチ適用','DB のユーザーと権限の管理','DB に保存するデータの内容','どの IP アドレスから接続を許すかの設定'],[0],
 '<b>正解：DB エンジンのパッチ適用</b>。RDS はマネージドなので、OS と DB エンジンのパッチ適用は AWS が行う（お客様はいつ当てるかのメンテナンスウィンドウを選ぶだけ）。<br>×DB に保存するデータの内容：<b>どのサービスでも必ずお客様</b>。データは AWS がどれだけ管理してくれるサービスでも、お客様の責任から外れない。<br>×DB のユーザーと権限の管理：DB の中で誰が何をできるかを決めるのはお客様。<br>×接続を許す IP アドレス（セキュリティグループ）：お客様の設定。<br>覚え方：「中身（データ）・誰が入れるか（権限）・どこから入れるか（ネットワーク設定）」はいつもお客様。マネージドで AWS に移るのは「OS・DB ソフトの面倒」。','TRAP 05');
Q(2,'AWS Lambda を使う場合の、お客様の責任はどれか。',
 ['関数のコード','関数に付ける IAM の権限','実行環境（ランタイム）の OS のパッチ','関数を動かすサーバーの台数の管理','データセンターのネットワーク機器'],[0,1],
 '<b>正解：関数のコード、IAM の権限</b>。<br>×OS のパッチ・サーバーの台数・データセンター：AWS。サーバーレスなので AWS の担当が広い。<div class="mem">Lambda は「ホテル」。荷物（コードと権限とデータ）だけ自分。</div>','TRAP 05');
Q(2,'監査担当者が、AWS の PCI DSS や SOC のコンプライアンスレポートを求めている。どこから入手するか。',
 ['AWS Artifact','AWS Config','AWS CloudTrail','AWS Trusted Advisor'],[0],
 '<b>正解：AWS Artifact</b>。AWS のコンプライアンスレポートと契約の置き場。<br>×Config：自分のリソースの設定の準拠。<br>×CloudTrail：API の記録。<br>×Trusted Advisor：ベストプラクティスの点検。<div class="mem">Artifact＝遺物・資料。監査の「資料」を取りに行く場所。</div>');
Q(2,'ある EC2 インスタンスが誰によって終了されたのかを調べたい。最も適切なサービスはどれか。',
 ['AWS CloudTrail','Amazon CloudWatch','AWS Config','Amazon Inspector'],[0],
 '<b>正解：AWS CloudTrail</b>。合図は「誰が」。API の呼び出し（TerminateInstances）を記録している。<br>×CloudWatch：性能の数値・アラーム。<br>×Config：設定の変化の履歴（「誰が」までなら CloudTrail）。<br>×Inspector：脆弱性スキャン。','TRAP 06');
Q(2,'会社のルールとして「すべての EBS ボリュームが暗号化されていること」を継続的に確認し、違反しているリソースを見つけたい。最も適切なサービスはどれか。',
 ['AWS Config','AWS CloudTrail','Amazon GuardDuty','AWS Artifact'],[0],
 '<b>正解：AWS Config</b>。合図は「ルールに合っているか」「設定」「継続的に」。<br>×CloudTrail：操作の記録。<br>×GuardDuty：脅威の検出。<br>×Artifact：AWS のレポート。','TRAP 06');
Q(2,'AWS アカウントの不審な動き（見慣れない場所からの API 呼び出し、暗号通貨の採掘の通信など）を、ログを分析して自動で検出したい。最も適切なサービスはどれか。',
 ['Amazon GuardDuty','Amazon Inspector','Amazon Macie','AWS Shield'],[0],
 '<b>正解：Amazon GuardDuty</b>（脅威の検出）。合図は「不審な動き」「ログを分析」。CloudTrail のイベント・VPC フローログ・DNS ログなどを、機械学習と脅威インテリジェンスで分析し、今起きている怪しい動き（見慣れない場所からの API 呼び出し、暗号通貨の採掘など）を見つける。自分でエージェントを入れなくても有効にするだけで動く。<br>×Inspector：EC2・コンテナイメージ・Lambda のソフトウェアの脆弱性を探す。「穴があるか」を見るもので、「今の怪しい動き」は見ない。<br>×Macie：S3 の中の機密データを見つける。<br>×Shield：DDoS 攻撃から守る。<br>覚え方：「動き・ログ・脅威」＝ GuardDuty、「弱点・脆弱性」＝ Inspector、「S3 のデータ」＝ Macie。','TRAP 11');
Q(2,'EC2 インスタンスやコンテナイメージに、既知のソフトウェアの脆弱性がないかを自動でスキャンしたい。最も適切なサービスはどれか。',
 ['Amazon Inspector','Amazon GuardDuty','AWS Security Hub','Amazon Detective'],[0],
 '<b>正解：Amazon Inspector</b>（検査官が弱点を検査）。<br>×GuardDuty：今起きている怪しい動き。<br>×Security Hub：結果を集約。<br>×Detective：根本原因の調査。','TRAP 11');
Q(2,'S3 バケットに、クレジットカード番号などの個人情報が保存されていないかを自動で見つけたい。最も適切なサービスはどれか。',
 ['Amazon Macie','Amazon Inspector','AWS Config','AWS KMS'],[0],
 '<b>正解：Amazon Macie</b>。合図は「S3」「個人情報・機密データ」。機械学習とパターン照合で、S3 の中身から個人情報などの機密データを見つける。<br>×Inspector：EC2・コンテナイメージ・Lambda の<b>ソフトウェアの脆弱性</b>と意図しないネットワークの公開を探す。見るのは「データの中身」ではなく「ソフトの弱点」。S3 は対象外。<br>×Config：リソースの設定の記録と、ルールに合っているかの評価。<br>×KMS：暗号鍵の管理。データを探す機能はない。<br>覚え方：Macie＝S3 の中身（データ）、Inspector＝サーバーの中身（ソフト）。','TRAP 11');
Q(2,'Web サイトが大量のトラフィックで落とされる DDoS 攻撃から守りたい。24時間の専門チームの支援と、攻撃で増えた費用の保護も欲しい。最も適切なものはどれか。',
 ['AWS Shield Advanced','AWS Shield Standard','AWS WAF','Amazon GuardDuty'],[0],
 '<b>正解：AWS Shield Advanced</b>。合図は「専門チーム」「費用の保護」。<br>×Shield Standard：全員に無料で自動。専門チームはない。<br>×WAF：SQL インジェクションなどの Web 攻撃。<br>×GuardDuty：脅威の検出。','TRAP 12');
Q(2,'Web アプリへの SQL インジェクションやクロスサイトスクリプティングの攻撃を防ぎたい。最も適切なサービスはどれか。',
 ['AWS WAF','AWS Shield Standard','ネットワーク ACL','Amazon Macie'],[0],
 '<b>正解：AWS WAF</b>（Web Application Firewall）。<br>×Shield：DDoS。<br>×ネットワーク ACL：IP とポートの許可・拒否だけ。中身は見ない。<br>×Macie：S3 の機密データ。');
Q(2,'AWS アカウントのルートユーザーを守るためのベストプラクティスとして、正しいものはどれか。',
 ['多要素認証（MFA）を有効にする','日常の管理作業にはルートユーザーを使わない','ルートユーザーのアクセスキーを作って、開発者と共有する','ルートユーザーのパスワードをチームで共有する','ルートユーザーを削除する'],[0,1],
 '<b>正解：MFA を有効、日常で使わない</b>。<br>×アクセスキーを作って共有：最悪。アクセスキーは作らない。<br>×パスワードの共有：×。<br>×削除：ルートユーザーは削除できない。');
Q(2,'ルートユーザーでしか行えない作業はどれか。',
 ['AWS アカウントの解約（閉鎖）','IAM ユーザーの作成','EC2 インスタンスの起動','S3 バケットの作成'],[0],
 '<b>正解：AWS アカウントの解約</b>。ほかに、ルートユーザーの設定の変更、一部の請求の設定など。<br>×他の3つ：権限のある IAM ユーザーでできる。');
Q(2,'ユーザーに、仕事に必要な権限だけを与えるという原則はどれか。',
 ['最小権限の原則','責任共有モデル','多層防御','職務の分離'],[0],
 '<b>正解：最小権限の原則</b>（Principle of Least Privilege）。<br>×責任共有モデル：AWS とお客様の分担。<br>×多層防御：何層にも守ること。<br>×職務の分離：1人に権限を集中させないこと。');
Q(2,'EC2 インスタンス上のアプリから S3 バケットを読み書きしたい。最も安全な方法はどれか。',
 ['IAM ロールを作って EC2 インスタンスに付ける','IAM ユーザーのアクセスキーをアプリのコードに書く','ルートユーザーのアクセスキーを使う','S3 バケットを誰でも読み書きできるように公開する'],[0],
 '<b>正解：IAM ロールを EC2 に付ける</b>。一時的な認証情報が自動で配られ、ローテーションも自動。<br>×アクセスキーをコードに：漏れる危険。<br>×ルートのアクセスキー：最悪。<br>×公開：論外。<div class="mem">ロール＝役の衣装。キーをポケットに入れず、衣装を着せる。</div>');
Q(2,'社員が、会社の複数の AWS アカウントと業務アプリに、1回のログインでアクセスできるようにしたい。最も適切なサービスはどれか。',
 ['AWS IAM Identity Center','Amazon Cognito','AWS Directory Service','AWS Secrets Manager'],[0],
 '<b>正解：AWS IAM Identity Center</b>（旧 AWS Single Sign-On）。合図は「社員」「複数アカウント」「1回のログイン」。<br>×Cognito：アプリの利用者（お客様）のログイン。<br>×Directory Service：Active Directory のマネージド。<br>×Secrets Manager：秘密情報の保管。');
Q(2,'アプリが使う DB のパスワードを安全に保管し、定期的に自動で変更（ローテーション）したい。最も適切なサービスはどれか。',
 ['AWS Secrets Manager','AWS KMS','AWS Certificate Manager','AWS Artifact'],[0],
 '<b>正解：AWS Secrets Manager</b>。合図は「パスワード」「自動ローテーション」。<br>×KMS：暗号鍵の管理（パスワードの保管ではない）。<br>×Certificate Manager：SSL/TLS 証明書。<br>×Artifact：レポート。');
Q(2,'規制のため、暗号鍵を自社専用のハードウェアで管理する必要がある。最も適切なサービスはどれか。',
 ['AWS CloudHSM','AWS KMS','AWS Secrets Manager','Amazon Macie'],[0],
 '<b>正解：AWS CloudHSM</b>。合図は「専用のハードウェア」。<br>×KMS：マネージドの鍵管理（ハードウェアは共有）。');
Q(2,'Web サイトの通信を HTTPS で暗号化するための SSL/TLS 証明書を、無料で発行し、自動で更新したい。最も適切なサービスはどれか。',
 ['AWS Certificate Manager','AWS KMS','AWS CloudHSM','AWS WAF'],[0],
 '<b>正解：AWS Certificate Manager（ACM）</b>。合図は「SSL/TLS 証明書」「HTTPS」「自動で更新」。ACM は証明書を発行・管理し、期限の前に自動で更新する。ELB や CloudFront などで使う公開証明書は無料。通信時の暗号化（in transit）の担当。<br>×KMS：データを暗号化する<b>鍵</b>を作って管理する（S3・EBS などの保存時の暗号化でよく使う）。<b>証明書</b>は発行しない。「暗号化」の言葉につられやすい。<br>×CloudHSM：専用のハードウェア（HSM）で鍵を自分で管理する。これも証明書は発行しない。<br>×WAF：Web アプリへの攻撃を防ぐ。<br>覚え方：「証明書・HTTPS」＝ ACM、「鍵」＝ KMS（専用ハードなら CloudHSM）。');
Q(2,'GuardDuty、Inspector、Macie などの検出結果を一か所にまとめ、ベストプラクティスに対する点数で見たい。最も適切なサービスはどれか。',
 ['AWS Security Hub','Amazon Detective','AWS Config','AWS Trusted Advisor'],[0],
 '<b>正解：AWS Security Hub</b>（集約のハブ）。<br>×Detective：問題の根本原因の調査。<br>×Config：設定の準拠。<br>×Trusted Advisor：ベストプラクティスの点検だが、他のサービスの結果は集めない。','TRAP 11');
Q(2,'組織の複数のアカウントに、AWS WAF のルールとセキュリティグループのルールを一括で適用・管理したい。最も適切なサービスはどれか。',
 ['AWS Firewall Manager','AWS Shield Standard','ネットワーク ACL','AWS IAM'],[0],
 '<b>正解：AWS Firewall Manager</b>。合図は「複数のアカウント」「一括」「ルール」。');
Q(2,'AWS のコンプライアンスについて、正しいものはどれか。',
 ['使えるコンプライアンスの認証は、サービスやリージョンによって違う','AWS を使えば、お客様のアプリも自動的にすべての規制に準拠する','コンプライアンスはすべて AWS の責任である','AWS Artifact を使えば、お客様のアプリの監査も AWS が行う'],[0],
 '<b>正解：サービスやリージョンによって違う</b>。<br>×自動的にすべて準拠：言い切り。お客様の設定の責任が残る。<br>×すべて AWS の責任：責任共有モデル。<br>×Artifact で AWS がお客様を監査：Artifact はレポートの入手先。','TRAP 07');
Q(2,'AWS の上で使えるサードパーティのセキュリティ製品（ファイアウォール、ウイルス対策など）を探して購入したい。どこを使うか。',
 ['AWS Marketplace','AWS Artifact','AWS Trusted Advisor','AWS re:Post'],[0],
 '<b>正解：AWS Marketplace</b>。合図は「サードパーティ（他社）」「探して購入」。他社のソフトウェアを探して買い、AWS の上ですぐ使えるカタログ。代金は AWS の請求書にまとまる。<br>×Trusted Advisor：自分のアカウントをベストプラクティス（コスト・セキュリティ・耐障害性など）で点検して<b>改善を勧める</b>。「セキュリティ」の言葉につられやすいが、製品は売っていない。<br>×Artifact：AWS のコンプライアンスレポート（SOC・PCI など）や契約書をダウンロードする所。<br>×re:Post：質問と回答のコミュニティ。<br>覚え方：「他社製品を買う」＝ Marketplace、「自分の環境の点検・推奨」＝ Trusted Advisor。');
Q(2,'データの暗号化について、正しいものはどれか。',
 ['保存時の暗号化（at rest）には AWS KMS の鍵を使える','通信時の暗号化（in transit）には TLS を使う','暗号化を有効にするかどうかは、すべて AWS が決める','S3 のデータは、暗号化する方法がない','暗号化をすると、IAM の権限は不要になる'],[0,1],
 '<b>正解：保存時は KMS、通信時は TLS</b>。<br>×すべて AWS が決める：お客様が設定する。<br>×S3 は暗号化できない：誤り（今は新しいオブジェクトは既定で暗号化される）。<br>×IAM 不要：アクセス管理は別に必要。');

/* ---- ドメイン3：クラウドのテクノロジーとサービス ---- */
Q(3,'Web アプリを高可用性にするために、最も適切な設計はどれか。',
 ['複数のアベイラビリティーゾーンに EC2 インスタンスを配置し、ロードバランサーで分散する','1つのアベイラビリティーゾーンに、大きな EC2 インスタンスを1台置く','1つのアベイラビリティーゾーンに、EC2 インスタンスを3台置く','EC2 インスタンスのインスタンスストアにデータを保存する'],[0],
 '<b>正解：複数の AZ ＋ ロードバランサー</b>。合図は「高可用性」→ マルチ AZ。<br>×1つの AZ：AZ ごと止まると全部止まる（台数を増やしても同じ）。<br>×インスタンスストア：止めると消える。','TRAP 03');
Q(3,'アベイラビリティーゾーン（AZ）の説明として、正しいものはどれか。',
 ['1つ以上のデータセンターの集まりで、他の AZ と電源やネットワークが独立している','世界中にあるキャッシュ用の拠点','1つの国にある、すべての AWS の施設','お客様のデータセンターに置く AWS の機器'],[0],
 '<b>正解：独立した1つ以上のデータセンターの集まり</b>。<br>×キャッシュの拠点：エッジロケーション。<br>×国のすべて：リージョンでもない（リージョンは地理的な場所）。<br>×お客様のデータセンターの機器：AWS Outposts。');
Q(3,'ある国の法律で、個人データを国外に保存してはいけない。AWS でこの要件を満たすために、最も重要な判断はどれか。',
 ['その国にある AWS リージョンを選ぶ','エッジロケーションの数が多いリージョンを選ぶ','複数のアベイラビリティーゾーンを使う','AWS Shield Advanced を有効にする'],[0],
 '<b>正解：リージョンを選ぶ</b>（データ主権）。お客様が選んだリージョンの外に、AWS が勝手にデータを移すことはない。<br>×エッジロケーション・マルチ AZ・Shield：場所の法令とは関係ない。','TRAP 04');
Q(3,'世界中のユーザーに、画像や動画などの静的なコンテンツを低遅延で配信したい。最も適切なサービスはどれか。',
 ['Amazon CloudFront','AWS Direct Connect','Amazon Route 53','AWS Global Accelerator'],[0],
 '<b>正解：Amazon CloudFront</b>（エッジロケーションでキャッシュ）。<br>×Direct Connect：専用線。<br>×Route 53：DNS。<br>×Global Accelerator：通信の経路を速くするが、キャッシュはしない。');
Q(3,'画像がアップロードされたときに、サーバーを管理せずに、自動でサムネイルを作る処理を動かしたい。最も適切なサービスはどれか。',
 ['AWS Lambda','Amazon EC2','Amazon Lightsail','AWS Outposts'],[0],
 '<b>正解：AWS Lambda</b>。合図は「イベント（アップロード）で」「サーバーを管理せずに」。<br>×EC2・Lightsail：サーバーの管理が必要。<br>×Outposts：オンプレミス。','TRAP 02');
Q(3,'コンテナを動かしたいが、サーバー（EC2 インスタンス）の管理はしたくない。最も適切なサービスはどれか。',
 ['AWS Fargate','Amazon EC2','Amazon ECR','AWS Batch'],[0],
 '<b>正解：AWS Fargate</b>（コンテナのサーバーレス）。ECS や EKS の実行環境として使う。<br>×EC2：サーバー管理が必要。<br>×ECR：イメージの保管庫（実行しない）。<br>×Batch：バッチ処理。');
Q(3,'Kubernetes を使ってコンテナを管理したい。最も適切なサービスはどれか。',
 ['Amazon EKS','Amazon ECS','Amazon ECR','AWS Elastic Beanstalk'],[0],
 '<b>正解：Amazon EKS</b>（Elastic Kubernetes Service）。合図は「Kubernetes」。<br>×ECS：AWS 独自のコンテナ管理。<br>×ECR：イメージの保管庫。');
Q(3,'開発者は、インフラの設定を気にせず、Web アプリのコードをアップロードするだけで、負荷分散や自動スケーリングを含む環境を用意したい。最も適切なサービスはどれか。',
 ['AWS Elastic Beanstalk','AWS CloudFormation','Amazon EC2','AWS CodeBuild'],[0],
 '<b>正解：AWS Elastic Beanstalk</b>。合図は「コードを上げるだけ」。<br>×CloudFormation：インフラをテンプレートで自分で定義する。<br>×EC2：自分で全部。<br>×CodeBuild：ビルドとテスト。');
Q(3,'MySQL を使うアプリの DB を、運用の手間を最小にして AWS で動かしたい。バックアップとパッチは自動にしたい。最も適切なサービスはどれか。',
 ['Amazon RDS','EC2 インスタンスに MySQL をインストールする','Amazon DynamoDB','Amazon Redshift'],[0],
 '<b>正解：Amazon RDS</b>（マネージドのリレーショナル DB）。<br>×EC2 に入れる：パッチもバックアップも自分。<br>×DynamoDB：NoSQL。MySQL ではない。<br>×Redshift：分析用のデータウェアハウス。','TRAP 02');
Q(3,'ゲームの利用者のデータを、大規模でも1桁ミリ秒で読み書きしたい。スキーマは柔軟にしたく、サーバーの管理もしたくない。最も適切なサービスはどれか。',
 ['Amazon DynamoDB','Amazon RDS','Amazon Redshift','Amazon Neptune'],[0],
 '<b>正解：Amazon DynamoDB</b>（サーバーレスの NoSQL）。合図は「1桁ミリ秒」「大規模」「柔軟なスキーマ」「サーバーレス」。<br>×RDS：リレーショナル。<br>×Redshift：分析。<br>×Neptune：グラフ。');
Q(3,'DB への同じ読み込みが多く、応答が遅い。よく読まれるデータをメモリに置いて、応答を速くしたい。最も適切なサービスはどれか。',
 ['Amazon ElastiCache','Amazon S3 Glacier','Amazon EBS','AWS Backup'],[0],
 '<b>正解：Amazon ElastiCache</b>（インメモリのキャッシュ）。');
Q(3,'何年も保管が必要だが、めったに取り出さない記録を、最も安く保存したい。取り出しに12時間ほどかかってもよい。最も適切なものはどれか。',
 ['S3 Glacier Deep Archive','S3 Standard','S3 Intelligent-Tiering','Amazon EBS'],[0],
 '<b>正解：S3 Glacier Deep Archive</b>（最も安い）。合図は「何年も」「めったに」「時間がかかってもよい」。<br>×Standard：よく使うデータ。<br>×Intelligent-Tiering：パターンが分からないとき。<br>×EBS：EC2 のディスク。','TRAP 01');
Q(3,'データへのアクセスの頻度が予測できず、変わる。運用の手間なく、ストレージのコストを最適化したい。最も適切な S3 のストレージクラスはどれか。',
 ['S3 Intelligent-Tiering','S3 Standard-IA','S3 One Zone-IA','S3 Glacier Flexible Retrieval'],[0],
 '<b>正解：S3 Intelligent-Tiering</b>。合図は「予測できない」「変わる」。アクセスに応じて自動で階層を移す。<br>×Standard-IA：たまに使う、と分かっているとき。<br>×One Zone-IA：1つの AZ だけ。<br>×Glacier Flexible：アーカイブ。');
Q(3,'S3 に保存したログを、30日後に安いクラスに移し、1年後に削除したい。最も適切な方法はどれか。',
 ['S3 ライフサイクルポリシーを設定する','AWS Backup で毎日コピーする','EC2 で毎日スクリプトを動かす','S3 Transfer Acceleration を有効にする'],[0],
 '<b>正解：S3 ライフサイクルポリシー</b>。日数で自動に移動・削除できる。<br>×Backup・EC2 のスクリプト：手間がかかる。<br>×Transfer Acceleration：アップロードを速くする機能。');
Q(3,'複数の Linux の EC2 インスタンスから、同時に同じファイルを読み書きしたい。最も適切なストレージはどれか。',
 ['Amazon EFS','Amazon EBS','インスタンスストア','S3 Glacier Deep Archive'],[0],
 '<b>正解：Amazon EFS</b>（共有ファイル）。合図は「複数のインスタンスから同時に」。<br>×EBS：基本的に1つのインスタンスのディスク。<br>×インスタンスストア：一時的。');
Q(3,'Windows のアプリが使う、SMB のファイル共有をマネージドで用意したい。最も適切なサービスはどれか。',
 ['Amazon FSx for Windows File Server','Amazon EFS','Amazon EBS','AWS Storage Gateway'],[0],
 '<b>正解：Amazon FSx for Windows File Server</b>。合図は「Windows」「SMB」。<br>×EFS：Linux 向け（NFS）。');
Q(3,'オンプレミスのアプリから、AWS のストレージを使いたい。よく使うデータは手元にキャッシュして、速く読みたい。最も適切なサービスはどれか。',
 ['AWS Storage Gateway','AWS Direct Connect','Amazon EFS','Amazon CloudFront'],[0],
 '<b>正解：AWS Storage Gateway</b>（ハイブリッドのストレージ）。<br>×Direct Connect：専用線（ストレージではない）。<br>×CloudFront：ユーザーへの配信のキャッシュ。');
Q(3,'セキュリティグループの説明として、正しいものはどれか。',
 ['インスタンス単位で働き、ステートフルである','サブネット単位で働き、ステートレスである','拒否のルールを書ける','AWS が設定する責任を持つ'],[0],
 '<b>正解：インスタンス単位、ステートフル</b>（戻りの通信は自動で許可）。<br>×サブネット単位・ステートレス・拒否：ネットワーク ACL の特徴。<br>×AWS が設定：お客様が設定する。');
Q(3,'サブネットへの、特定の IP アドレスからの通信を拒否したい。最も適切なものはどれか。',
 ['ネットワーク ACL','セキュリティグループ','Amazon Route 53','インターネットゲートウェイ'],[0],
 '<b>正解：ネットワーク ACL</b>。合図は「サブネット」「拒否」。<br>×セキュリティグループ：許可のルールだけ。拒否は書けない。');
Q(3,'プライベートサブネットにある EC2 インスタンスから、ソフトウェアの更新のためにインターネットに出たい。ただし、インターネットからの接続は受けたくない。最も適切なものはどれか。',
 ['NAT ゲートウェイ','インターネットゲートウェイを直接つなぐ','AWS Direct Connect','Amazon CloudFront'],[0],
 '<b>正解：NAT ゲートウェイ</b>（中から外へ出るだけ）。<br>×インターネットゲートウェイを直接：外からも入れるパブリックになる。');
Q(3,'独自のドメイン名を登録し、DNS の名前解決と、正常なサーバーへの振り分け（ヘルスチェック）をしたい。最も適切なサービスはどれか。',
 ['Amazon Route 53','Amazon CloudFront','Elastic Load Balancing','Amazon VPC'],[0],
 '<b>正解：Amazon Route 53</b>（DNS、ドメイン登録、ヘルスチェック）。');
Q(3,'オンプレミスのデータセンターと AWS の間で、インターネットを通らない、安定した帯域の専用の接続が欲しい。最も適切なサービスはどれか。',
 ['AWS Direct Connect','AWS Site-to-Site VPN','AWS Client VPN','Amazon CloudFront'],[0],
 '<b>正解：AWS Direct Connect</b>（専用線）。合図は「インターネットを通らない」「安定した帯域」。<br>×Site-to-Site VPN：インターネット経由の暗号化。すぐ・安く始められるが、帯域は安定しない。<br>×Client VPN：個人の端末から。');
Q(3,'本社と AWS の VPC を、すぐに、低コストで、暗号化して接続したい。最も適切なサービスはどれか。',
 ['AWS Site-to-Site VPN','AWS Direct Connect','AWS Transit Gateway','Amazon Route 53'],[0],
 '<b>正解：AWS Site-to-Site VPN</b>。合図は「すぐ」「低コスト」「暗号化」。<br>×Direct Connect：開通に時間がかかり、費用も高い。');
Q(3,'同じ環境を、テンプレートを使って、何度でも同じように作りたい（インフラをコードで管理したい）。最も適切なサービスはどれか。',
 ['AWS CloudFormation','AWS Elastic Beanstalk','AWS Systems Manager','AWS Config'],[0],
 '<b>正解：AWS CloudFormation</b>（Infrastructure as Code）。<br>×Beanstalk：アプリの環境を自動で用意（テンプレートを書く話ではない）。<br>×Systems Manager：運用管理。<br>×Config：設定の記録。');
Q(3,'EC2 インスタンスの CPU 使用率が80％を超えたら、管理者に通知したい。最も適切なサービスの組み合わせはどれか。',
 ['Amazon CloudWatch のアラームと Amazon SNS','AWS CloudTrail と Amazon SQS','AWS Config と AWS Artifact','AWS Trusted Advisor と Amazon SES'],[0],
 '<b>正解：CloudWatch のアラーム ＋ SNS</b>。性能の数値は CloudWatch、通知は SNS。<br>×CloudTrail：API の記録。SQS はキュー。','TRAP 06');
Q(3,'注文を受けるシステムと、注文を処理するシステムを疎結合にしたい。処理側が混んでいても、注文が失われないようにためておきたい。最も適切なサービスはどれか。',
 ['Amazon SQS','Amazon SNS','Amazon SES','Amazon Kinesis'],[0],
 '<b>正解：Amazon SQS</b>（キュー）。合図は「疎結合」「ためておく」。<br>×SNS：1対多の通知（ためない）。<br>×SES：メール送信。<br>×Kinesis：ストリーミングデータの分析。');
Q(3,'1つのイベントを、メール、SMS、複数のアプリに同時に通知したい。最も適切なサービスはどれか。',
 ['Amazon SNS','Amazon SQS','AWS Step Functions','Amazon Connect'],[0],
 '<b>正解：Amazon SNS</b>（Pub/Sub、1対多、ファンアウト）。');
Q(3,'S3 に保存した CSV のログを、サーバーを用意せずに、SQL で直接分析したい。最も適切なサービスはどれか。',
 ['Amazon Athena','Amazon Redshift','Amazon RDS','Amazon EMR'],[0],
 '<b>正解：Amazon Athena</b>。合図は「S3 のデータに」「サーバーなしで」「SQL」。<br>×Redshift：データをロードして使うデータウェアハウス。<br>×RDS：トランザクション用の DB。<br>×EMR：Hadoop・Spark のクラスター。');
Q(3,'Web サイトのクリックの記録を、リアルタイムで集めて処理したい。最も適切なサービスはどれか。',
 ['Amazon Kinesis','AWS Glue','Amazon S3 Glacier','AWS Batch'],[0],
 '<b>正解：Amazon Kinesis</b>（リアルタイムのストリーミング）。<br>×Glue：ETL（定期的なデータ変換）。<br>×Batch：バッチ処理（リアルタイムではない）。');
Q(3,'紙の請求書をスキャンした画像から、文字や表、フォームの項目を自動で取り出したい。最も適切なサービスはどれか。',
 ['Amazon Textract','Amazon Rekognition','Amazon Comprehend','Amazon Transcribe'],[0],
 '<b>正解：Amazon Textract</b>（テキストを抽出）。<br>×Rekognition：顔・物体の認識（書類の項目の抽出ではない）。<br>×Comprehend：文章の意味・感情の分析。<br>×Transcribe：音声の文字起こし。');
Q(3,'コールセンターの通話の録音を文字に起こし、その文章からお客様の感情（肯定的・否定的）を分析したい。使うサービスの組み合わせとして最も適切なものはどれか。',
 ['Amazon Transcribe と Amazon Comprehend','Amazon Polly と Amazon Translate','Amazon Rekognition と Amazon Lex','Amazon Textract と Amazon Polly'],[0],
 '<b>正解：Transcribe（音声 → テキスト）と Comprehend（感情の分析）</b>。<br>×Polly：テキスト → 音声（向きが逆）。<br>×Rekognition：画像。Lex：チャットボット。<div class="mem">書き起こす（Transcribe）→ 理解する（Comprehend）。</div>');
Q(3,'機械学習のモデルを作って、学習させ、本番に公開（デプロイ）するまでを行いたい。最も適切なサービスはどれか。',
 ['Amazon SageMaker AI','Amazon Lex','Amazon Quick','AWS Glue'],[0],
 '<b>正解：Amazon SageMaker AI</b>（旧 Amazon SageMaker）。<br>×Lex：チャットボット。<br>×Quick：BI。<br>×Glue：ETL。');
Q(3,'需要に応じて EC2 インスタンスの台数を自動で増減し、アクセスを正常なインスタンスに振り分けたい。使うものはどれか。',
 ['Amazon EC2 Auto Scaling','Elastic Load Balancing','Amazon CloudFront','AWS Direct Connect','Amazon Route 53 のドメイン登録'],[0,1],
 '<b>正解：EC2 Auto Scaling（台数の増減）と Elastic Load Balancing（振り分け）</b>。<br>×CloudFront：キャッシュ配信。<br>×Direct Connect：専用線。<br>×ドメイン登録：名前の登録。');
